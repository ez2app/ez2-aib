[package]
name = "aib-forkcount"
description = "Count forks under monitored process trees (legacy AIB before / after measurement, not shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aib-procwatch = { path = "../aib-procwatch" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# getuid for the goal-2 fixture shim: it must not fork (it sits on the measured path)
nix = { version = "0.31.3", features = ["user"] }

[lints]
workspace = true
