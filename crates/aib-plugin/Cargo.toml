[package]
name = "aib-plugin"
description = "The AIB plugin area: finds the plugins under <AIB home>/plugins, reads each one's aib-plugin.json, keeps its on / off switch, and runs a plugin's command only when the switch is on and the executable is the one that was installed."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aib-ledger = { path = "../aib-ledger" }
serde = "1"
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
