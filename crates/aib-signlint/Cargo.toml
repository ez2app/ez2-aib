[package]
name = "aib-signlint"
description = "Reads a sign-off script (SIGN-*.sh) and says where it can fail without saying so: pipefail with an early-stopping stage, swallowed failures, output read without the exit code, an unreachable host taken as an absent file, a restore that never reads back. Each rule answers yes or unknown; unknown is not a pass."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1"

[lints]
workspace = true
