[package]
name = "aib-test-cargo"
description = "aib test 2.0 cargo adapter (S69-u2): cargo-nextest as the runner; its test list and JUnit result read into aib-test-core outcomes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aib-test-core = { path = "../aib-test-core" }
# rfc3339 for the ledger lines (already a dependency of aib-test-core)
aib-ledger = { path = "../aib-ledger" }
# already in the lock (aib-accept, aib-cireuse …): no new dependency
serde_json = "1"

[[bin]]
name = "aib-test-rs"
path = "src/main.rs"

[lints]
workspace = true
