[package]
name = "aib-cireuse"
description = "Read-only shadow: could a main push have reused the CI result its PR already earned? Records only; never writes a status, never skips a cell."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# run_fixed: every gh call has a deadline (1ced7 S68 L3)
aib-ghread = { path = "../aib-ghread" }
serde_json = "1"

[dev-dependencies]
# only to read the build records the way binsync will (tests/buildinfo.rs)
aib-release = { path = "../aib-release" }

[lints]
workspace = true
