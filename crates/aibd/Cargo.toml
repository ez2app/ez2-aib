[package]
name = "aibd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# record kinds on the card window: one rule set, the flow board's (519d0 r16 ruling 2)
regex = "1"
aib-core = { path = "../aib-core" }
aib-dmq = { path = "../aib-dmq" }
# N-web-dmbridge: a letter to an old-style seat written with the 1.x locks and byte form
aib-dmq-store = { path = "../aib-dmq-store" }
# N-workspace wave 3: node_set moves stations by aib-plan's own entry conditions (card::entry_problems)
aib-plan = { path = "../aib-plan" }
# GET /api/v1/hosts: the hosts file, ssh arguments and answer parsing of aib-lease hosts (a9136 11-18)
aib-lease = { path = "../aib-lease" }
aib-drive = { path = "../aib-drive" }
aib-idea = { path = "../aib-idea" }
aib-ledger = { path = "../aib-ledger" }
aib-notify = { path = "../aib-notify" }
aib-seatopen = { path = "../aib-seatopen" }
aib-store = { path = "../aib-store" }
# N-web-dmbridge: imported text cleaned with the approval window's rule (5d33a BOUNDARY §5)
aib-approve = { path = "../aib-approve" }
# receipt_runner.rs: the gate's own reading of a command line and its tree rules, so what aibd
# sends is what the gate takes (N-webonly 第 4 件, b4297 11-20)
aib-receipt-gate = { path = "../aib-receipt-gate" }
aib-sys = { path = "../aib-sys" }
aib-thermal = { path = "../aib-thermal" }
axum = "0.8.9"
base64 = "0.23.1"
directories = "6.0.0"
# S89-events-push: the Stream trait the SSE body is read through (already in the lock via axum)
futures-core = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
# network: this computer's interface addresses for host_addr::own_addresses (hostmode r4 §2,
# sandboxnet r6 §15.1; 3e53b 11-23). No new crate: Windows' `windows` gains IpHelper / WinSock.
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "network"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[features]
# Embed the built-in pages (plain HTML / JS / CSS in apps/web/dist, or AIBD_WEB_DIST) into
# aibd (build.rs); no build step. On by default (519d0 11-18 05:2x): every aibd has its
# built-in pages. With the folder missing, or with --no-default-features, every non-API
# path is `404 web_not_built`.
default = ["web"]
web = []

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process", "user", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only for knife G1a (aibd.yml): it puts the libproc 0.15 child listing back to
# prove the stale-errno bug. aibd itself lists through aib-sys. Do not drop it
# as unused without removing that knife (043dd G1 N1).
libproc = "0.15.0"
nix = { version = "0.31.3", features = ["signal", "process", "event", "user", "fs"] }
