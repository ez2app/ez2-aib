[package]
name = "aibd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aib-core = { path = "../aib-core" }
aib-store = { path = "../aib-store" }
aib-sys = { path = "../aib-sys" }
axum = "0.8.9"
base64 = "0.23.1"
directories = "6.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[features]
# Embed the built web workbench (apps/web/dist, or AIBD_WEB_DIST) into aibd (build.rs).
# Off by default: without it every non-API path is `404 web_not_built` and no node is needed.
web = []

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only for knife G1a (aibd.yml): it puts the libproc 0.15 child listing back to
# prove the stale-errno bug. aibd itself lists through aib-sys. Do not drop it
# as unused without removing that knife (043dd G1 N1).
libproc = "0.15.0"
nix = { version = "0.31.3", features = ["signal", "process", "event"] }
