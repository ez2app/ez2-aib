[package]
name = "aib-slice"
description = "S73a: before a merge, list every branch that may still need merging (six classes), as aib-slice-sweep.v1 JSON. Read-only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1"
aib-ghread = { path = "../aib-ghread" }
sha2 = "0.10.9"
aib-ledger = { path = "../aib-ledger" }
# disk: the free space a clean event records (IFACE-s107-product §2.1 frees); no new package in Cargo.lock
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
