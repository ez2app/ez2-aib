[package]
name = "aib-sys"
description = "The one crate allowed to call OS APIs directly: process M1–M5 (ADR 0004) and thermal T1–T2 (R1); API list v0.4"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Not `workspace = true`: the workspace forbids unsafe code and this crate is
# the single, reviewed exception. Every other lint matches the workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
# DECISION-t135b-objc2-deps (519d0 11-13): exact versions, no default features, only
# what `presence_macos` uses (LAContext; NSString for the reason, NSData for the probe's
# application password). objc2-foundation is already pulled in by the LAContext feature;
# it is named here because the code builds NSString / NSData itself.
objc2 = { version = "=0.6.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSData",
    "NSString",
    "std",
] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = [
    "LABiometryType", # S10-2 measurement: owner_check_state reads biometryType (DESIGN-persona-propose-osverify-c2f0b-1123 r3 §8)
    "LAContext",
    "block2", # S10-2b-1: evaluatePolicy:localizedReason:reply: (finger first, DESIGN-s10-2b-nofinger-c2f0b-1125 r1 §7a)
    "std",
] }
# DECISION-t135b-objc2-deps item 1 ("block2 / LAError when the signing flow needs them";
# ebab8 11-25 13:09): the reply block for evaluatePolicy. Exact version, no default
# features; its only dependency is objc2 (already locked at 0.6.3).
block2 = { version = "=0.6.2", default-features = false, features = ["alloc"] }

# DECISION-11 A (bb7dc conditions): exact version, locked in Cargo.lock,
# only the features `job` uses, plus Win32_System_RemoteDesktop for `hello`'s session check
# (S102, DESIGN-S102-windows-hello-56cda-1115 r1). `aib-xtask deps` checks this list.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi", # AP26 W-5: CreateDesktopW / RegisterClassW need it (BitBlt etc.: test code only, source guard)
    "Win32_Security",
    "Win32_Security_Cryptography", # S10-3 / W1b hello_ncrypt: NCrypt Passport key + BCryptHash
    "Win32_Security_Cryptography_Catalog", # L1 (08de5 11-26): WinTrust signer helpers need it
    "Win32_Security_Cryptography_Sip", # L1: same
    "Win32_Security_WinTrust", # L1: Authenticode check of a downloaded AI CLI (wintrust.rs)
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader", # AP26 W-5: passphrase window class (PRE-READ-w4-winsys-features)
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops", # AP26 W-5: aibd's own desktop
    "Win32_System_SystemInformation", # sysdir: GetSystemDirectoryW for host_ssh (3e53b DEEP2 T1)
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", # AP26 W-5 SetFocus (SendInput: test code only, source guard)
    "Win32_UI_WindowsAndMessaging", # AP26 W-5 passphrase window, WDA_EXCLUDEFROMCAPTURE
] }

# AP26 W-4 (PRE-READ-w4-winsys-features 3e53b condition 1): features only the owner-present
# measurement tests use (the CredUI comparison window). Dev only, so product code calling them does not compile.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security_Credentials",
    "Win32_System_Com",
] }
