[package]
name = "aib-sys"
description = "The one crate allowed to call OS APIs directly: process M1–M5 (ADR 0004) and thermal T1–T2 (R1); API list v0.4"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Not `workspace = true`: the workspace forbids unsafe code and this crate is
# the single, reviewed exception. Every other lint matches the workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
# DECISION-t135b-objc2-deps (519d0 11-13): exact versions, no default features, only
# what `presence_macos` uses (LAContext; NSString for the reason, NSData for the probe's
# application password). objc2-foundation is already pulled in by the LAContext feature;
# it is named here because the code builds NSString / NSData itself.
objc2 = { version = "=0.6.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSData",
    "NSString",
    "std",
] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = [
    "LAContext",
    "std",
] }

# DECISION-11 A (bb7dc conditions): exact version, locked in Cargo.lock,
# only the features `job` uses. `aib-xtask deps` checks this list.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
