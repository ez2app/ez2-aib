[package]
name = "aib-plan"
description = "Cabin progress tree in the terminal: collapsible expectation -> item -> task -> extension work, for a tmux middle pane (aib plan --watch)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "aib-plan"
path = "src/main.rs"

[dependencies]
# run_fixed: the 卡在哪 PR reads have a deadline (S79 n-2a)
aib-ghread = { path = "../aib-ghread" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
