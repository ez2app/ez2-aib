description = "Host lease for a holder on another machine: queue add / acquire take --host + the holder's pid + --heartbeat-s; liveness is the heartbeat, not a local kill -0. Reads and writes the 1.x lease files (host_lease.py format)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
