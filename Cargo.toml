[workspace]
resolver = "2"
members = ["crates/aib-core", "crates/aib-store", "crates/aib-sys", "crates/aibd", "crates/aib-procwatch", "crates/aib-forkcount", "crates/aib-fixture-tree", "crates/aib-cloud", "crates/aib-cireuse", "crates/aib-release", "crates/aib-lease", "crates/aib-thermal", "crates/aib-flaky", "xtask", "crates/aib-cloud-host", "crates/aib-cloud-cli", "crates/aib-signlint", "crates/aib-consent", "crates/aib-drive", "crates/aib-plan", "crates/aib-title", "crates/aib-expect", "crates/aib-ghread", "crates/aib-seatopen"]

[workspace.package]
version = "0.2.0-preview.5"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
