[workspace]
resolver = "2"
members = [
    "crates/aib-core",
    "crates/aib-store",
    "crates/aib-sys",
    "crates/aibd",
    "crates/aib-procwatch",
    "crates/aib-forkcount",
    "crates/aib-fixture-tree",
    "crates/aib-cloud",
    "crates/aib-fp",
    "crates/aib-cireuse",
    "crates/aib-release",
    "crates/aib-lease",
    "crates/aib-thermal",
    "crates/aib-flaky",
    "xtask",
    "crates/aib-cloud-host",
    "crates/aib-cloud-cli",
    "crates/aib-signlint",
    "crates/aib-consent",
    "crates/aib-drive",
    "crates/aib-plan",
    "crates/aib-plugin",
    "crates/aib-receipt-gate",
    "crates/aib-title",
    "crates/aib-expect",
    "crates/aib-ghread",
    "crates/aib-seatops",
    "crates/aib-accept",
    "crates/aib-verify",
    "crates/aib-approve",
    "crates/aib-dmq",
    "crates/aib-dmq-store",
    "crates/aib-knife",
    "crates/aib-seatopen",
    "crates/aib-public-leak",
    "crates/aib-seathook",
    "crates/aib-persona",
    "crates/aib-idea",
    "crates/aib-stalehead",
    "crates/aib-tidy",
    "crates/aib-policy",
    "crates/aib-reflect",
    "crates/aib-ledger",
    "crates/aib-review",
    "crates/aib-opinion",
    "crates/aib-own-gate",
    "crates/aib-pending",
    "crates/aib-slice",
    "crates/aib-mergewatch",
    "crates/aib-mergecheck",
    "crates/aib-notify",
    "crates/aib-wincheck",
]

[workspace.package]
version = "0.2.0-preview.8"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"

# aibd digests its own executable at every start (pair_carry::exe). In a test that executable is the
# test binary (74 MB for the smallest one), and sha2 without optimisation does about 20 MB/s: 3.6 s of
# every test daemon's start on a quiet machine, and past the harness's 20 s on a busy runner (main run
# 45048586994, rust macOS: seat_input_harness.rs:113 Elapsed). Optimising this one package changes no
# behaviour and no shipped build (release is optimised already).
[profile.dev.package.sha2]
opt-level = 3
