## EU02 installimage 設定(4542e 11-08):Debian 13 + mdadm RAID1 + LVM(root 40G,其餘留給 LVM-thin)
## 在 Hetzner Rescue 內跑:installimage -a -c /root/installimage-eu02-lvmthin.conf
## 會把兩顆 NVMe 全部格式化 —— L2,Andy 當次准。
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
BOOTLOADER grub
HOSTNAME eu02
## 分割(11-08 22:0x 依 c477a / Codex / Antigravity 諮詢修訂):swap 8G、/boot 2G、其餘整個給 LVM vg0
## 層次:兩顆 NVMe → md RAID1 → PV → vg0;BIOS 機 installimage 會自建 bios_grub,不需 ESP
PART swap swap 8G
PART /boot ext4 2G
PART lvm vg0 all
## vg0 只切 root 64G(c477a:/var/lib/vz 的 ISO / 模板 / vzdump 暫存都在 root);**不要再加 LV … all**,剩餘留在 VG
## 裝完 PVE 後先 vgs 核對,再建 thin pool:容量 = VG 可用 − 25G 餘裕(metadata 擴充 / pmspare / lvextend),例:
##   lvcreate --type thin-pool -L <VG可用-25G> --poolmetadatasize 2G --poolmetadataspare y -n data vg0
##   pvesm add lvmthin local-lvm --vgname vg0 --thinpool data --content rootdir,images
LV vg0 root / ext4 64G
## 映像:在 Rescue 用 ls /root/images | grep -i trixie 確認實際檔名後再填
IMAGE /root/images/Debian-1305-trixie-amd64-base.tar.zst
