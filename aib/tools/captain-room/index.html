<style>
/* 傍晚的小辦公室,3/4 俯視;每一席是一位員工,人在哪、在做什麼 = 那一席的狀態。單一深色暖光外觀 */
:root {

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
body { background: var(--bg); color: var(--fg); font-family: var(--cjk); }
:root[lang="ko"] body { font-family: var(--cjk-kr); } :root[lang="ja"] body { font-family: var(--cjk-jp); } :root[lang="en"] body { font-family: "IBM Plex Sans", system-ui, var(--cjk); }
.langsel { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); }
.langsel select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.fleetbar { order: 9; flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #2a2416; border: 1px solid #5a4a20; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.fleetbar[hidden] { display: none; }
.fleetbar.done { background: #16261d; border-color: #2c5a3e; }
.langsel select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { padding-inline: 16px; padding-block: 18px 32px; max-width: 1280px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .02em; }
h1 span { color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-variant-numeric: tabular-nums; }

.chip.red b { color: var(--decide); } .chip.amber b { color: var(--gold); }
.hostsel select { max-width: 160px; } .hostsel button { font: inherit; font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; cursor: pointer; margin-left: 4px; }
.chip.alarm { border-color: var(--decide); color: var(--fg); animation: chipblink 1s steps(2) infinite; } @keyframes chipblink { 50% { background: rgba(239,95,87,0.28); } }
@font-face { font-family: "AIBNerd"; src: local("JetBrainsMono Nerd Font"), local("JetBrainsMonoNerdFont-Regular"), local("JetBrainsMonoNF-Regular"), url(/fonts/nerd.ttf) format("truetype"); }
.badge { font-family: "AIBNerd", "IBM Plex Mono", monospace; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; }   /* 艦長 10-11:logo 置中、放大 */
#demoBtn { font: inherit; font-size: 12.5px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; } #demoBtn[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
button { font: inherit; font-size: 12.5px; color: var(--fg); background: #23262c; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; align-items: start; }

canvas { touch-action: none; width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); background: #1a1714; }

.side .tabs { margin-bottom: 2px; }
.who { gap: 12px; }
.badge { width: 36px; height: 36px; border-radius: 10px; }

.stagebox { position: relative; }
.ctpanel { position: absolute; inset: 0; background: rgba(13,14,17,0.985); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }

.ctpanel .cthead input[type="text"] { flex: 1 1 260px; font: inherit; font-size: 12.5px; color: var(--fg); background: #0f1012; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.ctpanel .cthead select { font: inherit; font-size: 12px; color: var(--fg); background: #0f1012; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.ctpanel table { width: 100%; border-collapse: collapse; }

#ibPanel table { table-layout: fixed; width: 100%; }
#ibPanel mark { background: #6b5a12; color: inherit; border-radius: 3px; padding: 0 1px; }   /* D3 搜尋反白 */
#ibPanel .ibcard { margin-top: 5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.03); }   /* C2 訊息卡片 */

#ibPanel .ibcard .row button { max-width: 100%; white-space: normal; text-align: left; }
#ibPanel .ibcard input[type="text"] { flex: 1 1 160px; min-width: 0; font: inherit; font-size: 12px; color: var(--fg); background: #0f1012; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
#ibPanel th:nth-child(1) { width: 9%; } #ibPanel th:nth-child(2) { width: 14%; } #ibPanel th:nth-child(3) { width: 8%; } #ibPanel th:nth-child(5) { width: 9%; } #ibPanel th:nth-child(6) { width: 9%; } #ibPanel th:nth-child(7) { width: 10%; } #ibPanel th:nth-child(8) { width: 11%; }   /* C3:多一欄「讀 / 處理」 */
#ibPanel .tick { display: inline-block; min-width: 4.5em; }
#ibPanel .tick.on { color: #9be89b; } #ibPanel .tick.off { opacity: .55; }
#ibPanel td { overflow-wrap: anywhere; }
#ibPanel td.act { min-width: 0; }
#ibPanel td.act button { display: block; margin: 0 0 4px; }
.ctpanel td.doing { min-width: 170px; }
.ctpanel td.act select { min-width: 86px; border-color: var(--gold); }
.ctpanel td.act button, .ctpanel td.act select { font-size: 11px; padding: 2px 8px; margin: 0 2px 3px 0; }
.ctpanel td.act select { font: inherit; font-size: 11px; color: var(--fg); background: #0f1012; border: 1px solid var(--line); border-radius: 999px; }
.ctpanel .gsend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #111316; }
.ctpanel .gsend textarea { flex: 1 1 320px; font: inherit; font-size: 12.5px; color: var(--fg); background: #0f1012; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.trbox { margin: 4px 0 6px 10px; padding: 4px 8px; border-left: 2px solid var(--gold); font-size: 12.5px; line-height: 1.5; }
.item { font-size: 13px; line-height: 1.55; color: var(--fg); }
.meter { grid-template-columns: 52px 1fr 44px; font-size: 11.5px; }
.meter .track { height: 5px; background: #23262c; }
.lock { color: var(--dim); font-size: 11.5px; line-height: 1.5; }
.quiet { color: var(--dim); font-size: 11.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button { font-size: 11.5px; padding: 3px 10px; background: transparent; }
.actions button.danger { color: #ff9f9a; border-color: #5a2a26; }
.chat { border-top: none; padding-top: 0; gap: 8px; }
.chat h3 { display: none; }
.log { max-height: 160px; }
.quick button { background: transparent; }
.chat input { padding: 8px 10px; border-radius: 10px; }
.legend { border-top: none; padding-top: 0; gap: 6px; font-size: 12px; }
.sec h4 { margin: 2px 0 0; }
.notes { display: flex; flex-direction: column; gap: 6px; }
.notes details.note { border: 1px solid var(--line); border-radius: 10px; background: #101215; }

.notes details.note.sub { border: none; background: transparent; }
.notes details.note.sub > summary { padding: 4px 0; font-size: 12px; color: var(--dim); }

.who { display: flex; align-items: center; gap: 10px; }
.badge { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; color: #141414; font-size: 17px; flex-shrink: 0; }
.who .code { font-family: var(--mono); font-weight: 600; font-size: 16px; }

.item { font-size: 13.5px; line-height: 1.55; }

.meter .track { height: 6px; border-radius: 3px; background: #2a2e35; overflow: hidden; }

.sec label[hidden] { display: none; }
.sec select, .sec textarea, .sec input[type="color"] { font: inherit; font-size: 12.5px; color: var(--fg); background: #0f1012; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }

.lock { color: var(--dim); font-size: 12px; }

.chat { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }

    try { await api('/api/summary', { f1: cnt('f1'), f2: cnt('f2'), f3: cnt('f3'), street: cnt('street'), decide: people.filter(p => p.state === 'decide').length, unread: people.reduce((a, p) => a + (p.unread || 0), 0), online: people.length, hosts: hostsInfo.length, down: hostsInfo.filter(h => !h.local && !h.ok).length }); } catch (e) {}
  }
  setTimeout(pushSummary, 2500); setInterval(pushSummary, 8000);
})();
</script>
