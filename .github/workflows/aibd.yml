# SPDX-License-Identifier: Apache-2.0
# AIB 2.0 Rust workspace (aibd). The Python ci.yml / release.yml are untouched (ADR 0001).
# 11-09 Andy「Rust 兩格改成必過」(a63ab 派 1ced7):no paths filter any more — every PR and every main push
#   triggers this, so the two cells always report (a required check that never starts would block every PR).
#   The `changes` job decides: no Rust path touched (RUST_CI_PATHS in aib/tools/release/docs_only.py, the one list;
#   prepr reads it too) ⇒ both cells move to ubuntu and print one line; otherwise fmt / clippy / test run for real.
#   main push / mixed / cannot tell / anything under .github/** ⇒ real run. The decision runs from the base version.
name: aibd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    # 10: the no-new-python step builds aib-xtask cold (S59)
    timeout-minutes: 10
    outputs:
      run: ${{ steps.d.outputs.run }}
      cloud_host: ${{ steps.c.outputs.cloud_host }}
      cloud_host_why: ${{ steps.c.outputs.cloud_host_why }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 519d0 11-15 08:08 (f1fae BLOCKER-aibd-yml-500kb): GitHub creates no run at all for a
          # workflow file past 500 KB and says nothing; red here at 450,000 bytes (every cell red)
          # leaves room to move knives out to crates/*/knives/*.sh, which knife-anchors reads
          for f in .github/workflows/*.yml; do
            n=$(( $(wc -c < "$f") ))
            if [ "$n" -gt 450000 ]; then
              echo "::error file=$f::$f is $n bytes; GitHub stops creating runs past 500 KB, move knives to crates/*/knives/*.sh"
              exit 1
            fi
          done
          tool=aib/tools/release/docs_only.py
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/docs_only.py" 2>/dev/null; then tool="$RUNNER_TEMP/docs_only.py"; fi
          out=$(python3 "$tool" rust-ci --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD") || out=rust_ci=true
          # only a whole line rust_ci=false skips; anything else (old base script without rust-ci, error) runs for real
          run=true
          case $'\n'"$out"$'\n' in *$'\n'rust_ci=false$'\n'*) run=false ;; esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      # S66-0d (Andy 11-14, s36): does this pull request touch what cloud-host command knives (macOS)
      # tests (aib-cloud-host's path-dependency closure, or the fixed set in the judge)? The judge is
      # taken from the base, so a pull request cannot rewrite it to skip itself; a base without it, a
      # judge that fails, or anything but a whole line changed=false runs the cell. A main push always
      # runs (the judge says changed=true for every event but pull_request). A change to this step
      # itself is not guarded by the base: reviewers read it line by line (7b81e N1).
      - id: c
        # no Rust path changed: the cell does not run anyway, so no toolchain install (7b81e L1)
        if: steps.d.outputs.run != 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # cargo metadata --no-deps reads the same with any toolchain; stable is on the image, the pinned
          # one would be installed first; a stable that cannot read a Cargo.toml fails, and that runs
          RUSTUP_TOOLCHAIN: stable
        run: |
          tool=xtask/ci/closure-changed.sh
          ch=true
          why="not a pull request, or no judge at the base"
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/closure-changed.sh" 2>/dev/null; then
            out=$(bash "$RUNNER_TEMP/closure-changed.sh" --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD" \
                    --crate aib-cloud-host) || out=""
            case $'\n'"$out"$'\n' in *$'\n'changed=false$'\n'*) ch=false ;; esac
            why=$(printf '%s\n' "$out" | sed -n 's/^why=//p' | head -n 1 | tr -cd '[:print:]')
          fi
          echo "cloud_host=$ch" | tee -a "$GITHUB_OUTPUT"
          echo "cloud_host_why=${why:-judge printed no reason}" | tee -a "$GITHUB_OUTPUT"
      # S59 (Andy 11-14, after 11-13「程式只能 Rust、沒有 Python」): an added or changed *.py is refused unless
      # docs/policy/python-exceptions.txt approves that exact version. Red here ⇒ changes is red ⇒ both rust
      # cells turn red, so this is a required check on every pull request, docs-only ones included.
      # The checker and its list come from the base version (a pull request cannot loosen either); the first
      # pull request that adds the checker runs its own.
      - name: no new Python (S59)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          src=.
          if git cat-file -e "$BASE:xtask/src/no_new_python.rs" 2>/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
            src="$RUNNER_TEMP/base"
          fi
          rc=0
          cargo run -q --locked --manifest-path "$src/Cargo.toml" -p aib-xtask -- \
            no-new-python --base "$BASE" --head "$HEAD" || rc=1
          # S59 glossary (519d0 11-14): a new string in the 2.0 screen crates must not bring back an old word
          if [ -f "$src/xtask/src/ui_words.rs" ]; then
            cargo run -q --locked --manifest-path "$src/Cargo.toml" -p aib-xtask -- \
              ui-words --base "$BASE" --head "$HEAD" || rc=1
          fi
          exit $rc
      # ebb36 S59 L2: a pull request can drop the step above by editing this file, so main checks
      # every push too. It cannot stop the push, but Python that slipped in turns main red where
      # everyone sees it. The checker and list come from the commit before the push.
      - name: no new Python on main (S59)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -u
          case "$BEFORE" in ''|*[!0]*) ;; *) echo "::notice::first push of the branch, nothing to compare"; exit 0 ;; esac
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || { echo "::error::push base $BEFORE not in this checkout"; exit 1; }
          src=.
          if git cat-file -e "$BEFORE:xtask/src/no_new_python.rs" 2>/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/before" "$BEFORE"
            src="$RUNNER_TEMP/before"
          fi
          rc=0
          cargo run -q --locked --manifest-path "$src/Cargo.toml" -p aib-xtask -- \
            no-new-python --base "$BEFORE" --head "$AFTER" || rc=1
          if [ -f "$src/xtask/src/ui_words.rs" ]; then
            cargo run -q --locked --manifest-path "$src/Cargo.toml" -p aib-xtask -- \
              ui-words --base "$BEFORE" --head "$AFTER" || rc=1
          fi
          exit $rc
  rust:
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 75: kept as headroom; the cloud knives (aib-cloud ~41 min, aib-cloud-host ~29 min) moved to the cloud-knives / cloud-host-knives jobs (11-12, macOS cell had hit 70); Windows still runs the Job tests 5x and 7 knives
    # 150 (S88, 519d0 11-16 15:11): GitHub's macOS runner is the fallback when the self-hosted Mac is off, and there the
    # macOS cell hit 75 on every one of the last 8 push runs on main
    # 360 (519d0 11-16 20:37): main tip run 43845696225 hit 150 on the self-hosted Mac at step 47 (that cell
    # needs 3 h+ there) and the release gate run was cancelled; knife steps are incremental now, 360 is headroom
    # Windows / macOS split (slice 0, 519d0 11-16 22:59): the Windows cell took 19 min (run 43845696225 attempt 2)
    # and 14 min (run 43887538340, incremental knife steps), so 60 is 3x; macOS keeps 360. Each knife step also
    # has its own timeout-minutes now, so one stuck step no longer holds the cell for the whole job limit
    # (step value = slowest GitHub-runner time of that step in the two runs above x 2.7, the slowest self-hosted /
    # GitHub ratio over 18 knife steps, x 3, rounded up to 5 minutes, at least 10)
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon + Windows x64 (spec section 15). Windows results
        # are "CI-windows" level, not desktop verification (ADR 0001).
        # *-latest on purpose: pinned images get retired (macos-14 was refused
        # on 2026-11-07); the first step prints what we actually got.
        os: [macos-latest, windows-latest]
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    # Self-hosted Mac (label ez2-aib-mac): only the macOS cell, only when the repository variable
    # AIB_MAC_SELFHOSTED is 'on', only for a pull request from a branch of this repository whose name
    # starts with integ/ or release/ or that carries the label mac-selfhosted, and for a push to main (S88,
    # below). The cell keeps its name (it comes from matrix.os, not from runs-on). A fork can
    # rewrite this line in its own PR, so this is not the guard: the runner refuses fork and non
    # push / pull_request jobs in its job-started hook, and the repository asks approval for outside
    # contributors' runs. AIB_MAC_SELFHOSTED=off sends everything back to GitHub's runners.
    # The two knife cells (cloud-knives, cloud-host-knives) copy this condition: keep the three in step (n08).
    # S88 (519d0 11-16 15:07): a push to main also goes to the self-hosted Mac (same variable): the tag check
    # (mainline-green.sh) needs one all-green push run on main, and on GitHub's runners the rust macOS cell hit
    # its 75-minute limit on every one of the last 8. Only refs/heads/main; forks and outside PRs stay as they were.
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest'
      || (matrix.os == 'macos-latest' && vars.AIB_MAC_SELFHOSTED == 'on'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.head.repo.full_name == github.repository
               && (startsWith(github.head_ref, 'integ/') || startsWith(github.head_ref, 'release/')
                   || contains(github.event.pull_request.labels.*.name, 'mac-selfhosted')))
              || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
         && fromJSON('["self-hosted","macOS","ARM64","ez2-aib-mac"]')
      || matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      # build / clippy / test stay non-incremental; every knife step overrides this with
      # CARGO_INCREMENTAL=1 + no debuginfo (Andy 11-16 §26 rust-cell shortening 1; 7b81e lin
      # measure MEASURE-rust-incr-snap-7b81e-1116: snapshot knives 227 s -> 134 s, 54/54 bite)
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - name: Windows version (what the Job tests ran on)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            avail_gb=$((avail_kb / 1024 / 1024))
            echo "self-hosted disk free: ${avail_gb} GiB (${avail_kb} KiB)"
            if [ "$avail_kb" -lt 31457280 ]; then
              echo "::error::self-hosted runner disk free ${avail_gb} GiB < 30 GiB — clean stale target/receipt dirs before running cargo"
              exit 1
            fi
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache/restore@v4
        id: cache
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # runner.environment (github-hosted / self-hosted) keeps a target built on the self-hosted Mac
          # out of GitHub's macOS image and the other way round
          key: aibd-${{ matrix.os }}-${{ runner.environment }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-${{ matrix.os }}-${{ runner.environment }}-
      - name: Core purity
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-core-purity.sh
          ./scripts/check-core-purity.sh --self-test
      - name: aib-sys dependents (aibd, aib-procwatch)
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-sys-deps.sh
          ./scripts/check-sys-deps.sh --self-test
      - name: fmt
        if: env.RUN == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # merge-ops v2 §7.2 (a9136 11-09): every knife.py anchor in the workflows
      # and scripts must occur exactly once in its file, before the long test
      # and knife steps (#578 lost a round to anchors main had moved away).
      - name: knife anchors
        if: env.RUN == 'true'
        shell: bash
        run: cargo run -q --locked -p aib-xtask -- knife-anchors
      - name: test
        if: env.RUN == 'true' && runner.os != 'macOS'
        run: cargo test --workspace --locked
      # 043dd 11-18 (a9136 c47cbd3e L1): web is a default feature now, so the pages-off path
      # (every page 404 web_not_built, the token never in a page) runs only without it.
      - name: aibd static files without the web feature
        if: env.RUN == 'true'
        run: cargo test -p aibd --locked --no-default-features --test static_files
      # The Windows hands-on pack (release exes + test pack) is its own job, winpack, below
      #   (f163c REVIEW-wincheck L3): a packing error never turns this required cell red.
      # The forkcount capture-completeness tests need kqueue to see every
      # short-lived child; shared GitHub macOS runners miss some (main
      # bbf12897). Skipped HERE, by name, so the summary says "filtered out"
      # and a warning is shown; they still run on our own Macs (#503).
      - name: test (macOS; two forkcount calibration tests skipped by name)
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          echo "::warning title=forkcount calibration skipped::calibrate_single_is_exact and calibrate_grandchild_follows_the_tree are not run on shared runners (kqueue misses short-lived children); run them locally"
          # a9136 11-16 (#820): a runner is itself a launchd job in the darwin background tier (ps pri 4);
          # under that clamp setpriority cannot lift a child, so the background-tier test fails on every
          # runner (GitHub's and ours) and passes from a terminal. It is skipped here only while this
          # shell is clamped; receipts run it (and its knife BG2) from a terminal.
          bg=()
          if [ "$(ps -o pri= -p $$ | tr -d ' ')" -le 4 ]; then
            echo "::warning title=background-tier test skipped::this runner is in the darwin background tier (ps pri $(ps -o pri= -p $$ | tr -d ' ')); a_child_aibd_starts_leaves_the_background_tier runs in receipts from a terminal"
            bg=(--skip a_child_aibd_starts_leaves_the_background_tier)
          fi
          cargo test --workspace --locked -- --skip calibrate_single_is_exact --skip calibrate_grandchild_follows_the_tree "${bg[@]}"
      # slice 0 (519d0 11-16 22:59): saved right after the test steps and before the first knife step, so the cache
      # holds the build / clippy / test output (not the incremental, no-debug knife builds) and a knife step that
      # runs out of time no longer loses it; the two macOS knife steps that sat before `test (macOS)` moved below
      # S66-0c (519d0 11-14): only a main push saves the build cache; a pull request restores it and never
      # saves its own copy (each PR copy was 0.7-2.4 GB and the repository went over GitHub's 10 GB, S66-0)
      - uses: actions/cache/save@v4
        if: env.RUN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # tidy-scan (S76d-1, 043dd 11-14): each knife takes one rule of the report away and
      # must turn its own test red (RULES §21: knives live here, not in a list file).
      - name: tidy-scan knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          umask 022  # S88: self-hosted runners start at 077; knives must see the mode GitHub runners give (022)
          set -eu
          kt() { python3 -I scripts/knife.py xtask/src/tidy_scan.rs "$1" "$2" \
                   --expect-fail "$3" -- cargo test -p aib-xtask --locked "$3"; }
          # TS1 a rename is not the name written in code
          kt '        .get("rename")' '        .get("rename_ignored") // knife' a_rename_is_the_name_in_code
          # TS2 the workflows are not read for references
          kt '    for (i, (_p, bytes)) in files.iter().enumerate() {' \
             '    for (i, (_p, bytes)) in files.iter().enumerate().filter(|(_, (p, _))| !p.starts_with(".github/")) { // knife' \
             files_named_by_workflows_lists_or_their_folder_are_not_reported
          # TS3 two knives with different tests read as one
          kt '                .entry((k.file.clone(), k.old.clone(), c.new, c.expect_fail))' '                .entry((k.file.clone(), k.old.clone(), c.new, String::new())) // knife' \
             a_duplicate_knife_needs_all_four_fields_equal
          # TS4 a nested package's code is read as this package's
          kt '            if p.join("Cargo.toml").exists() {' \
             '            if p.join("Cargo.toml").exists() && p.as_os_str().is_empty() { // knife' \
             deps_named_only_in_comments_strings_or_features_are_reported
          # TS5 keys are not made relative to cargo's workspace_root
          kt '    let root = ws_root.map_or(root, Path::new);' '    let _ = ws_root; // knife' \
             keys_are_relative_to_workspace_root_and_a_knifes_replacement_is_a_use
          # TS6 a dependency used only by a knife's replacement is reported
          kt '            if by_knife {' '            if by_knife && false { // knife' \
             keys_are_relative_to_workspace_root_and_a_knifes_replacement_is_a_use
          # TS7 an ADR cited only by its number is reported (ebb36 L1)
          kt '        adr_numbers(&text, &mut ws);' '        let _ = &text; // knife' \
             an_adr_cited_by_its_number_is_referenced
          # TS8 a workspace dependency is looked for by its package name, not its lib name (ebb36 L2)
          kt '                ident = l.clone();' '                let _ = l; ident = ident.clone(); // knife (keeps the package name)' \
             a_workspace_dependency_is_looked_for_by_its_lib_name
          # TS9 the same config in each extension is rated high (ebb36 L3)
          kt '                reliability: if per_mod { "low" } else { "high" },' \
             '                reliability: if per_mod && false { "low" } else { "high" }, // knife' \
             the_same_config_in_each_extension_is_low
          # TS10 (S79 C7 node) a name that only starts the same counts as the folder
          kt "        |p: &str, k: &str| p == k || (p.starts_with(k) && p.as_bytes().get(k.len()) == Some(&b'/'));" \
             '        |p: &str, k: &str| p.starts_with(k); // knife' \
             an_item_gets_the_node_of_its_longest_path_prefix
          # TS11 (S79 C7 node) the shortest prefix wins
          kt '        .max_by_key(|(k, _)| k.len())' '        .min_by_key(|(k, _)| k.len()) // knife' \
             an_item_gets_the_node_of_its_longest_path_prefix
          # TS12 (S79 C7 node) "*" is not the default
          kt '        .or_else(|| nodes.get_key_value("*"))' '        .or(None) // knife' \
             an_item_gets_the_node_of_its_longest_path_prefix
          # TS13 (S79 C7 node) the report leaves the node out
          kt '                "node": nodes.and_then(|m| node_of(&i.paths, m)),' \
             '                "node": nodes.and(None::<&str>), // knife' \
             the_report_carries_each_items_node_or_null
      # aib-verify g1 (1ced7, PLAN-approvals-to-rust C1/C2): the G1 probes without
      # Claude (30 setuid ps / a stuck setuid ps, one slot) against this tree's own
      # aibd. Until G1 is on main this step checks the tool, not G1: rc 0 or 1 and a
      # well-formed first line; the report goes to the step summary. Once G1 is on
      # main, require rc 0 here.
      - name: aib-verify g1 probes (macOS, no Claude)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --locked -p aibd -p aib-fixture-tree -p aib-verify
          T="$PWD/target/debug"; OUT="$RUNNER_TEMP/aib-verify-g1"
          set +e
          "$T/aib-verify" g1 --head "$(git rev-parse HEAD)" --bin "$T/aibd" --fixture "$T/aib-fixture-tree" \
            --out "$OUT" --burst-runs 3 --stuck-runs 2 --host "ci-$RUNNER_OS"
          rc=$?
          set -e
          cat "$OUT/VERIFY-g1.md" >> "$GITHUB_STEP_SUMMARY" || true
          echo "aib-verify g1 rc $rc"
          [ "$rc" = 0 ] || [ "$rc" = 1 ] || { echo "::error::aib-verify g1 could not run (rc $rc)"; exit 1; }
          head -1 "$OUT/VERIFY-g1.md" | grep -Eq '^驗收: (通過|不通過) 頭: [0-9a-f]{40} 機: ci-macOS 樣本: burst 3 stuck 2 沒驗: ' \
            || { echo "::error::aib-verify g1 first line is malformed"; head -1 "$OUT/VERIFY-g1.md"; exit 1; }
      # S66-4 shadow (7b81e, 519d0 11-15): when the knife steps start, for knife-affected below
      # S66-4 segment 1 (7b81e, council r2 11-17 §2 item 1): which knife steps / knife scripts this pull
      # request may skip (none of their knives is affected; xtask/ci/knife-affected-gate.sh). Off unless
      # the repository variable AIB_KNIFE_SKIP is 'on'; a push to main and a release run every knife
      # (the command lists nothing for them). Any failure here leaves the outputs empty = skip nothing;
      # the knife steps' `if:` reads `skip_steps || '[]'`, the call-only steps read skip_files. The crate
      # knives step (run-knives.sh) skips nothing yet: its scripts' knives are owned by that one step, so
      # skipping per script needs its own slice (FOLLOWUP-s664). Not a required cell, never turns the cell red.
      - name: knife-affected (gate)
        id: kgate
