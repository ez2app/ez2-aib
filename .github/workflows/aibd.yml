        shell: bash
        run: |
          set -u -o pipefail
          cargo test -q -p aib-sys --locked --lib --no-run
          pass=0
          for i in $(seq 1 20); do
            # a filter that matches nothing is green too: require all 3 ran
            if cargo test -p aib-sys --locked --lib session::tests::a_failed_root_open \
                 -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/failed-open.log" \
               && grep -q "test result: ok. 3 passed" "$RUNNER_TEMP/failed-open.log"; then
              pass=$((pass + 1)); echo "== run $i/20 ok"
            else
              echo "== run $i/20 FAILED"
            fi
          done
          echo "session failed-open: $pass/20 passed"
          test "$pass" -eq 20
      - name: aib-sys job knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: ./scripts/check-win-job-knives.sh
      - name: aib-sys session knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        timeout-minutes: 10
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        # preview.2 sessions: killing a session must take the whole tree. Two
        # knives, each must turn killing_a_session_takes_the_whole_tree red:
        # no terminate at all, and "only the root is killed" (ping survives).
        # No -q: this knife.py reads "test x ... FAILED" lines.
        run: |
          set -eu
          k() { python3 -I scripts/knife.py crates/aib-sys/src/session.rs "$1" "$2" \
                  --expect-fail killing_a_session_takes_the_whole_tree \
                  -- cargo test -p aib-sys --locked --test session_win; }
          k '        self.job.terminate(1)' '        Ok(()) // knife: no terminate'
          k '        self.job.terminate(1)' \
            '        self.child.kill().map_err(|_| SysError::Unknown) // knife: root only'
          # 1ced7 #543 High: a root whose handle cannot be opened after the spawn is
          # "not started" only once the root is gone AND the Job is empty
          k2() { python3 -I scripts/knife.py crates/aib-sys/src/session.rs "$1" "$2" \
                   --expect-fail "$3" -- cargo test -p aib-sys --locked --lib session::; }
          k2 '                let mut term = terminate;' \
            '                let mut term = |_: &Job| Ok::<(), SysError>(()); let _ = terminate; // knife: no kill' \
            a_failed_root_open_kills_and_confirms_the_whole_tree
          k2 '                    Ok(k) if k.all_gone() => e,' '                    Ok(_) => e, // knife: trust any report' \
            a_failed_root_open_whose_child_outlives_the_root_is_not_reaped
          k2 '                    return Err((SpawnError::Spawn(e), Some(Box::new(left))));' \
            '                    drop(left); return Err((SpawnError::Spawn(e), None)); // knife: drop the tree' \
            a_failed_root_open_whose_child_outlives_the_root_is_not_reaped
          # DIAG-win-session-flake: the tests really wait for ping; an image
          # that never comes must turn them red in hold_members
          k2 '    const AWAITED_IMAGE: &str = "PING.EXE";' \
            '    const AWAITED_IMAGE: &str = "NOPE.EXE"; // knife: wait for nothing real' \
            a_failed_root_open_kills_and_confirms_the_whole_tree
      - name: aibd Windows session adapter knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        timeout-minutes: 20
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        # session_windows.rs maps aib-sys results to the shared stop: clean only
        # when the Job emptied AND every handle signaled; a not-reaped spawn keeps its pid.
        run: |
          set -eu
          k() { python3 -I scripts/knife.py crates/aibd/src/platform/session_windows.rs "$1" "$2" \
                  --expect-fail "$3" -- cargo test -p aibd --locked --lib platform::session_windows; }
          k '            let status = if k.all_gone() {' '            let status = if k.survivors.is_empty() {' \
            a_job_that_did_not_empty_is_never_clean
          k '        SpawnError::Spawn(SysError::NotReaped { pid, .. }) => Some(*pid),' \
            '        SpawnError::Spawn(SysError::NotReaped { .. }) => None,' \
            a_spawn_not_confirmed_gone_keeps_its_pid
          k '                _ => idle(timeout),' '                _ => Some(Exit::Code(0)), // knife: unreadable is an exit' \
            a_root_wait_or_exit_code_error_is_never_an_exit
          k '    std::thread::sleep(timeout.min(IDLE_MAX));' '    let _ = timeout.min(IDLE_MAX); // knife: no pause' \
            an_unanswered_root_wait_pauses_before_none_and_is_bounded
          k '    std::thread::sleep(timeout.min(IDLE_MAX));' '    std::thread::sleep(timeout.max(IDLE_MAX)); // knife: unbounded' \
            an_unanswered_root_wait_pauses_before_none_and_is_bounded
          # a9136 #555 Medium: failed starts not confirmed gone are kept and swept / listed at shutdown
          k '        (Some(_), Some(l)) => LEFTOVERS.lock().unwrap_or_else(|e| e.into_inner()).push(*l),' \
            '        (Some(_), Some(l)) => drop(l), // knife: not kept' \
            a_kept_failed_start_is_stopped_by_the_shutdown_sweep
          k '        (Some(pid), None) => UNHELD.lock().unwrap_or_else(|e| e.into_inner()).push(pid),' \
            '        (Some(_), None) => {} // knife: silent' \
            an_unheld_failed_start_is_listed_at_shutdown
          # #578: the Windows sweep moved into the Lifecycle impl (platform/lifecycle.rs)
          python3 -I scripts/knife.py crates/aibd/src/platform/lifecycle.rs \
            '        Swept::from_unconfirmed(super::session_windows::stop_leftovers(deadline))' \
            '        { let _ = deadline; Swept::NoneLeft } // knife: Windows sweeps nothing' \
            --expect-fail an_unheld_failed_start_is_listed_at_shutdown \
            -- cargo test -p aibd --locked --lib platform::session_windows
      - name: aibd Windows sessions wiring knife (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        timeout-minutes: 10
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        # default_spawn must be session_windows::spawn (a63ab 11-09: unwired,
        # every POST was 422 unsupported_platform). The knife puts the refusal
        # back; the real-aibd test must turn red.
        run: |
          set -eu
          # #578: the Windows spawn is chosen in the Lifecycle impl (platform/lifecycle.rs)
          python3 -I scripts/knife.py crates/aibd/src/platform/lifecycle.rs \
            '        Step::Done(super::session_windows::spawn)' \
            '        Step::Unsupported { step: StepId::Spawn, why: "knife: not wired" }' \
            --expect-fail delete_stops_the_grandchild_and_confirms_the_tree \
            -- cargo test -p aibd --locked --test sessions_windows
      # S101 (7b81e, 519d0 11-15 22:04): the Windows test machine gets aib-lease.exe from this cell, not
      # from a toolchain installed there; `gh run download <run> -n aib-lease-windows-exe`, scp to the
      # user's .ez2-aib\bin\, and `aib-lease hosts` runs `aib-lease.exe probe` on it over ssh.
      # 519d0 22:45: aib-idea too (Windows acceptance 5.6 / 6.x, ACCEPT-WIN-1ced7-1115.md); aib-ledger is a
      # library inside aib-idea; aib-slice is added when its crate is in main (#755).
      - name: aib-lease exe (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        run: cargo build -q --locked -p aib-lease --bin aib-lease -p aib-idea --bin aib-idea
      - uses: actions/upload-artifact@v4
        if: env.RUN == 'true' && runner.os == 'Windows'
        timeout-minutes: 3
        with:
          name: aib-lease-windows-exe
          path: target/debug/aib-lease.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: env.RUN == 'true' && runner.os == 'Windows'
        timeout-minutes: 3
        with:
          name: aib-idea-windows-exe
          path: target/debug/aib-idea.exe
          if-no-files-found: error
          retention-days: 7
      # Precheck gate 1 in observe mode (time-saving plan D1; Andy 11-22 one seat, Rust only): the
      # knives this pull request touches are checked to still compile, the way a gate before the knife
      # cells would. Observe: it stops nothing and is not a required result; what it prints is compared
      # with what the knife cells then found, and it becomes a gate only when that shows it does not
      # block good work. The last step on purpose: it writes knives into files and puts them back, and
      # a step killed halfway must have nothing running after it (the next job's checkout resets the tree).
      - name: knife precheck (observe)
        if: env.RUN == 'true' && always() && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q --no-tags --filter=blob:none --depth=200 origin "$BASE" "$HEAD" 2>/dev/null || true
          rc=0
          cargo run -q --locked -p aib-xtask -- knife-precheck --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/precheck.out" 2>&1 || rc=$?
          { echo '### knife precheck (observe)'; echo '```'; grep -vE '^KNIFE-COMPILE ok ' "$RUNNER_TEMP/precheck.out" | tail -60; echo "rc $rc"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          # observe: nothing is stopped. What real mode would have stopped is said where a person
          # sees it (the run's annotations), and a precheck that did not work is not read as a pass
          case "$rc" in
            0) ;;
            1) echo "::warning title=knife precheck (observe)::a knife this change touches does not compile: the knife cells run to their end over it. Real mode would have stopped here." ;;
            *) echo "::warning title=knife precheck (observe)::the precheck itself did not work (rc $rc): it says nothing about the knives" ;;
          esac
          git status --porcelain | head -5
          git checkout -q -- . || true

  # 90856 (f163c REVIEW-wincheck L3, ebab8 11-25 16:44): the Windows hands-on pack is its own job, not a
  #   step of the required rust (windows-latest) cell, so a packing error or a slow pack never blocks a
  #   merge. Not a required check (not in the ruleset's list). Only on a main push or a PR labelled
  #   ready-merge, and only when a Rust path changed; waits for the rust cells so it never races them.
  winpack:
    name: Windows hands-on pack (not required)
    # TRIAL branch only (11-25, do not merge): the pack does not wait for the rust cells here, because
    #   the macOS rust cell queues for hours and the Windows trial pack is wanted today.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run != 'false' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ready-merge')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      # 11-15 519d0 (Windows hands-on check, TEST-windows-1ced7-1115): the laptop cannot build today's
      #   main (it needs VS Build Tools), so the Windows cell keeps the release exes for 7 days. Only on a
      #   main push or a PR labelled ready-merge, so an ordinary round never builds release. Own target
      #   dir: the cache saved below (main push) holds `target` only, so these never enter it.
      #   aibd is required; aib-idea / aib-slice / aib-drive are kept when they are in this workspace.
      - name: release exes for Windows hands-on checks (main push / ready-merge)
        id: winexe
        shell: bash
        env:
          CARGO_TARGET_DIR: target-winexe
          # a PR run checks out the merge commit; name the artifact after the head that was labelled
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pkgs=(-p aibd -p aib-wincheck); bins=(aibd aib-wincheck)
          for p in aib-idea aib-slice aib-drive; do
            if cargo pkgid "$p" >/dev/null 2>&1; then pkgs+=(-p "$p"); bins+=("$p")
            else echo "::notice title=not kept::$p is not in this workspace; no $p.exe this round"; fi
          done
          cargo build --release --locked "${pkgs[@]}"
          mkdir -p winexe
          for b in "${bins[@]}"; do
            [ -f "target-winexe/release/$b.exe" ] || { echo "::error::target-winexe/release/$b.exe was not built"; exit 1; }
            cp "target-winexe/release/$b.exe" winexe/
          done
          # 90856 PLAN-windows-onsite §3 A: the laptop cannot build, so aib-wincheck.exe runs test
          #   executables built here. A test executable holds absolute paths of where it was built
          #   (CARGO_BIN_EXE_*, fixtures under CARGO_MANIFEST_DIR), so they are built at a fixed
          #   C:\aibw\ez2-aib and the laptop puts the tree back at the same place. The pack keeps
          #   the tree's layout: the source (git archive), target/debug/*.exe, the test
          #   executables, and wincheck-tests.tsv (<exe>\t<package folder>) at the pack root (not in the
          #   tree: Windows ignores case and the tree has tests/). Every file is in SHA256SUMS.
          W=/c/aibw/ez2-aib
          rm -rf /c/aibw && mkdir -p "$W"
          git archive HEAD | tar -x -C "$W"
          (cd "$W" && CARGO_TARGET_DIR="$W/target" cargo test --workspace --locked --no-run --message-format=json 2>/dev/null) \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test == true) | "\(.executable)\t\(.manifest_path)"' \
            | sort -u > winexe-tests.raw
          [ -s winexe-tests.raw ] || { echo "::error::no test executables were listed"; exit 1; }
          : > winexe-tests.tsv
          while IFS=$'\t' read -r e m; do
            e=$(cygpath -u "$e"); m=$(cygpath -u "$m")
            case "$e$m" in "$W"/*"$W"/*) ;; *) echo "::error::$e or $m is not under $W"; exit 1 ;; esac
            pkg=$(dirname "${m#"$W"/}"); [ "$pkg" = . ] && pkg=
            printf '%s\t%s\n' "${e#"$W"/}" "$pkg" >> winexe-tests.tsv
          done < winexe-tests.raw
          P=winexe/aibw/ez2-aib
          mkdir -p "$P"
          git archive HEAD | tar -x -C "$P"
          cp winexe-tests.tsv winexe/wincheck-tests.tsv
          mkdir -p "$P/target/debug/deps"
          cp "$W"/target/debug/*.exe "$P/target/debug/"
          cut -f1 winexe-tests.tsv | while IFS= read -r e; do cp "$W/$e" "$P/$e"; done
          printf '%s\n' "$HEAD_SHA" > winexe/HEAD
          (cd winexe && find . -type f ! -name SHA256SUMS | sed 's#^\./##' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > SHA256SUMS && wc -l < SHA256SUMS)
          echo "::notice title=wincheck pack::$(wc -l < winexe-tests.tsv) test executables, $(du -sh winexe | cut -f1)"
          # c2f0b REVIEW-wincheck L2: the result file's SUMS-FILE-SHA256 must be this value
          echo "::notice title=wincheck SUMS-FILE-SHA256::$(sha256sum winexe/SHA256SUMS | cut -c1-64)"
          echo "name=aib-windows-exe-${HEAD_SHA:0:9}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.winexe.outcome == 'success'
        with:
          name: ${{ steps.winexe.outputs.name }}
          path: winexe/
          if-no-files-found: error
          retention-days: 7

  cloud-knives:
    name: cloud decision knives (macOS)
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 90: ~41 min inside the macOS rust cell (11-12), 51.5 min as its own job on #732 run 43273505548 (cache
    # restore + compile included); 60 left under 9 min of room (c477a 11-13, f1fae FALLBACK #732)
    timeout-minutes: 90
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    # n08 (Andy 11-14 20:26): same self-hosted condition as the rust job above (repository variable
    # AIB_MAC_SELFHOSTED 'on', a pull request from a branch of this repository, integ/ or release/ or the
    # label mac-selfhosted); everything else, and every fork, stays on GitHub's macos-latest. The cell
    # keeps its name. AIB_MAC_SELFHOSTED=off sends it back to GitHub's runners; AIB_KNIVES_SELFHOSTED=off sends
    # only the two knife cells back (one runner runs the three cells one after another; a9136 L1).
    # Keep this condition in step with the rust job's and the other knife cell's (three copies, a9136 N2).
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest'
      || (vars.AIB_MAC_SELFHOSTED == 'on' && vars.AIB_KNIVES_SELFHOSTED != 'off'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.head.repo.full_name == github.repository
               && (startsWith(github.head_ref, 'integ/') || startsWith(github.head_ref, 'release/')
                   || contains(github.event.pull_request.labels.*.name, 'mac-selfhosted')))
              || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
         && fromJSON('["self-hosted","macOS","ARM64","ez2-aib-mac"]')
      || 'macos-latest' }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            avail_gb=$((avail_kb / 1024 / 1024))
            echo "self-hosted disk free: ${avail_gb} GiB (${avail_kb} KiB)"
            if [ "$avail_kb" -lt 31457280 ]; then
              echo "::error::self-hosted runner disk free ${avail_gb} GiB < 30 GiB — clean stale target/receipt dirs before running cargo"
              exit 1
            fi
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      # Read-only (043dd L1 on the split and on the key change; kept after S66-0c): the rust job is the
      # only one that saves aibd-macos-latest-<runner.environment>-<hash> (same key here, so the exact key
      # hits; 5d33a L1 on a325701c). A knife job used to save under the same key, and
      # whichever job saved first fixed that cache for all three, though a knife job's target is only part
      # of the rust job's. Own keys would cost two more macOS caches against the repo's 10 GB.
      - uses: actions/cache/restore@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # runner.environment (n08): a target built on the self-hosted Mac stays out of GitHub's image
          key: aibd-macos-latest-${{ runner.environment }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-macos-latest-${{ runner.environment }}-
      # aib-cloud (host A dev order r1; reviews of #623): each knife takes one rule out of the
      # pure decision code and must turn the test that guards it red.
      - name: knife timer
        if: env.RUN == 'true' && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: echo "AIB_SHADOW_KNIFE_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: aib-cloud decision knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        # A (519d0 11-15, 7b81e lin measure fd1461c2): every knife rebuilds its crate; incremental and
        # no debuginfo bit the same 471/471 and 507/507 in about 37% of the time, target <= 0.8 GB
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          umask 022
          ./crates/aib-cloud/knives/knives-cloud-decision-1.sh
          ./crates/aib-cloud/knives/knives-cloud-decision-2.sh
          ./crates/aib-cloud/knives/knives-cloud-decision-3.sh
          ./crates/aib-cloud/knives/knives-cloud-decision-4.sh
          ./crates/aib-cloud/knives/knives-cloud-decision-5.sh
      # S66-4 shadow (7b81e, 519d0 11-15): which knives this pull request would have had to run if a knife
      # whose inputs did not change could be skipped. Nothing is skipped; never turns the cell red.
      - name: knife-affected (shadow)
        if: env.RUN == 'true' && !cancelled() && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        # 5d33a S66-4 M1: a job past timeout-minutes is red whatever continue-on-error says;
        # 3 minutes here, and no run at all when the knife steps took longer than the budget
        timeout-minutes: 3
        shell: bash
        env:
          AIB_SHADOW_SKIP_AFTER_S: "4200"
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./xtask/ci/knife-affected-shadow.sh "cloud decision knives (macOS)" --source=crates/aib-cloud/knives/knives-cloud-decision-1.sh --source=crates/aib-cloud/knives/knives-cloud-decision-2.sh --source=crates/aib-cloud/knives/knives-cloud-decision-3.sh --source=crates/aib-cloud/knives/knives-cloud-decision-4.sh --source=crates/aib-cloud/knives/knives-cloud-decision-5.sh
      - uses: actions/upload-artifact@v4
        if: env.RUN == 'true' && !cancelled() && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: cireuse-ledger-cloud-knives
          path: reuse-ledger/*.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # S88-split (f1fae 11-20; Andy 11-20 00:2x "刀步拆平行那條直接做"): the crates/*/knives/*.sh scripts of job rust,
  # four macOS cells side by side. run-knives.sh with AIB_KNIVES_SHARD=k/4 runs the scripts its plan gives cell k (by their
  # seconds, see the step; without a plan every fourth in name order), so the four cells together run each exactly once; a cell that gets none is red. The cells are
  # not required checks one by one: crate-knives-gate below is, and it is green only when all four are.
  crate-knives:
    name: crate knives (macOS, ${{ matrix.shard }})
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    # the whole loop was 86+ minutes in one cell on #865 (job 135621588974); a third of it plus cache restore
    # and the first compile, with room. #872 (run 44928976366) outgrew three: cell 1/3's scripts summed
    # 8368 s and the step hit its 140 minutes, so four cells (about 105 minutes each on that run). Each script still has its own watchdog (header timeout=, default 30m).
    timeout-minutes: 150
    # Same runner choice as the rust job and the two knife cells above (n08; keep the four copies in step).
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest'
      || (vars.AIB_MAC_SELFHOSTED == 'on' && vars.AIB_KNIVES_SELFHOSTED != 'off'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.head.repo.full_name == github.repository
               && (startsWith(github.head_ref, 'integ/') || startsWith(github.head_ref, 'release/')
                   || contains(github.event.pull_request.labels.*.name, 'mac-selfhosted')))
              || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
         && fromJSON('["self-hosted","macOS","ARM64","ez2-aib-mac"]')
      || 'macos-latest' }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            avail_gb=$((avail_kb / 1024 / 1024))
            echo "self-hosted disk free: ${avail_gb} GiB (${avail_kb} KiB)"
            if [ "$avail_kb" -lt 31457280 ]; then
              echo "::error::self-hosted runner disk free ${avail_gb} GiB < 30 GiB — clean stale target/receipt dirs before running cargo"
              exit 1
            fi
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      # Read-only, the rust job's key (as in cloud-knives above): only the rust job saves it
      - uses: actions/cache/restore@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aibd-macos-latest-${{ runner.environment }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-macos-latest-${{ runner.environment }}-
      - name: knife timer
        if: env.RUN == 'true' && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: echo "AIB_SHADOW_KNIFE_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: crate knives
        if: env.RUN == 'true'
        timeout-minutes: 140
        shell: bash
        env:
          AIB_KNIVES_SHARD: ${{ matrix.shard }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          umask 022  # S88: self-hosted runners start at 077; knives must see the mode GitHub runners give (022)
          # 519d0 11-20: the runner image in the summary, so an image change shows at a glance (#865 seat_input)
          echo "crate knives $AIB_KNIVES_SHARD on ${ImageOS:-?} ${ImageVersion:-?} ($RUNNER_NAME)" >> "$GITHUB_STEP_SUMMARY"
          # Shards by time (Andy 11-22): each cell makes the same plan from the scripts that run here and the
          # committed seconds (crates/aib-knife/knife-secs.tsv), heaviest first to the lightest cell. Name order
          # gave #875 63 / 90 / 139 / 88 minutes. A step that cannot make the plan is red, not a guess.
          AIB_KNIVES_SHARD=1/1 AIB_KNIVES_LIST=1 bash crates/aib-knife/run-knives.sh rust > "$RUNNER_TEMP/knives-list.out" \
            || { cat "$RUNNER_TEMP/knives-list.out"; exit 1; }
          sed -n 's/^KNIVES-ELIGIBLE //p' "$RUNNER_TEMP/knives-list.out" > "$RUNNER_TEMP/knives-list.txt"
          cargo run -q --locked -p aib-xtask -- knife-shards plan --shards "${AIB_KNIVES_SHARD#*/}" \
            --secs crates/aib-knife/knife-secs.tsv --list "$RUNNER_TEMP/knives-list.txt" > "$RUNNER_TEMP/knives-plan.tsv"
          cargo run -q --locked -p aib-xtask -- knife-shards limits \
            --secs crates/aib-knife/knife-secs.tsv > "$RUNNER_TEMP/knives-limits.tsv"
          export AIB_KNIVES_PLAN="$RUNNER_TEMP/knives-plan.tsv"
          export AIB_KNIVES_LIMITS="$RUNNER_TEMP/knives-limits.tsv"
          # every script's seconds are kept (the artifact below): the table the plan is made from
          # is the median of several runs, and it is only as fresh as the runs it can read
          bash crates/aib-knife/run-knives.sh rust 2>&1 | tee "$RUNNER_TEMP/knives-run.out"
      - name: keep each script's seconds
        if: env.RUN == 'true' && always()
        shell: bash
        run: |
          mkdir -p knife-secs
          grep -E '^KNIVES-(SCRIPT|PLAN|OK|RED|NONE) ' "$RUNNER_TEMP/knives-run.out" > "knife-secs/cell-${{ strategy.job-index }}.txt" 2>/dev/null || true
          wc -l knife-secs/*.txt || true
          # which scripts the plan was wrong about (far over their seconds in the table, or heavy
          # and not in it): said as a warning, never a failure. The table is then due a refresh
          cargo run -q -p aib-xtask --locked -- knife-shards grew --secs crates/aib-knife/knife-secs.tsv knife-secs/*.txt \
            | sed -E 's/^(KNIVES-(GREW|NEW-HEAVY) )/::warning::\1/' || true
      - uses: actions/upload-artifact@v4
        if: env.RUN == 'true' && always()
        timeout-minutes: 3
        with:
          name: knife-secs-${{ strategy.job-index }}
          path: knife-secs/*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: knife-affected (shadow)
        if: env.RUN == 'true' && !cancelled() && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          AIB_SHADOW_SKIP_AFTER_S: "7500"
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          f="knife-secs/cell-${{ strategy.job-index }}.txt"
          args=()
          if [ -r "$f" ]; then
            while IFS= read -r s; do
              [ -n "$s" ] && args+=("--source=$s")
            done < <(sed -nE 's/^KNIVES-SCRIPT ([^:]+): (rc=|not_run ).*/\1/p' "$f")
          fi
          [ "${#args[@]}" -gt 0 ] || { echo "knife-affected (shadow): no scripts recorded; skipped"; exit 0; }
          ./xtask/ci/knife-affected-shadow.sh "crate knives (macOS, ${{ matrix.shard }})" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: env.RUN == 'true' && !cancelled() && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: cireuse-ledger-crate-knives-${{ strategy.job-index }}
          path: reuse-ledger/*.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # The one required check for the cells above (S88-split; PLAN-s88-split r2 §1: GitHub reads a skipped cell
  # as a passed required check, so the three are not required one by one). Green only when every cell's
  # result is success; failure, cancelled and skipped are all red.
  # A docs-only change still runs the three cells (on ubuntu, one notice line each), so they are success, not
  # skipped (7b81e NOTE-s88split-shard-pitfalls 1). 519d0 11-20: a missing cell is red too, so the step also
  # counts this run's cells by name: exactly SHARDS of them, every one success (a cell taken out of the matrix
  # would leave its third of the scripts run nowhere while the matrix result still reads success).
  crate-knives-gate:
    name: crate knives (macOS)
    needs: [changes, crate-knives]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: all four crate knives cells passed
        env:
          CELLS: ${{ needs.crate-knives.result }}
          SHARDS: "4"
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$CELLS" != success ]; then
            echo "::error::crate knives cells: $CELLS (each of the $SHARDS must be success; skipped or cancelled is red too)"
            exit 1
          fi
          TAB=$(printf '\t')
          rows=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("crate knives (macOS, ")) | "\(.name)\t\(.conclusion)"') || {
            echo "::error::could not list this run's jobs"; exit 1; }
          printf '%s\n' "$rows"
          total=$(printf '%s\n' "$rows" | grep -c . || true)
          ok=$(printf '%s\n' "$rows" | grep -c "${TAB}success$" || true)
          for k in $(seq 1 "$SHARDS"); do
            printf '%s\n' "$rows" | grep -q "^crate knives (macOS, $k/$SHARDS)${TAB}success$" || {
              echo "::error::cell $k/$SHARDS is missing or not success"; exit 1; }
          done
          if [ "$total" != "$SHARDS" ] || [ "$ok" != "$SHARDS" ]; then
            echo "::error::crate knives cells: $total found, $ok success; want exactly $SHARDS, all success"
            exit 1
          fi
          echo "crate knives: $ok/$SHARDS cells success" | tee -a "$GITHUB_STEP_SUMMARY"

  knife-summary:
    name: knife summary
    needs: [changes, rust, crate-knives-gate, cloud-knives, cloud-host-knives]
    if: ${{ always() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: summarize knife cells
        shell: bash
        env:
          R_RUST: ${{ needs.rust.result }}
          R_CRATE: ${{ needs.crate-knives-gate.result }}
          R_CLOUD: ${{ needs.cloud-knives.result }}
          R_HOST: ${{ needs.cloud-host-knives.result }}
        run: |
          passed=0; deferred=0; failed=0; cancelled=0
          for r in "$R_RUST" "$R_CRATE" "$R_CLOUD" "$R_HOST"; do
            case "$r" in
              success) passed=$((passed + 1)) ;;
              cancelled) cancelled=$((cancelled + 1)) ;;
              *) failed=$((failed + 1)) ;;
            esac
          done
          cargo run -q -p aib-xtask --locked -- knife-shards summary --tier unknown --passed "$passed" --deferred "$deferred" --failed "$failed" --cancelled "$cancelled" | tee -a "$GITHUB_STEP_SUMMARY"

  cloud-host-knives:
    name: cloud-host command knives (macOS)
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 90: ~29 min inside the macOS rust cell (11-12), but as its own job on #732 run 43273505548 it was cancelled at
    # 60 min with 408 of its knives bitten and none missed (c477a 11-13, f1fae FALLBACK #732)
    timeout-minutes: 90
    # no Rust path touched, or (S66-0d) a pull request that leaves aib-cloud-host's closure alone ⇒ same cell
    # name, on ubuntu, one line (this condition and RUN below say the same thing); the step-level skip keeps the
    # required cell green instead of skipped. RUN false also skips the cache restore and save below.
    # n08 (Andy 11-14 20:26): same self-hosted condition as the rust job above (repository variable
    # AIB_MAC_SELFHOSTED 'on', a pull request from a branch of this repository, integ/ or release/ or the
    # label mac-selfhosted); everything else, and every fork, stays on GitHub's macos-latest. The cell
    # keeps its name. AIB_MAC_SELFHOSTED=off sends it back to GitHub's runners; AIB_KNIVES_SELFHOSTED=off sends
    # only the two knife cells back (one runner runs the three cells one after another; a9136 L1).
    # Keep this condition in step with the rust job's and the other knife cell's (three copies, a9136 N2).
    runs-on: ${{ (needs.changes.outputs.run == 'false' || needs.changes.outputs.cloud_host == 'false') && 'ubuntu-latest'
      || (vars.AIB_MAC_SELFHOSTED == 'on' && vars.AIB_KNIVES_SELFHOSTED != 'off'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.head.repo.full_name == github.repository
               && (startsWith(github.head_ref, 'integ/') || startsWith(github.head_ref, 'release/')
                   || contains(github.event.pull_request.labels.*.name, 'mac-selfhosted')))
              || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
         && fromJSON('["self-hosted","macOS","ARM64","ez2-aib-mac"]')
      || 'macos-latest' }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' && needs.changes.outputs.cloud_host != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: needs.changes.outputs.run == 'false'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      # S66-0d: one notice and one summary line per skip, kind=path_skip, so each skipped pull request can be
      # checked against this cell's result on main after it merges (519d0 watches for a week)
      - name: aib-cloud-host closure untouched, nothing else to run
        if: needs.changes.outputs.run != 'false' && needs.changes.outputs.cloud_host == 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          WHY: ${{ needs.changes.outputs.cloud_host_why }}
        run: |
          echo "::notice::skipped: no cloud-host closure change (base $BASE): $WHY"
          jq -nc --arg base "$BASE" --arg head "$HEAD" --arg why "$WHY" \
            '{kind: "path_skip", cell: "cloud-host command knives (macOS)", base: $base, head: $head, why: $why}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            avail_gb=$((avail_kb / 1024 / 1024))
            echo "self-hosted disk free: ${avail_gb} GiB (${avail_kb} KiB)"
            if [ "$avail_kb" -lt 31457280 ]; then
              echo "::error::self-hosted runner disk free ${avail_gb} GiB < 30 GiB — clean stale target/receipt dirs before running cargo"
              exit 1
            fi
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      # Read-only (043dd L1 on the split and on the key change; kept after S66-0c): the rust job is the
      # only one that saves aibd-macos-latest-<runner.environment>-<hash> (same key here, so the exact key
      # hits; 5d33a L1 on a325701c). A knife job used to save under the same key, and
      # whichever job saved first fixed that cache for all three, though a knife job's target is only part
      # of the rust job's. Own keys would cost two more macOS caches against the repo's 10 GB.
      - uses: actions/cache/restore@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # runner.environment (n08): a target built on the self-hosted Mac stays out of GitHub's image
          key: aibd-macos-latest-${{ runner.environment }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-macos-latest-${{ runner.environment }}-
      # S66-0d: the skip judge of this cell (xtask/ci/closure-changed.sh). Changing it is in its own fixed set
      # (xtask/), so a pull request that changes it always reaches here. Its 36 cases, then each knife takes one
      # rule out and must turn its own case red; the last two hold aib-cloud-host's build.rs to the two stamps.
      - name: closure judge cases and knives (S66-0d)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          bash xtask/ci/closure-changed-test.sh
          jk() { python3 -I scripts/knife.py xtask/ci/closure-changed.sh "$1" "$2" --expect-fail "$3" \
                   -- bash xtask/ci/closure-changed-test.sh; }
          # a crate reached only through another one is left out of the closure
          jk '      else bfs($todo[1:] + deps($todo[0]); $seen + [$todo[0]])' \
             '      else bfs($todo[1:]; $seen + [$todo[0]]) # knife' transitive_dep_runs
          # a main push is judged like a pull request
          jk '[ "$event" = pull_request ] ||' '[ "$event" = pull_request ] || [ "$event" = push ] ||' push_runs
          # Cargo.lock leaves the fixed set
          jk 'FIXED=(Cargo.toml Cargo.lock ' 'FIXED=(Cargo.toml ' cargo_lock_runs
          # the crate's own dev-dependencies leave the closure
          jk '        | select(.kind != "dev" or $n == $c)' '        | select(.kind != "dev") # knife' own_dev_dep_runs
          # a crate not in the workspace is judged untouched
          jk '|| out true "crate $crate not read' '|| out false "crate $crate not read' unknown_crate_runs
          # a folder becomes a name prefix (crates/a also matches crates/ab)
          jk '  | sub("Cargo\\.toml$"; "")' '  | sub("/Cargo\\.toml$"; "")' prefix_is_not_a_folder
          # aibd.yml leaves the fixed set
          jk ' .github/workflows/aibd.yml scripts/' ' scripts/' workflow_runs
          # no changed path is looked at
          jk '  [ -n "$f" ] || continue' '  [ -n "$f" ] || continue; continue # knife' own_crate_runs
          # a changed-file list that cannot be read skips
          jk '|| out true "changed-file list unreadable' '|| out false "changed-file list unreadable' missing_changed_runs
          # metadata that cannot be read skips
          jk '|| out true "metadata file unreadable' '|| out false "metadata file unreadable' missing_metadata_runs
          # a build.rs nobody read in the closure is let through
          jk '    [ $vetted = yes ] || out true' '    [ $vetted = yes ] || true' unvetted_build_rs_in_closure_runs
          # the changes job's own tool leaves the fixed set
          jk '  aib/tools/release/docs_only.py)' '  )' docs_only_tool_runs
          # a file moved out of the closure lists only its new path (7b81e M2)
          jk 'diff --no-renames --name-only "$base' 'diff --name-only "$base' moved_out_of_closure_runs
          # a path git quotes is let through (7b81e M1; core.quotePath=false alone cannot be knifed: this
          # guard still catches the quoted name)
          jk '  case "$f" in \"*) out true' '  case "$f" in \"*) true' quoted_path_runs
          # aib-cloud-host's build.rs starts setting more than the two stamps
          python3 -I scripts/knife.py crates/aib-cloud-host/build.rs \
            '    println!("cargo:rustc-env=AIB_CLOUD_HOST_DIRTY={dirty}");' \
            '    println!("cargo:rustc-env=AIB_CLOUD_HOST_DIRTY={dirty}"); println!("cargo:rustc-env=AIB_CLOUD_HOST_MORE=1"); // knife' \
            --expect-fail build_rs_only_stamps -- bash xtask/ci/closure-changed-test.sh
          python3 -I scripts/knife.py crates/aib-cloud-host/build.rs \
            '    println!("cargo:rerun-if-changed=build.rs");' \
            '    println!("cargo:rerun-if-changed=build.rs"); println!("cargo:rustc-cfg=more"); // knife' \
            --expect-fail build_rs_only_stamps -- bash xtask/ci/closure-changed-test.sh
      # aib-cloud-host: gates of the host commands (reviews of #625) and the B1 host side
      # (33e28): each knife takes one rule out and must turn its test red.
      - name: aib-cloud-host command knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        # A (519d0 11-15, 7b81e lin measure fd1461c2): every knife rebuilds its crate; incremental and
        # no debuginfo bit the same 471/471 and 507/507 in about 37% of the time, target <= 0.8 GB
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          umask 022
          ./crates/aib-cloud-host/knives/knives-cloud-host-1.sh
          ./crates/aib-cloud-host/knives/knives-cloud-host-2.sh
          ./crates/aib-cloud-host/knives/knives-cloud-host-3.sh
          ./crates/aib-cloud-host/knives/knives-cloud-host-4.sh
          ./crates/aib-cloud-host/knives/knives-cloud-host-5.sh
