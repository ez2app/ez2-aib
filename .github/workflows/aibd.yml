  cloud-knives:
    name: cloud decision knives (macOS)
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 90: ~41 min inside the macOS rust cell (11-12), 51.5 min as its own job on #732 run 43273505548 (cache
    # restore + compile included); 60 left under 9 min of room (c477a 11-13, f1fae FALLBACK #732)
    timeout-minutes: 90
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    # n08 (Andy 11-14 20:26): same self-hosted condition as the rust job above (repository variable
    # AIB_MAC_SELFHOSTED 'on', a pull request from a branch of this repository, integ/ or release/ or the
    # label mac-selfhosted); everything else, and every fork, stays on GitHub's macos-latest. The cell
    # keeps its name. AIB_MAC_SELFHOSTED=off sends it back to GitHub's runners; AIB_KNIVES_SELFHOSTED=off sends
    # only the two knife cells back (one runner runs the three cells one after another; a9136 L1).
    # Keep this condition in step with the rust job's and the other knife cell's (three copies, a9136 N2).
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest'
      || (vars.AIB_MAC_SELFHOSTED == 'on' && vars.AIB_KNIVES_SELFHOSTED != 'off'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.head.repo.full_name == github.repository
               && (startsWith(github.head_ref, 'integ/') || startsWith(github.head_ref, 'release/')
                   || contains(github.event.pull_request.labels.*.name, 'mac-selfhosted')))
              || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
         && fromJSON('["self-hosted","macOS","ARM64","ez2-aib-mac"]')
      || 'macos-latest' }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache/restore@v4
        id: cache
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # runner.environment (n08): a target built on the self-hosted Mac stays out of GitHub's image
          key: aibd-macos-latest-${{ runner.environment }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-macos-latest-${{ runner.environment }}-
      # aib-cloud (host A dev order r1; reviews of #623): each knife takes one rule out of the
      # pure decision code and must turn the test that guards it red.
      - name: aib-cloud decision knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        # A (519d0 11-15, 7b81e lin measure fd1461c2): every knife rebuilds its crate; incremental and
        # no debuginfo bit the same 471/471 and 507/507 in about 37% of the time, target <= 0.8 GB
        env:
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: umask 022; ./crates/aib-cloud/knives/knives-cloud-decision.sh
      # S66-0c (519d0 11-14): only a main push saves the build cache; a pull request restores it and never
      # saves its own copy (each PR copy was 0.7-2.4 GB and the repository went over GitHub's 10 GB, S66-0)
      - uses: actions/cache/save@v4
        if: env.RUN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

