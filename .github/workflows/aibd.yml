# SPDX-License-Identifier: Apache-2.0
# AIB 2.0 Rust workspace (aibd). Runs only when Rust paths change; the Python
# ci.yml / release.yml are untouched (ADR 0001).
name: aibd
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "crates/**"
      - "xtask/**"
      - "migrations/**"
      - "scripts/check-core-purity.sh"
      - "scripts/check-sys-deps.sh"
      - ".github/workflows/aibd.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "crates/**"
      - "xtask/**"
      - "migrations/**"
      - "scripts/check-core-purity.sh"
      - "scripts/check-sys-deps.sh"
      - ".github/workflows/aibd.yml"
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon + Windows x64 (spec section 15). Windows results
        # are "CI-windows" level, not desktop verification (ADR 0001).
        # *-latest on purpose: pinned images get retired (macos-14 was refused
        # on 2026-11-07); the first step prints what we actually got.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aibd-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-${{ matrix.os }}-
      - name: Core purity
        shell: bash
        run: |
          ./scripts/check-core-purity.sh
          ./scripts/check-core-purity.sh --self-test
      - name: aib-sys dependents (only aibd)
        shell: bash
        run: |
          ./scripts/check-sys-deps.sh
          ./scripts/check-sys-deps.sh --self-test
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
