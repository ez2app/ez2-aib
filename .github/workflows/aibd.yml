# SPDX-License-Identifier: Apache-2.0
# AIB 2.0 Rust workspace (aibd). The Python ci.yml / release.yml are untouched (ADR 0001).
# 11-09 Andy「Rust 兩格改成必過」(a63ab 派 1ced7):no paths filter any more — every PR and every main push
#   triggers this, so the two cells always report (a required check that never starts would block every PR).
#   The `changes` job decides: no Rust path touched (RUST_CI_PATHS in aib/tools/release/docs_only.py, the one list;
#   prepr reads it too) ⇒ both cells move to ubuntu and print one line; otherwise fmt / clippy / test run for real.
#   main push / mixed / cannot tell / anything under .github/** ⇒ real run. The decision runs from the base version.
name: aibd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tool=aib/tools/release/docs_only.py
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/docs_only.py" 2>/dev/null; then tool="$RUNNER_TEMP/docs_only.py"; fi
          out=$(python3 "$tool" rust-ci --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD") || out=rust_ci=true
          # only a whole line rust_ci=false skips; anything else (old base script without rust-ci, error) runs for real
          run=true
          case $'\n'"$out"$'\n' in *$'\n'rust_ci=false$'\n'*) run=false ;; esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
  rust:
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 45: the Windows cell also runs the Job tests 5x and 7 knives
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon + Windows x64 (spec section 15). Windows results
        # are "CI-windows" level, not desktop verification (ADR 0001).
        # *-latest on purpose: pinned images get retired (macos-14 was refused
        # on 2026-11-07); the first step prints what we actually got.
        os: [macos-latest, windows-latest]
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - name: Windows version (what the Job tests ran on)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aibd-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-${{ matrix.os }}-
      - name: Core purity
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-core-purity.sh
          ./scripts/check-core-purity.sh --self-test
      - name: aib-sys dependents (aibd, aib-procwatch)
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-sys-deps.sh
          ./scripts/check-sys-deps.sh --self-test
      - name: fmt
        if: env.RUN == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # merge-ops v2 §7.2 (a9136 11-09): every knife.py anchor in the workflows
      # and scripts must occur exactly once in its file, before the long test
      # and knife steps (#578 lost a round to anchors main had moved away).
      - name: knife anchors
        if: env.RUN == 'true'
        shell: bash
        run: cargo run -q --locked -p aib-xtask -- knife-anchors
      - name: knife anchors knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        # the checker itself: a moved anchor must stay red, and a knife line it
        # cannot read must never be skipped. Each knife must hit its own test.
        run: |
          set -eu
          ka() { python3 -I scripts/knife.py xtask/src/knife_anchors.rs "$1" "$2" \
                   --expect-fail "$3" -- cargo test -p aib-xtask --locked; }
          ka '    text.matches(old).count()' '    let _ = (text, old); 1 // knife: always once' \
            run_is_red_when_an_anchor_moved_and_green_when_it_is_there
          ka '                    Err(e) => scan.unresolved.push(format!("{at}: {e}")),' \
            '                    Err(_) => {} // knife: skip what cannot be read' \
            what_cannot_be_read_is_unresolved_not_skipped
          # KA3 (1ced7 #590 L3) a line that mentions knife.py in a form not read is skipped
          ka '        if mentions && !handled {' '        if mentions && !handled && false { // knife' \
            what_cannot_be_read_is_unresolved_not_skipped
          # KA4 (1ced7 #590 L3) no knife found reads as clean
          ka '    if !unresolved.is_empty() || knives.is_empty() {' \
            '    if !unresolved.is_empty() || (knives.is_empty() && false) { // knife' \
            run_is_red_when_an_anchor_moved_and_green_when_it_is_there
          # KA5 (1ced7 #590 H1) $'...' escapes not decoded (this line is itself $'...')
          ka $'                    \'n\' => \'\\n\',' $'                    \'n\' => \'n\', // knife' \
            ansi_c_quoted_anchors_are_read_like_bash
          # KA6 (a63ab #590 / #623 ck) a positional inside a word is not filled in
          ka '                s.push_str(&t);' '                let _ = &t; // knife: argument dropped' \
            a_positional_inside_a_word_is_filled_in
      - name: test
        if: env.RUN == 'true' && runner.os != 'macOS'
        run: cargo test --workspace --locked
      # The forkcount capture-completeness tests need kqueue to see every
      # short-lived child; shared GitHub macOS runners miss some (main
      # bbf12897). Skipped HERE, by name, so the summary says "filtered out"
      # and a warning is shown; they still run on our own Macs (#503).
      - name: test (macOS; two forkcount calibration tests skipped by name)
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          echo "::warning title=forkcount calibration skipped::calibrate_single_is_exact and calibrate_grandchild_follows_the_tree are not run on shared runners (kqueue misses short-lived children); run them locally"
          cargo test --workspace --locked -- --skip calibrate_single_is_exact --skip calibrate_grandchild_follows_the_tree
      # R1 thermal (c477a, #473 1.x cooldown.py → aib-thermal): 12 knives, each breaks one
      # rule of the pure decision and must turn its own test red (knife.py restores the file).
      - name: aib-thermal knives
        if: env.RUN == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          tk() { python3 -I scripts/knife.py crates/aib-thermal/src/lib.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aib-thermal --locked --lib "$3"; }
          # K1 pressure ignored
          tk '        if p != 0 {' \
            '        if p != 0 && false { // knife' \
            a5_pressure_reaps_now
          # K2 fallback ignores avg
          tk '    if value >= REAP_AVG_C {' \
            '    if value >= REAP_AVG_C && false { // knife' \
            a18_fallback_honours_avg
          # K3 instant crit lost
          tk '    if max >= CPU_CRIT_C {' \
            '    if max >= CPU_CRIT_C && false { // knife' \
            a7_no_history_falls_back_to_instant
          # K4 no_signal fallback skipped
          tk '    if pressure.is_none() && !history.continuous() {' \
            '    if pressure.is_none() && !history.continuous() && false { // knife' \
            a15_gap_without_pressure_falls_back
          # K5 gaps count as continuous
          tk '        if v < limit || t_prev - t > SUSTAIN_GAP_S {' \
            '        if v < limit || t_prev - t > SUSTAIN_GAP_S * 100.0 { // knife' \
            a4_broken_streak_restarts
          # K6 two samples are enough
          tk '        if n >= SUSTAIN_MIN_SAMPLES {' \
            '        if n >= 1 { // knife' \
            a16_two_samples_across_pause_not_sustained
          # K7 same-moment panels counted twice
          tk '            if t_counted - t >= SAMPLE_SPACING_S {' \
            '            if t_counted - t >= 0.0 { // knife' \
            a16b_same_moment_panels_are_one_sample
          # K8 slow writer drops newer rows
          tk '            (-SUSTAIN_GAP_S..=HISTORY_KEEP_S).contains(&age)' \
            '            (0.0..=HISTORY_KEEP_S).contains(&age) // knife' \
            a14c_slow_writer_keeps_newer_low_sample
          # K9 no nogo level
          tk '    for (level, limit) in [(Level::Crit, REAP_AVG_C), (Level::Hot, NOGO_AVG_C)] {' \
            '    for (level, limit) in [(Level::Crit, REAP_AVG_C)] { // knife' \
            a9_nogo_at_85_without_reap
          # K10 hot reaps
          tk '        self.level == Level::Crit' \
            '        matches!(self.level, Level::Hot | Level::Crit) // knife' \
            a9_nogo_at_85_without_reap
          # K11 max instead of avg
          tk '        Some(self.avg.filter(|v| v.is_finite()).unwrap_or(max))' \
            '        Some(self.avg.filter(|v| v.is_finite()).map(|_| max).unwrap_or(max)) // knife' \
            a1_spike_not_reaped
          # K12 corrupt rows accepted
          tk '        if rows.iter().any(|(t, v)| !t.is_finite() || !v.is_finite()) {' \
            '        if rows.iter().any(|(t, v)| !t.is_finite() || !v.is_finite()) && false { // knife' \
            a17b_nan_or_infinite_is_corrupt
          # K13 (#615 33e28) samples never count as continuous
          tk '            [.., (a, _), (b, _)] => b - a <= SUSTAIN_GAP_S,' \
            '            [.., (_a, _), (_b, _)] => false, // knife' \
            l2_no_pressure_continuous_spike_not_reaped
          # K14 (R1 PR 3 Q2) a lone spike with pressure unreadable reaps again (1.x)
          tk '    if pressure.is_none() && level == Level::Crit {' \
            '    if pressure.is_none() && level == Level::Crit && false { // knife' \
            l1_fallback_lone_spike_never_reaps
          # K15 (a63ab #626 L1) with pressure unreadable every round takes the capped fallback: never reaps
          tk '    if pressure.is_none() && !history.continuous() {' \
            '    if pressure.is_none() && (!history.continuous() || true) { // knife' \
            no_pressure_sustained_heat_still_reaps
      # aib-flaky (1ced7 #589, bb7dc M1 / M2): only the runs of the context being
      # judged count. Each knife drops one condition and must turn its own test red.
      - name: aib-flaky run context knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          fk() { python3 -I scripts/knife.py crates/aib-flaky/src/gh.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aib-flaky --locked --test flaky "$3"; }
          # M1: main mode takes any run, not just a main push
          fk '        Context::MainPush => event == Some("push") && branch == Some("main"),' \
             '        Context::MainPush => event.is_some() || branch.is_some() || true,' \
             run_counts_main_push_only
          # M2: the PR number is not checked
          fk '                            .any(|p| p.get("number").and_then(Value::as_u64) == Some(*number))' \
             '                            .any(|p| p.get("number").is_some() || *number > 0)' \
             run_counts_this_pr_only
          # M2: the head branch is not checked
          fk '                && branch == Some(head_ref.as_str())' \
             '                && (branch == Some(head_ref.as_str()) || !head_ref.is_empty())' \
             run_counts_this_pr_only
          # M2 end to end: the run filter is dropped from the listing
          fk '        if r.get("head_sha").and_then(Value::as_str) != Some(head) || !run_counts(r, ctx) {' \
             '        if r.get("head_sha").and_then(Value::as_str) != Some(head) || (false && !run_counts(r, ctx)) {' \
             m2_another_prs_green_run_of_the_same_head_is_not_a_rerun
      # aib-cloud (EU02 dev order r1; reviews of #623): each knife takes one rule out of the
      # pure decision code and must turn the test that guards it red.
      - name: aib-cloud decision knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          ck() { python3 -I scripts/knife.py "crates/aib-cloud/src/$1" "$2" "$3" --expect-fail "$4" \
                   -- cargo test -p aib-cloud --locked --lib "$4"; }
          # site record: a limit only has to be a JSON number (f1fae, seg. 2 M1)
          ck site.rs '                if !limits.get(*key).is_some_and(fits_u32) {' \
             '                if !limits.get(*key).is_some_and(Value::is_u64) { // knife' \
             values_the_lenient_read_would_not_use_are_gaps
          # site verify: cpulimit 0 is an ordinary number again (c477a, seg. 3 M1)
          ck verify.rs '        .filter(|v| *v != Some(0));' \
             '        .filter(|v| v.is_some()); // knife' \
             review_segment_3
          # host lock: any two different strings mean "another boot" (1ced7, seg. 4 M1)
          ck op.rs '        Some(h) if valid_boot_id(&h.boot_id) && valid_boot_id(boot_id) && h.boot_id != boot_id => {' \
             '        Some(h) if h.boot_id != boot_id => { // knife' \
             slow_is_not_dead
          # approval: a spent nonce is good for any operation (ebb36, seg. 4 M1)
          ck op.rs '    } else if used_by(&approval.nonce).is_some_and(|other| other != op) {' \
             '    } else if used_by(&approval.nonce).is_some_and(|other| other != op && op.is_empty()) { // knife' \
             an_approval_covers_one_plan_for_one_operation
          # quarantine: an old record is reused whatever the host looks like now (1ced7, seg. 5 M1)
          ck quarantine.rs '            if r.prev_firewall != ct_fw' \
             '            if r.prev_firewall.is_empty()' \
             a_stale_record_is_not_reused
          # quarantine: existing connections are left alone (33e28 K1)
          ck quarantine.rs '    actions.push(cut.clone());' \
             '    let _ = cut.clone(); // knife: no drop' \
             plan_order_is_record_egress_connections_route_verify
          # quarantine: no second drop after the route (33e28, seg. 5 M1)
          ck quarantine.rs '    actions.push(cut);' \
             '    let _ = cut; // knife: one drop only' \
             review_segment_5
          # quarantine: a CT that had no firewall file gets "no firewall" back (33e28, seg. 5 M2)
          ck quarantine.rs '    let firewall_back = if record.prev_firewall.is_empty() {' \
             '    let firewall_back = if record.prev_firewall.is_empty() && false {' \
             review_segment_5
          # quarantine: comment lines count as rules again (33e28, seg. 5 L1)
          ck quarantine.rs "        .filter(|l| !l.is_empty() && !l.starts_with('#'))" \
             '        .filter(|l| !l.is_empty())' \
             review_segment_5
          # quarantine guard: a record on disk no longer counts (33e28, seg. 5 r2 N)
          ck quarantine.rs '    if record.is_some() || is_quarantined(ct_fw) {' \
             '    if record.is_some() && is_quarantined(ct_fw) { // knife' \
             review_segment_5
          # quarantine: the record's edge block may hold more than this site's block (33e28 N)
          ck quarantine.rs "        return refuse(\"the record's edge block is not exactly this site's block\");" \
             '        // knife: any block goes' \
             review_segment_5
          # quarantine: a stale record is archived whatever the firewall is now (1ced7 L)
          ck quarantine.rs '    if ct_fw != restored_firewall {' \
             '    if ct_fw.is_empty() && ct_fw != restored_firewall { // knife' \
             a_stale_record_can_be_archived_when_the_host_is_fully_restored
          # quarantine: a stale record is archived whatever the journal says (1ced7, #625 seg. 2 M1)
          ck quarantine.rs '        None => return refuse("no journal for the quarantine this record belongs to"),' \
             '        None => {} // knife' \
             a_stale_record_can_be_archived_when_the_host_is_fully_restored
          # provision: escape sequences reach the approver's terminal (ebb36, #625 seg. 5 L1)
          ck provision.rs '        let unprintable = text.chars().any(char::is_control);' \
             '        let unprintable = false; // knife' \
             upward_paths_and_control_characters
          # site verify: a CT nobody recorded goes unnoticed (c477a's list, H13)
          ck verify.rs '        .any(|c| !record_cts.contains(c) && !platform.contains(c))' \
             '        .any(|c| !record_cts.contains(c) && !platform.contains(c) && c == &0)' \
             h13_every_ct_is_accounted_for
          # site verify: a stale host-health file is fine (H01)
          ck verify.rs '        Some(t) if now.saturating_sub(t) > 900 => Outcome::Red("stale"),' \
             '        Some(t) if now.saturating_sub(t) > 900 => Outcome::Green, // knife' \
             h01_h06_h07_h10_h12
          # edge domain: an AAAA record no longer blocks a domain (4.4.1 6.2)
          ck edge.rs '        out.push(NotReady::HasAaaa);' \
             '        // knife: AAAA ignored' \
             preflight_reads_a_aaaa_and_caa
          # edge domain: a name already on another site is added again
          ck edge.rs '            refuse("already on another site", name)' \
             '            Ok(alloc::vec![]) // knife' \
             add_refusals
          # backup check: a CT missing from the off-site backup goes unnoticed (4.4.1 10)
          ck backup.rs '        } else if missing {' \
             '        } else if missing && must_have.len() > 99 { // knife' \
             b02_every_ct_and_b03_config
          # backup check: an unencrypted object off-site is fine
          ck backup.rs '        if plain {' \
             '        if plain && newest.is_empty() { // knife' \
             b04_nothing_unencrypted_leaves_the_host
          # quarantine: an unfinished quarantine is archived all the same (1ced7, #625 seg. 2 r2)
          ck quarantine.rs '        Some(crate::op::State::Verified) => {}' \
             '        Some(_) => {} // knife' \
             a_stale_record_can_be_archived_when_the_host_is_fully_restored
          # provision: a refused placeholder is echoed raw to the terminal (ebb36, #625 seg. 5 r2)
          ck provision.rs '            return Err(format!("{name:?} between {{{{ }}}} is not a variable name"));' \
             '            return Err(format!("{name} is not a variable name"));' \
             a_refused_placeholder_is_quoted_in_the_finding
          # site svc: a quarantined site can be started (4.4.1 1.3)
          ck svc.rs '    if action != Svc::Stop {' \
             '    if action != Svc::Stop && action != Svc::Start { // knife' \
             a_quarantined_site_is_not_started_and_stopping_it_says_what_is_lost
          # site logs: values after secret-looking keys are shown
          ck svc.rs '                if end > 0 {' \
             '                if end > usize::MAX - 1 { // knife' \
             secrets_do_not_leave_with_the_logs
          # customer entry: characters a shell reads get as far as a word (Andy 11-10: customers operate their own site)
          ck customer.rs "            .all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || c == b'-' || c == b' ')" \
             '            .all(|c| c != 0)' \
             everything_else_is_refused_whole
          # customer entry: a request may carry extra words (another site, say)
          ck customer.rs '        if rest.is_empty() {' \
             '        if rest.len() < 9 { // knife' \
             everything_else_is_refused_whole
          # ARC: a raise goes past what the plan allows (4.4.1 23)
          ck arc.rs '            let next = (limits.cpulimit_x100 + 100).min(cpu_max);' \
             '            let next = limits.cpulimit_x100 + 100; // knife' \
             never_past_the_plan
          # ARC: a raise the host cannot back is proposed all the same
          ck arc.rs '            if room.memory_mb < next - limits.memory_mb {' \
             '            if room.memory_mb == u32::MAX { // knife' \
             never_past_what_the_host_can_back
          # provision: only the literal "/" is the root inside a shell line (ebb36, #619 stack L1)
          ck provision.rs "    value.starts_with('/') && value.bytes().all(|c| c == b'/' || c == b'.')" \
             '    value == "/" // knife' \
             root_spellings_and_dashes_in_prose
          # site verify (c477a's list): one judgement out per knife
          ck verify.rs '    let on_every_card = !cards.is_empty()' \
             '    let on_every_card = cards.first().is_some_and(|n| n.contains("firewall=1")) || !cards.is_empty()' \
             review_segment_3
          ck verify.rs '                Outcome::Red("ct_policy_open")' \
             '                Outcome::Green // knife' \
             review_segment_3
          ck verify.rs '        (SiteState::Active, false) => Outcome::Red("ct_down"),' \
             '        (SiteState::Active, false) => Outcome::Green, // knife' \
             s01_only_an_active_site_has_to_be_running
          ck verify.rs '        (u.thin_meta, 80, "thin_meta_full"),' \
             '        (u.thin_meta, 101, "thin_meta_full"), // knife' \
             h04_disk_thresholds
          ck verify.rs '        result("H05", Outcome::Red("inactive"))' \
             '        result("H05", Outcome::Green) // knife' \
             review_segment_3
          ck verify.rs '        if in_options {' \
             '        if in_options || true { // knife' \
             h08_h09_firewall_is_on
          ck verify.rs '        return result("H04", Outcome::Unknown("unread"));' \
             '        return result("H04", Outcome::Green); // knife' \
             h04_disk_thresholds
      # aib-cloud-host: gates of the host commands (reviews of #625).
      - name: aib-cloud-host command knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          hk() { python3 -I scripts/knife.py "crates/aib-cloud-host/src/$1" "$2" "$3" --expect-fail "$4" \
                   -- cargo test -p aib-cloud-host --locked "$4"; }
          # site quarantine without --plan goes on (33e28, seg. 4 L1)
