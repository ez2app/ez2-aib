# SPDX-License-Identifier: Apache-2.0
# AIB 2.0 Rust workspace (aibd). The Python ci.yml / release.yml are untouched (ADR 0001).
# 11-09 Andy「Rust 兩格改成必過」(a63ab 派 1ced7):no paths filter any more — every PR and every main push
#   triggers this, so the two cells always report (a required check that never starts would block every PR).
#   The `changes` job decides: no Rust path touched (RUST_CI_PATHS in aib/tools/release/docs_only.py, the one list;
#   prepr reads it too) ⇒ both cells move to ubuntu and print one line; otherwise fmt / clippy / test run for real.
#   main push / mixed / cannot tell / anything under .github/** ⇒ real run. The decision runs from the base version.
name: aibd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tool=aib/tools/release/docs_only.py
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/docs_only.py" 2>/dev/null; then tool="$RUNNER_TEMP/docs_only.py"; fi
          out=$(python3 "$tool" rust-ci --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD") || out=rust_ci=true
          # only a whole line rust_ci=false skips; anything else (old base script without rust-ci, error) runs for real
          run=true
          case $'\n'"$out"$'\n' in *$'\n'rust_ci=false$'\n'*) run=false ;; esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
  rust:
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 45: the Windows cell also runs the Job tests 5x and 7 knives
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon + Windows x64 (spec section 15). Windows results
        # are "CI-windows" level, not desktop verification (ADR 0001).
        # *-latest on purpose: pinned images get retired (macos-14 was refused
        # on 2026-11-07); the first step prints what we actually got.
        os: [macos-latest, windows-latest]
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - name: Windows version (what the Job tests ran on)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aibd-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-${{ matrix.os }}-
      - name: Core purity
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-core-purity.sh
          ./scripts/check-core-purity.sh --self-test
      - name: aib-sys dependents (only aibd)
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-sys-deps.sh
          ./scripts/check-sys-deps.sh --self-test
      - name: fmt
        if: env.RUN == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: env.RUN == 'true' && runner.os != 'macOS'
        run: cargo test --workspace --locked
      # The forkcount capture-completeness tests need kqueue to see every
      # short-lived child; shared GitHub macOS runners miss some (main
      # bbf12897). Skipped HERE, by name, so the summary says "filtered out"
      # and a warning is shown; they still run on our own Macs (#503).
      - name: test (macOS; two forkcount calibration tests skipped by name)
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          echo "::warning title=forkcount calibration skipped::calibrate_single_is_exact and calibrate_grandchild_follows_the_tree are not run on shared runners (kqueue misses short-lived children); run them locally"
          cargo test --workspace --locked -- --skip calibrate_single_is_exact --skip calibrate_grandchild_follows_the_tree
      # DECISION-8 item 2 / DECISION-11 A: the Job Object on the real kernel.
      # Five runs in one job; each must be green.
      - name: aib-sys job (Windows) 5x
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "== run $i/5"
            cargo test -q -p aib-sys --locked || exit 1
          done
      # DIAG-win-session-flake (a9136 11-09): the three "failed root open"
      # session tests used to wait for "2 active processes", which cmd +
      # conhost can reach before ping exists. They now wait for PING.EXE.
      # No Windows machine here: 20 runs in a row, one test at a time, all
      # 20 must pass; every run is printed, a red one with its member list.
      - name: aib-sys session failed-open tests (Windows) 20x
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          set -u -o pipefail
          cargo test -q -p aib-sys --locked --lib --no-run
          pass=0
          for i in $(seq 1 20); do
            # a filter that matches nothing is green too: require all 3 ran
            if cargo test -p aib-sys --locked --lib session::tests::a_failed_root_open \
                 -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/failed-open.log" \
               && grep -q "test result: ok. 3 passed" "$RUNNER_TEMP/failed-open.log"; then
              pass=$((pass + 1)); echo "== run $i/20 ok"
            else
              echo "== run $i/20 FAILED"
            fi
          done
          echo "session failed-open: $pass/20 passed"
          test "$pass" -eq 20
      - name: aib-sys job knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        run: ./scripts/check-win-job-knives.sh
      - name: aib-sys session knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        # preview.2 sessions: killing a session must take the whole tree. Two
        # knives, each must turn killing_a_session_takes_the_whole_tree red:
        # no terminate at all, and "only the root is killed" (ping survives).
        # No -q: this knife.py reads "test x ... FAILED" lines.
        run: |
          set -eu
          k() { python3 -I scripts/knife.py crates/aib-sys/src/session.rs "$1" "$2" \
                  --expect-fail killing_a_session_takes_the_whole_tree \
                  -- cargo test -p aib-sys --locked --test session_win; }
          k '        self.job.terminate(1)' '        Ok(()) // knife: no terminate'
          k '        self.job.terminate(1)' \
            '        self.child.kill().map_err(|_| SysError::Unknown) // knife: root only'
          # 1ced7 #543 High: a root whose handle cannot be opened after the spawn is
          # "not started" only once the root is gone AND the Job is empty
          k2() { python3 -I scripts/knife.py crates/aib-sys/src/session.rs "$1" "$2" \
                   --expect-fail "$3" -- cargo test -p aib-sys --locked --lib session::; }
          k2 '                let mut term = terminate;' \
            '                let mut term = |_: &Job| Ok::<(), SysError>(()); let _ = terminate; // knife: no kill' \
            a_failed_root_open_kills_and_confirms_the_whole_tree
          k2 '                    Ok(k) if k.all_gone() => e,' '                    Ok(_) => e, // knife: trust any report' \
            a_failed_root_open_whose_child_outlives_the_root_is_not_reaped
          k2 '                    return Err((SpawnError::Spawn(e), Some(Box::new(left))));' \
            '                    drop(left); return Err((SpawnError::Spawn(e), None)); // knife: drop the tree' \
            a_failed_root_open_whose_child_outlives_the_root_is_not_reaped
          # DIAG-win-session-flake: the tests really wait for ping; an image
          # that never comes must turn them red in hold_members
          k2 '    const AWAITED_IMAGE: &str = "PING.EXE";' \
            '    const AWAITED_IMAGE: &str = "NOPE.EXE"; // knife: wait for nothing real' \
            a_failed_root_open_kills_and_confirms_the_whole_tree
      - name: aibd Windows session adapter knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        # session_windows.rs maps aib-sys results to the shared stop: clean only
        # when the Job emptied AND every handle signaled; a not-reaped spawn keeps its pid.
        run: |
          set -eu
          k() { python3 -I scripts/knife.py crates/aibd/src/platform/session_windows.rs "$1" "$2" \
                  --expect-fail "$3" -- cargo test -p aibd --locked --lib platform::session_windows; }
          k '            let status = if k.all_gone() {' '            let status = if k.survivors.is_empty() {' \
            a_job_that_did_not_empty_is_never_clean
          k '        SpawnError::Spawn(SysError::NotReaped { pid, .. }) => Some(*pid),' \
            '        SpawnError::Spawn(SysError::NotReaped { .. }) => None,' \
            a_spawn_not_confirmed_gone_keeps_its_pid
          k '                _ => idle(timeout),' '                _ => Some(Exit::Code(0)), // knife: unreadable is an exit' \
            a_root_wait_or_exit_code_error_is_never_an_exit
          k '    std::thread::sleep(timeout.min(IDLE_MAX));' '    let _ = timeout.min(IDLE_MAX); // knife: no pause' \
            an_unanswered_root_wait_pauses_before_none_and_is_bounded
          k '    std::thread::sleep(timeout.min(IDLE_MAX));' '    std::thread::sleep(timeout.max(IDLE_MAX)); // knife: unbounded' \
            an_unanswered_root_wait_pauses_before_none_and_is_bounded
          # a9136 #555 Medium: failed starts not confirmed gone are kept and swept / listed at shutdown
          k '        (Some(_), Some(l)) => LEFTOVERS.lock().unwrap_or_else(|e| e.into_inner()).push(*l),' \
            '        (Some(_), Some(l)) => drop(l), // knife: not kept' \
            a_kept_failed_start_is_stopped_by_the_shutdown_sweep
          k '        (Some(pid), None) => UNHELD.lock().unwrap_or_else(|e| e.into_inner()).push(pid),' \
            '        (Some(_), None) => {} // knife: silent' \
            an_unheld_failed_start_is_listed_at_shutdown
          python3 -I scripts/knife.py crates/aibd/src/platform/mod.rs \
            '        session_windows::stop_leftovers(deadline)' \
            '        { let _ = deadline; Vec::new() } // knife: Windows sweeps nothing' \
            --expect-fail an_unheld_failed_start_is_listed_at_shutdown \
            -- cargo test -p aibd --locked --lib platform::session_windows
      - name: aibd Windows sessions wiring knife (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        # default_spawn must be session_windows::spawn (a63ab 11-09: unwired,
        # every POST was 422 unsupported_platform). The knife puts the refusal
        # back; the real-aibd test must turn red.
        run: |
          set -eu
          python3 -I scripts/knife.py crates/aibd/src/platform/mod.rs \
            '        session_windows::spawn' \
            '        |_: &session::Spec, _| Err(session::SpawnFail { tag: "unsupported_platform".into(), left_running: None }) // knife: not wired' \
            --expect-fail delete_stops_the_grandchild_and_confirms_the_tree \
            -- cargo test -p aibd --locked --test sessions_windows
