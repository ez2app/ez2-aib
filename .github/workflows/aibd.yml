    if: ${{ !cancelled() }}
    # 90: ~41 min inside the macOS rust cell (11-12), 51.5 min as its own job on #732 run 43273505548 (cache
    # restore + compile included); 60 left under 9 min of room (c477a 11-13, f1fae FALLBACK #732)
    timeout-minutes: 90
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache/restore@v4
        id: cache
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aibd-macos-latest-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-macos-latest-
      # aib-cloud (host A dev order r1; reviews of #623): each knife takes one rule out of the
      # pure decision code and must turn the test that guards it red.
      - name: knife timer
        if: env.RUN == 'true' && runner.os == 'macOS' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: echo "KNIFE_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: aib-cloud decision knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: ./crates/aib-cloud/knives/knives-cloud-decision.sh
      # S66-4 shadow (7b81e, 519d0 11-15): which knives this pull request would have had to run if a knife
      # whose inputs did not change could be skipped. Nothing is skipped; never turns the cell red.
      - name: knife-affected (shadow)
        if: ${{ !cancelled() && env.RUN == 'true' && runner.os == 'macOS' && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/knife-affected-shadow.sh "cloud decision knives (macOS)" --source crates/aib-cloud/knives/knives-cloud-decision.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.RUN == 'true' && runner.os == 'macOS' && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          name: cireuse-ledger-knives-cloud-knives
          path: reuse-ledger/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
      # S66-0c (519d0 11-14): only a main push saves the build cache; a pull request restores it and never
      # saves its own copy (each PR copy was 0.7-2.4 GB and the repository went over GitHub's 10 GB, S66-0)
      - uses: actions/cache/save@v4
        if: env.RUN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

