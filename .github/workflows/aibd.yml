          # a review that names the pin anywhere but its first line passes (c477a #662 N1)
          pk params.rs '    if !first.contains(pin) {' '    if !review.contains(pin) { // knife' \
             a_review_has_passed_and_names_the_pin
          # the shared program is run whatever its sha256
