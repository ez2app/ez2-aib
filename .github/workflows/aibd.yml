# SPDX-License-Identifier: Apache-2.0
# AIB 2.0 Rust workspace (aibd). The Python ci.yml / release.yml are untouched (ADR 0001).
# 11-09 Andy「Rust 兩格改成必過」(a63ab 派 1ced7):no paths filter any more — every PR and every main push
#   triggers this, so the two cells always report (a required check that never starts would block every PR).
#   The `changes` job decides: no Rust path touched (RUST_CI_PATHS in aib/tools/release/docs_only.py, the one list;
#   prepr reads it too) ⇒ both cells move to ubuntu and print one line; otherwise fmt / clippy / test run for real.
#   main push / mixed / cannot tell / anything under .github/** ⇒ real run. The decision runs from the base version.
name: aibd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tool=aib/tools/release/docs_only.py
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/docs_only.py" 2>/dev/null; then tool="$RUNNER_TEMP/docs_only.py"; fi
          out=$(python3 "$tool" rust-ci --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD") || out=rust_ci=true
          # only a whole line rust_ci=false skips; anything else (old base script without rust-ci, error) runs for real
          run=true
          case $'\n'"$out"$'\n' in *$'\n'rust_ci=false$'\n'*) run=false ;; esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
  rust:
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 75: kept as headroom; the cloud knives (aib-cloud ~41 min, aib-cloud-host ~29 min) moved to the cloud-knives / cloud-host-knives jobs (11-12, macOS cell had hit 70); Windows still runs the Job tests 5x and 7 knives
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon + Windows x64 (spec section 15). Windows results
        # are "CI-windows" level, not desktop verification (ADR 0001).
        # *-latest on purpose: pinned images get retired (macos-14 was refused
        # on 2026-11-07); the first step prints what we actually got.
        os: [macos-latest, windows-latest]
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    # Self-hosted Mac (label ez2-aib-mac): only the macOS cell, only when the repository variable
    # AIB_MAC_SELFHOSTED is 'on', only for a pull request from a branch of this repository whose name
    # starts with integ/ or release/ or that carries the label mac-selfhosted. Pushes to main stay on
    # GitHub's runners. The cell keeps its name (it comes from matrix.os, not from runs-on). A fork can
    # rewrite this line in its own PR, so this is not the guard: the runner refuses fork and non
    # push / pull_request jobs in its job-started hook, and the repository asks approval for outside
    # contributors' runs. AIB_MAC_SELFHOSTED=off sends everything back to GitHub's runners.
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest'
      || (matrix.os == 'macos-latest' && vars.AIB_MAC_SELFHOSTED == 'on'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (startsWith(github.head_ref, 'integ/') || startsWith(github.head_ref, 'release/')
              || contains(github.event.pull_request.labels.*.name, 'mac-selfhosted')))
         && fromJSON('["self-hosted","macOS","ARM64","ez2-aib-mac"]')
      || matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - name: Windows version (what the Job tests ran on)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # runner.environment (github-hosted / self-hosted) keeps a target built on the self-hosted Mac
          # out of GitHub's macOS image and the other way round
          key: aibd-${{ matrix.os }}-${{ runner.environment }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-${{ matrix.os }}-${{ runner.environment }}-
      - name: Core purity
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-core-purity.sh
          ./scripts/check-core-purity.sh --self-test
      - name: aib-sys dependents (aibd, aib-procwatch)
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-sys-deps.sh
          ./scripts/check-sys-deps.sh --self-test
      - name: fmt
        if: env.RUN == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # merge-ops v2 §7.2 (a9136 11-09): every knife.py anchor in the workflows
      # and scripts must occur exactly once in its file, before the long test
      # and knife steps (#578 lost a round to anchors main had moved away).
      - name: knife anchors
        if: env.RUN == 'true'
        shell: bash
        run: cargo run -q --locked -p aib-xtask -- knife-anchors
      - name: knife anchors knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        # the checker itself: a moved anchor must stay red, and a knife line it
        # cannot read must never be skipped. Each knife must hit its own test.
        run: |
          set -eu
          ka() { python3 -I scripts/knife.py xtask/src/knife_anchors.rs "$1" "$2" \
                   --expect-fail "$3" -- cargo test -p aib-xtask --locked; }
          ka '    text.matches(old).count()' '    let _ = (text, old); 1 // knife: always once' \
            run_is_red_when_an_anchor_moved_and_green_when_it_is_there
          ka '                    Err(e) => scan.unresolved.push(format!("{at}: {e}")),' \
            '                    Err(_) => {} // knife: skip what cannot be read' \
            what_cannot_be_read_is_unresolved_not_skipped
          # KA3 (1ced7 #590 L3) a line that mentions knife.py in a form not read is skipped
          ka '        if mentions && !handled {' '        if mentions && !handled && false { // knife' \
            what_cannot_be_read_is_unresolved_not_skipped
          # KA4 (1ced7 #590 L3) no knife found reads as clean
          ka '    if !unresolved.is_empty() || knives.is_empty() {' \
            '    if !unresolved.is_empty() || (knives.is_empty() && false) { // knife' \
            run_is_red_when_an_anchor_moved_and_green_when_it_is_there
          # KA5 (1ced7 #590 H1) $'...' escapes not decoded (this line is itself $'...')
          ka $'                    \'n\' => \'\\n\',' $'                    \'n\' => \'n\', // knife' \
            ansi_c_quoted_anchors_are_read_like_bash
          # KA6 (a63ab #590 / #623 ck) a positional inside a word is not filled in
          ka '                s.push_str(&t);' '                let _ = &t; // knife: argument dropped' \
            a_positional_inside_a_word_is_filled_in
      - name: test
        if: env.RUN == 'true' && runner.os != 'macOS'
        run: cargo test --workspace --locked
      # The forkcount capture-completeness tests need kqueue to see every
      # short-lived child; shared GitHub macOS runners miss some (main
      # bbf12897). Skipped HERE, by name, so the summary says "filtered out"
      # and a warning is shown; they still run on our own Macs (#503).
      - name: test (macOS; two forkcount calibration tests skipped by name)
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          echo "::warning title=forkcount calibration skipped::calibrate_single_is_exact and calibrate_grandchild_follows_the_tree are not run on shared runners (kqueue misses short-lived children); run them locally"
          cargo test --workspace --locked -- --skip calibrate_single_is_exact --skip calibrate_grandchild_follows_the_tree
      # aib-verify g1 (1ced7, PLAN-approvals-to-rust C1/C2): the G1 probes without
      # Claude (30 setuid ps / a stuck setuid ps, one slot) against this tree's own
      # aibd. Until G1 is on main this step checks the tool, not G1: rc 0 or 1 and a
      # well-formed first line; the report goes to the step summary. Once G1 is on
      # main, require rc 0 here.
      - name: aib-verify g1 probes (macOS, no Claude)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --locked -p aibd -p aib-fixture-tree -p aib-verify
          T="$PWD/target/debug"; OUT="$RUNNER_TEMP/aib-verify-g1"
          set +e
          "$T/aib-verify" g1 --head "$(git rev-parse HEAD)" --bin "$T/aibd" --fixture "$T/aib-fixture-tree" \
            --out "$OUT" --burst-runs 3 --stuck-runs 2 --host "ci-$RUNNER_OS"
          rc=$?
          set -e
          cat "$OUT/VERIFY-g1.md" >> "$GITHUB_STEP_SUMMARY" || true
          echo "aib-verify g1 rc $rc"
          [ "$rc" = 0 ] || [ "$rc" = 1 ] || { echo "::error::aib-verify g1 could not run (rc $rc)"; exit 1; }
          head -1 "$OUT/VERIFY-g1.md" | grep -Eq '^驗收: (通過|不通過) 頭: [0-9a-f]{40} 機: ci-macOS 樣本: burst 3 stuck 2 沒驗: ' \
            || { echo "::error::aib-verify g1 first line is malformed"; head -1 "$OUT/VERIFY-g1.md"; exit 1; }
      # aib-persona (1ced7, persona tool gaps 11-10): each knife drops one check and must
      # turn its own test red.
      - name: aib-persona knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          pk() { python3 -I scripts/knife.py "crates/aib-persona/src/$1" "$2" "$3" --expect-fail "$5" \
                   -- cargo test -p aib-persona --locked $4 "$5"; }
          # P1 a receipt outside the allowed roots is taken
          pk pointer.rs '        .any(|r| real.starts_with(&r));' \
             '        .any(|r| real.starts_with(&r) || true); // knife' \
             '--test persona' paths_outside_the_roots_are_refused_however_they_are_spelled
          # P2 the path is compared as spelled: `..` and links escape the root
          pk pointer.rs '    let real = std::fs::canonicalize(expand(path, w))' \
             '    let real = Ok::<_, std::io::Error>(expand(path, w)) // knife' \
             '--test persona' paths_outside_the_roots_are_refused_however_they_are_spelled
          # P3 a dm id is taken without looking in the queue
          pk pointer.rs '        return if (w.dm_exists)(p) {' \
             '        return if (w.dm_exists)(p) || true { // knife' \
             '--test persona' dm_ids_must_be_in_the_queue_including_retired
          # P4 another writer's line is voided without a dm id
          pk lib.rs '    if owner != Some(by) {' \
             '    if owner != Some(by) && false { // knife' \
             '--test persona' void_takes_a_line_out_of_the_count_and_keeps_it_on_record
          # P5 groups still count voided lines
          pk lib.rs '        if voided.contains_key(&l.id) {' \
             '        if voided.contains_key(&l.id) && false { // knife' \
             '--test persona' void_takes_a_line_out_of_the_count_and_keeps_it_on_record
          # P6 the same pointer under two lanes is two groups
          pk lib.rs '        if !seen_ptr.insert(ptr_key) {' \
             '        if !seen_ptr.insert(ptr_key) && false { // knife' \
             '--lib' one_pointer_counts_once_across_lanes
          # P7 a pinned tree with local changes is used
          pk pin.rs '    if !dirty.is_empty() {' \
             '    if !dirty.is_empty() && false { // knife' \
             '--test persona' doctor_pins_a_sha_and_refuses_anything_else
          # P8 two lines of one file are one pointer (043dd #627 M2)
          pk lib.rs '            (Some(r), Some(n)) => format!("{r}:{n}"),' \
             '            (Some(r), Some(_)) => r.to_string(), // knife' \
             '--lib' two_lines_of_one_file_are_two_pointers
          # P9 a ledger that is a link is written through (043dd #627 M3)
          pk main.rs '    if let Ok(md) = std::fs::symlink_metadata(path) {' \
             '    if let Ok(md) = std::fs::metadata(path) { // knife' \
             '--test persona' the_ledger_is_never_written_through_a_link
          # P10 a persona folder that leads out of the candidate root is written into (M3)
          pk main.rs '    if !real_dir.starts_with(&real_root) {' \
             '    if !real_dir.starts_with(&real_root) && false { // knife' \
             '--test persona' the_ledger_is_never_written_through_a_link
          # P11 a bare name.md / name.ext:N in the working folder is refused (043dd #627 M4)
          pk pointer.rs "    if p.contains('/') || p.starts_with('~') || bare_file {" \
             "    if p.contains('/') || p.starts_with('~') || (bare_file && false) { // knife" \
             '--test persona' a_bare_file_name_in_the_working_folder_is_a_path
          # P12 check() takes dm:q_X as a message without asking the queue (ebb36 #627 M1;
          # the CLI strips the prefix first, so the library test is the one that sees it)
          pk pointer.rs '    let p = dm_alias(p).unwrap_or(p);' \
             '    let p = p; // knife' \
             '--lib' a_prefixed_dm_id_is_the_dm_id
          # P13 q_X and dm:q_X are two groups (ebb36 #627 M1)
          pk lib.rs '            (None, _) => pointer::dm_alias(ptr).unwrap_or(ptr).to_string(),' \
             '            (None, _) => ptr.to_string(), // knife' \
             '--lib' a_dm_id_counts_once_with_or_without_its_prefix
          # P14 dm:q_X is stored with its prefix (ebb36 #627 M1)
          pk main.rs '    let ptr = pointer::dm_alias(ptr).unwrap_or(ptr).to_string();' \
             '    let ptr = ptr.to_string(); // knife' \
             '--test persona' dm_ids_must_be_in_the_queue_including_retired
      # R1 thermal (c477a, #473 1.x cooldown.py → aib-thermal): 12 knives, each breaks one
      # rule of the pure decision and must turn its own test red (knife.py restores the file).
      - name: aib-thermal knives
        if: env.RUN == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          tk() { python3 -I scripts/knife.py crates/aib-thermal/src/lib.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aib-thermal --locked --lib "$3"; }
          # K1 pressure ignored
          tk '        if p != 0 {' \
            '        if p != 0 && false { // knife' \
            a5_pressure_reaps_now
          # K2 fallback ignores avg
          tk '    if value >= REAP_AVG_C {' \
            '    if value >= REAP_AVG_C && false { // knife' \
            a18_fallback_honours_avg
          # K3 instant crit lost
          tk '    if max >= CPU_CRIT_C {' \
            '    if max >= CPU_CRIT_C && false { // knife' \
            a7_no_history_falls_back_to_instant
          # K4 no_signal fallback skipped
          tk '    if pressure.is_none() && !history.continuous() {' \
            '    if pressure.is_none() && !history.continuous() && false { // knife' \
            a15_gap_without_pressure_falls_back
          # K5 gaps count as continuous
          tk '        if v < limit || t_prev - t > SUSTAIN_GAP_S {' \
            '        if v < limit || t_prev - t > SUSTAIN_GAP_S * 100.0 { // knife' \
            a4_broken_streak_restarts
          # K6 two samples are enough
          tk '        if n >= SUSTAIN_MIN_SAMPLES {' \
            '        if n >= 1 { // knife' \
            a16_two_samples_across_pause_not_sustained
          # K7 same-moment panels counted twice
          tk '            if t_counted - t >= SAMPLE_SPACING_S {' \
            '            if t_counted - t >= 0.0 { // knife' \
            a16b_same_moment_panels_are_one_sample
          # K8 slow writer drops newer rows
          tk '            (-SUSTAIN_GAP_S..=HISTORY_KEEP_S).contains(&age)' \
            '            (0.0..=HISTORY_KEEP_S).contains(&age) // knife' \
            a14c_slow_writer_keeps_newer_low_sample
          # K9 no nogo level
          tk '    for (level, limit) in [(Level::Crit, REAP_AVG_C), (Level::Hot, NOGO_AVG_C)] {' \
            '    for (level, limit) in [(Level::Crit, REAP_AVG_C)] { // knife' \
            a9_nogo_at_85_without_reap
          # K10 hot reaps
          tk '        self.level == Level::Crit' \
            '        matches!(self.level, Level::Hot | Level::Crit) // knife' \
            a9_nogo_at_85_without_reap
          # K11 max instead of avg
          tk '        Some(self.avg.filter(|v| v.is_finite()).unwrap_or(max))' \
            '        Some(self.avg.filter(|v| v.is_finite()).map(|_| max).unwrap_or(max)) // knife' \
            a1_spike_not_reaped
          # K12 corrupt rows accepted
          tk '        if rows.iter().any(|(t, v)| !t.is_finite() || !v.is_finite()) {' \
            '        if rows.iter().any(|(t, v)| !t.is_finite() || !v.is_finite()) && false { // knife' \
            a17b_nan_or_infinite_is_corrupt
          # K13 (#615 33e28) samples never count as continuous
          tk '            [.., (a, _), (b, _)] => b - a <= SUSTAIN_GAP_S,' \
            '            [.., (_a, _), (_b, _)] => false, // knife' \
            l2_no_pressure_continuous_spike_not_reaped
          # K14 (R1 PR 3 Q2) a lone spike with pressure unreadable reaps again (1.x)
          tk '    if pressure.is_none() && level == Level::Crit {' \
            '    if pressure.is_none() && level == Level::Crit && false { // knife' \
            l1_fallback_lone_spike_never_reaps
          # K15 (a63ab #626 L1) with pressure unreadable every round takes the capped fallback: never reaps
          tk '    if pressure.is_none() && !history.continuous() {' \
            '    if pressure.is_none() && (!history.continuous() || true) { // knife' \
            no_pressure_sustained_heat_still_reaps
      # aib-flaky (1ced7 #589, bb7dc M1 / M2): only the runs of the context being
      # judged count. Each knife drops one condition and must turn its own test red.
      - name: aib-flaky run context knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          fk() { python3 -I scripts/knife.py crates/aib-flaky/src/gh.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aib-flaky --locked --test flaky "$3"; }
          # M1: main mode takes any run, not just a main push
          fk '        Context::MainPush => event == Some("push") && branch == Some("main"),' \
             '        Context::MainPush => event.is_some() || branch.is_some() || true,' \
             run_counts_main_push_only
          # M2: the PR number is not checked
          fk '                            .any(|p| p.get("number").and_then(Value::as_u64) == Some(*number))' \
             '                            .any(|p| p.get("number").is_some() || *number > 0)' \
             run_counts_this_pr_only
          # M2: the head branch is not checked
          fk '                && branch == Some(head_ref.as_str())' \
             '                && (branch == Some(head_ref.as_str()) || !head_ref.is_empty())' \
             run_counts_this_pr_only
          # M2 end to end: the run filter is dropped from the listing
          fk '        if r.get("head_sha").and_then(Value::as_str) != Some(head) || !run_counts(r, ctx) {' \
             '        if r.get("head_sha").and_then(Value::as_str) != Some(head) || (false && !run_counts(r, ctx)) {' \
             m2_another_prs_green_run_of_the_same_head_is_not_a_rerun
          # #644 --head: an earlier head must be one of the PR's own commits
          fk '                let head = pr_commit(src, repo, n, sha)?;' \
             '                let head = if sha.is_empty() { pr_commit(src, repo, n, sha)? } else { sha.to_string() }; // knife' \
             a_head_that_is_not_the_prs_is_unknown
          # #644 --head: a commit list at GitHub's cap may be cut off
          fk '    if shas.len() >= PR_COMMITS_CAP {' \
             '    if shas.len() >= PR_COMMITS_CAP && false { // knife' \
             a_head_that_is_not_the_prs_is_unknown
          # #644 --head: a compare at the file cap may be cut off
          fk '    if arr.len() >= COMPARE_FILES_CAP {' \
             '    if arr.len() >= COMPARE_FILES_CAP && false { // knife' \
             a_compare_at_the_file_cap_is_unknown
          # 2240e #654 M1: a merged PR's runs (pull_requests empty) are dropped again
          fk '                if str_at(&p, "/state")? == "open" {' \
             '                if str_at(&p, "/state")? == "open" || true { // knife' \
             a_merged_prs_runs_are_still_its_own
      # aib-public-leak (a9136, approvals-to-rust C10 / RULES §16): each knife drops one rule
      # and must turn its own test red; the tests' messages name the rule (RULES §15.17).
      - name: aib-public-leak knives
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          pl() { python3 -I scripts/knife.py crates/aib-public-leak/src/lib.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aib-public-leak --locked --lib "$3"; }
          # PL1 the denylist is matched case-sensitively
          pl '        let low = text.to_lowercase();' '        let low = text.to_string(); // knife' \
             denylist_skips_comments_and_ignores_case
          # PL2 a documentation range (203.0.113/24) is reported as public
          pl '        || (a == 203 && b == 0 && c == 113)' '        || false // knife' \
             documentation_and_private_ranges_pass_public_ones_do_not
          # PL3 a five-part version (1.2.3.4.5) is read as an address
          pl '    if digit_after || part_after {' '    if digit_after || (part_after && false) { // knife' \
             addresses_are_found_but_longer_dotted_runs_are_not
          # PL4 a path that hits is printed in the line findings of that file
