# SPDX-License-Identifier: Apache-2.0
# AIB 2.0 Rust workspace (aibd). The Python ci.yml / release.yml are untouched (ADR 0001).
# 11-09 Andy「Rust 兩格改成必過」(a63ab 派 1ced7):no paths filter any more — every PR and every main push
#   triggers this, so the two cells always report (a required check that never starts would block every PR).
#   The `changes` job decides: no Rust path touched (RUST_CI_PATHS in aib/tools/release/docs_only.py, the one list;
#   prepr reads it too) ⇒ both cells move to ubuntu and print one line; otherwise fmt / clippy / test run for real.
#   main push / mixed / cannot tell / anything under .github/** ⇒ real run. The decision runs from the base version.
name: aibd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tool=aib/tools/release/docs_only.py
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/docs_only.py" 2>/dev/null; then tool="$RUNNER_TEMP/docs_only.py"; fi
          out=$(python3 "$tool" rust-ci --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD") || out=rust_ci=true
          # only a whole line rust_ci=false skips; anything else (old base script without rust-ci, error) runs for real
          run=true
          case $'\n'"$out"$'\n' in *$'\n'rust_ci=false$'\n'*) run=false ;; esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
  rust:
    needs: changes
    # changes red / skipped ⇒ still reach the step below that turns the cell red (else a required cell just waits)
    if: ${{ !cancelled() }}
    # 45: the Windows cell also runs the Job tests 5x and 7 knives
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon + Windows x64 (spec section 15). Windows results
        # are "CI-windows" level, not desktop verification (ADR 0001).
        # *-latest on purpose: pinned images get retired (macos-14 was refused
        # on 2026-11-07); the first step prints what we actually got.
        os: [macos-latest, windows-latest]
    # no Rust path touched ⇒ same cell name, on ubuntu, one line (this condition and RUN below say the same thing)
    runs-on: ${{ needs.changes.outputs.run == 'false' && 'ubuntu-latest' || matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: upstream job (changes) must have passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::changes=${{ needs.changes.result }} — this cell is red because the change detection did not pass"
          exit 1
      - name: no Rust path changed, nothing else to run
        if: env.RUN != 'true'
        run: echo "::notice::no Rust path changed (see the changes job; RUST_CI_PATHS in aib/tools/release/docs_only.py); this cell is not run"
      - name: Windows version (what the Job tests ran on)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - name: Toolchain (pinned by rust-toolchain.toml)
        if: env.RUN == 'true'
        shell: bash
        run: |
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} ($ImageOS $ImageVersion)"
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version
      - uses: actions/cache@v4
        if: env.RUN == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: aibd-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: aibd-${{ matrix.os }}-
      - name: Core purity
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-core-purity.sh
          ./scripts/check-core-purity.sh --self-test
      - name: aib-sys dependents (aibd, aib-procwatch)
        if: env.RUN == 'true'
        shell: bash
        run: |
          ./scripts/check-sys-deps.sh
          ./scripts/check-sys-deps.sh --self-test
      - name: fmt
        if: env.RUN == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: env.RUN == 'true' && runner.os != 'macOS'
        run: cargo test --workspace --locked
      # The forkcount capture-completeness tests need kqueue to see every
      # short-lived child; shared GitHub macOS runners miss some (main
      # bbf12897). Skipped HERE, by name, so the summary says "filtered out"
      # and a warning is shown; they still run on our own Macs (#503).
      - name: test (macOS; two forkcount calibration tests skipped by name)
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          echo "::warning title=forkcount calibration skipped::calibrate_single_is_exact and calibrate_grandchild_follows_the_tree are not run on shared runners (kqueue misses short-lived children); run them locally"
          cargo test --workspace --locked -- --skip calibrate_single_is_exact --skip calibrate_grandchild_follows_the_tree
      # DECISION-10 B (a9136; bb7dc #580): the child listing goes through aib-sys.
      # Each knife breaks one rule and must turn its own test red (knife.py
      # restores the file and checks the named test failed).
      - name: procwatch listing knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          fc() { python3 -I scripts/knife.py "$1" "$2" "$3" --expect-fail "$4" \
                   -- cargo test -p aib-forkcount --locked --test forkcount "$4"; }
          # K1 procwatch: a failed listing washed into an empty list
          fc crates/aib-procwatch/src/lib.rs \
            '            let kids = match list_children(sh, p) {' \
            '            let kids = match list_children(sh, p).or_else(|_| Ok::<_, SysError>(Vec::new())) { // knife' \
            calibrate_a_failed_listing_is_unverified_not_empty
          # K2 procwatch: a list that did not fit is skipped instead of counted
          fc crates/aib-procwatch/src/lib.rs \
            $'                Err(e) => {\n                    let mut g = lock(sh);\n                    g.stats.list_failures += 1;' \
            $'                Err(SysError::Incomplete) => continue, // knife\n                Err(e) => {\n                    let mut g = lock(sh);\n                    g.stats.list_failures += 1;' \
            calibrate_an_incomplete_listing_is_unverified
          # K3 aib-sys fill stage, end to end: a failed fill read as "0 bytes"
          fc crates/aib-sys/src/list.rs \
            '        let bytes = call(&mut buf).map_err(SysError::from_errno)?;' \
            '        let bytes = call(&mut buf).unwrap_or(0); // knife' \
            calibrate_a_failed_listing_is_unverified_not_empty
          # K4 aib-sys truncation, end to end: a full buffer accepted as the whole list
          fc crates/aib-sys/src/list.rs \
            '        if n < cap {' \
            '        if n <= cap { // knife' \
            calibrate_an_incomplete_listing_is_unverified
          # K5 forkcount, end to end: a foreign child not flagged (one missed + one foreign)
          fc crates/aib-forkcount/src/main.rs \
            $'        if self.adopted_not_created > 0 {\n            r.push("adopted_not_created");' \
            $'        if false {\n            r.push("adopted_not_created"); // knife' \
            calibrate_one_missed_and_one_foreign_is_unverified
          # K6 forkcount: comparing counts only (one missed + one foreign would pass)
          python3 -I scripts/knife.py crates/aib-forkcount/src/main.rs \
            '        let a_p = cs.iter().filter(|c| adopted.get(c) == Some(p)).count() as u64;' \
            '        let a_p = (adopted.values().filter(|q| *q == p).count() as u64).min(c_p); // knife' \
            --expect-fail one_missed_and_one_foreign_is_caught_although_totals_match \
            -- cargo test -p aib-forkcount --locked --bin aib-forkcount
          # K7 aib-sys size-query stage (unit; procwatch cannot reach it): a failed size query ignored
          python3 -I scripts/knife.py crates/aib-sys/src/macos.rs \
            '    if need < 0 || (need == 0 && errno() != 0) {' \
            '    if false { // knife' \
            --expect-fail a_failed_size_query_is_an_error \
            -- cargo test -p aib-sys --locked --lib macos::
          # K8 aib-sys fill stage (unit): errno not cleared before a fill ⇒ a stale ESRCH reads as Gone
          python3 -I scripts/knife.py crates/aib-sys/src/macos.rs \
            $'        clear_errno();\n        let n = raw(buf.as_mut_ptr().cast::<c_void>(), size);' \
            $'        let n = raw(buf.as_mut_ptr().cast::<c_void>(), size); // knife' \
            --expect-fail a_failure_without_errno_is_unknown_not_a_stale_gone \
            -- cargo test -p aib-sys --locked --lib macos::
      # M1 seats (a9136): an Idempotency-Key is bound to its request, a seat
      # is written together with its event, a session row follows its events
      # and open sessions are interrupted at start. Each knife must turn its
      # own test red. RUSTFLAGS has -D warnings, so a knife keeps every
      # binding used (`&& false`, not `if false`).
      - name: seats / sessions / output knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          sk() { python3 -I scripts/knife.py crates/aib-store/src/seats.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aib-store --locked --test seats "$3"; }
          # S1 a reused key with another request replays the first answer instead of refusing
          sk '                    if request != k.request {' \
            '                    if request != k.request && false { // knife' \
            the_same_key_with_another_request_is_a_conflict_and_writes_nothing
          # S2 the seat is written without its event
          sk '            insert_event(&tx, &event)?;' \
            '            let _ = (insert_event, &event); // knife: no event (keeps the import used)' \
            a_seat_and_its_event_survive_a_restart
          # S3 a session still holding a slot is not interrupted at start (only `running` ones)
          python3 -I scripts/knife.py crates/aib-store/src/sessions.rs \
            "                     WHERE state = 'running' OR holds_slot = 1" \
            "                     WHERE state = 'running' -- knife" \
            --expect-fail open_sessions_are_interrupted_at_start_and_never_resumed \
            -- cargo test -p aib-store --locked --test sessions open_sessions_are_interrupted_at_start_and_never_resumed
          # S4 aibd writes the event but not the session row: nothing to read back
          python3 -I scripts/knife.py crates/aibd/src/sessions.rs \
            '        if let Err(err) = self.store.session_event(row, ev) {' \
            '        if let Err(err) = self.store.append(vec![ev]).map(|_| drop(row)) { // knife' \
            --expect-fail a_seat_session_is_stored_and_read_back_after_a_restart \
            -- cargo test -p aibd --locked --test seat_sessions a_seat_session_is_stored_and_read_back_after_a_restart
          # S5 sessions go back to discarding their output: nothing to read
          python3 -I scripts/knife.py crates/aibd/src/platform/session_unix.rs \
            '        discard_output: false,' \
            '        discard_output: true, // knife' \
            --expect-fail output_lines_are_events_and_read_back_after_a_restart \
            -- cargo test -p aibd --locked --test session_output output_lines_are_events_and_read_back_after_a_restart
          # S10 (a63ab preview.3) the database is created with the default mode, not 0600
          python3 -I scripts/knife.py crates/aibd/src/server.rs \
            '    platform::private_db_file(&db)?;' \
            '    // knife: no owner-only database file' \
            --expect-fail output_lines_are_events_and_read_back_after_a_restart \
            -- cargo test -p aibd --locked --test session_output output_lines_are_events_and_read_back_after_a_restart
          # S11 (a63ab 20:0x) the policy file accepts unknown fields: `interpreters_ok` from a file
          python3 -I scripts/knife.py crates/aibd/src/allowlist.rs \
            $'#[serde(deny_unknown_fields)]\nstruct PolicyFile {' \
            $'// knife: unknown fields accepted\nstruct PolicyFile {' \
            --expect-fail allowlist::tests::the_file_is_checked_field_by_field \
            -- cargo test -p aibd --locked --lib allowlist::tests::the_file_is_checked_field_by_field
          # ADR 0005 §5 queue (a63ab 19:13). Q1 LIFO instead of FIFO
          qk() { python3 -I scripts/knife.py crates/aibd/src/sessions.rs "$1" "$2" --expect-fail "$3" \
                   -- cargo test -p aibd --locked --test session_queue "$3"; }
          qk '                let Some(q) = g.queue.pop_front() else {' \
            '                let Some(q) = g.queue.pop_back() else { // knife' \
            a_full_limit_queues_and_the_waiting_start_in_arrival_order
          # Q2 a slot coming back starts nobody (no kick at the end of a stop)
          qk $'            self.kick(&mut g);\n        } else if worth_rescanning(&stop) && !g.shutting {' \
            $'            // knife: no kick\n        } else if worth_rescanning(&stop) && !g.shutting {' \
            a_full_limit_queues_and_the_waiting_start_in_arrival_order
          # Q3 the queue has no bound
          qk '                if g.queue.len() >= MAX_QUEUE {' \
            '                if g.queue.len() >= MAX_QUEUE && false { // knife' \
            the_queue_is_bounded_and_the_waiting_end_interrupted_at_shutdown
          # Q4 DELETE does not look in the queue: a waiting session cannot be cancelled
          qk '                if let Some(i) = g.queue.iter().position(|q| q.rec.id == id) {' \
            '                if let Some(i) = g.queue.iter().position(|q| q.rec.id == id && false) { // knife' \
            a_cancelled_queued_session_never_starts
          # Q5 a session left pending by a crash is not interrupted at the next start
          python3 -I scripts/knife.py crates/aib-store/src/sessions.rs \
            "holds_slot = 1 OR state = 'pending'" "holds_slot = 1 -- knife" \
            --expect-fail pending_and_running_are_interrupted_with_previous_state_and_process_flag \
            -- cargo test -p aib-store --locked --test sessions pending_and_running_are_interrupted_with_previous_state_and_process_flag
          # Q6 (043dd 11-10 M1) a session leaving the queue is not gated again
          qk '            let argv = match self.regate(&q) {' \
            '            let argv = match self.regate(&q).map(|_| q.rec.argv.clone()).or(Ok::<Vec<String>, ErrorCode>(q.rec.argv.clone())) { // knife: the gate runs, its answer is dropped' \
            a_queued_session_is_gated_again_when_it_leaves_the_queue
          # Q7 (043dd M2) a pending session does not say what it waits for
          qk '                rec.queue = Some(self.queue_view(&g, i + 1));' \
            '                rec.queue = None; let _ = self.queue_view(&g, i + 1); // knife' \
            a_pending_session_shows_its_place_and_who_holds_the_slots
          # Q8 (043dd f6500f85 L1) a dequeue thread that panics leaves the queue stopped
          python3 -I scripts/knife.py crates/aibd/src/sessions.rs \
            '        if std::thread::panicking() {' \
            '        if std::thread::panicking() && false { // knife' \
            --expect-fail sessions::tests::a_dequeue_thread_that_panics_does_not_stop_the_queue \
            -- cargo test -p aibd --locked --lib sessions::tests::a_dequeue_thread_that_panics_does_not_stop_the_queue
          # S9 (f1fae integ) the seat route skips the M1 gate: an unlisted program starts
          python3 -I scripts/knife.py crates/aibd/src/sessions.rs \
            $'    // #592 and the gate from #593; f1fae joined them, 043dd made them one helper).\n    let (req, asked) = match gate(&st, req).await {' \
            $'    // #592 and the gate from #593; f1fae joined them, 043dd made them one helper).\n    let asked = req.argv.first().cloned();\n    let (req, asked) = match Ok::<(Request, Option<String>), ApiError>((req, asked)) { // knife: no gate' \
            --expect-fail the_seat_route_refuses_an_unlisted_program_and_records_it \
            -- cargo test -p aibd --locked --test seat_sessions the_seat_route_refuses_an_unlisted_program_and_records_it
          # S6 an over-long line is not marked as cut
          python3 -I scripts/knife.py crates/aibd/src/session_output.rs \
            '                cut = true;' \
            '                cut = cut && false; // knife' \
            --expect-fail an_over_long_line_is_cut_and_the_next_line_still_arrives \
            -- cargo test -p aibd --locked --test session_output an_over_long_line_is_cut_and_the_next_line_still_arrives
          # S7 (1ced7 #591 L1) the key is never recorded: a retry creates a second seat
          python3 -I scripts/knife.py crates/aib-store/src/seats.rs \
            '                     VALUES (?1, ?2, ?3, ?4, ?5, ?6)",' \
            '                     SELECT ?1, ?2, ?3, ?4, ?5, ?6 WHERE 0", // knife' \
            --expect-fail a_retry_with_the_same_key_gets_the_first_seat_and_creates_nothing \
            -- cargo test -p aibd --locked --test seats a_retry_with_the_same_key_gets_the_first_seat_and_creates_nothing
          # S8 (1ced7 #591 L1) a key it cannot read is taken as no key
          python3 -I scripts/knife.py crates/aibd/src/seats.rs \
            '        Err(bad("Idempotency-Key must be 1-128 of A-Z a-z 0-9 - _ . :"))' \
            '        Ok(None) // knife' \
            --expect-fail seats::tests::keys \
            -- cargo test -p aibd --locked --lib seats::tests::keys
          # S12 (a63ab 20:32) an empty argument after argv[0] is refused again
          python3 -I scripts/knife.py crates/aibd/src/sessions.rs \
            '        if (i == 0 && a.is_empty()) || a.len() > MAX_ARG_BYTES' \
            '        if (a.is_empty() || i == 0 && a.is_empty()) || a.len() > MAX_ARG_BYTES' \
            --expect-fail sessions::tests::argv_rules \
            -- cargo test -p aibd --locked --lib sessions::tests::argv_rules
      # G1 (a9136, 11-10): a program that ends at once gives its slot back (macOS).
      # Each knife breaks one rule of the fork watcher / orphan check and must
      # turn its own unit test red. Bindings stay used (-D warnings).
      - name: G1 fork-watch knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          gk() { python3 -I scripts/knife.py "$1" "$2" "$3" --expect-fail "$4" \
                   -- cargo test -p aibd --locked --lib "$4"; }
          # G1a children listed through libproc again: a stale ESRCH reads as "cannot list"
          gk crates/aibd/src/platform/fork_watch.rs \
            '    Macos.children(pid)' \
            '    libproc::processes::pids_by_type(libproc::processes::ProcFilter::ByParentProcess { ppid: pid }).map_err(|_| SysError::Unknown) // knife' \
            platform::fork_watch::tests::a_childless_process_lists_empty_even_with_a_stale_errno
          # G1b a child gone before it was read is a gap again (the slot is never given back)
          gk crates/aibd/src/platform/fork_watch.rs \
            '                    unread_gone.store(true, Ordering::Relaxed);' \
            '                    gap(gaps, GAP_CHILD_UNREADABLE); let _ = unread_gone; // knife' \
            platform::fork_watch::tests::a_child_gone_before_it_is_read_is_covered_by_lineage_not_a_gap
          # G1c the orphan check is not widened: an orphan of an unread child is missed
          gk crates/aibd/src/lineage.rs \
            '                Ok(u) if u.unique > root_unique && wide && u.parent_unique > root_unique => {' \
            '                Ok(u) if u.unique > root_unique && wide && false && u.parent_unique > root_unique => { // knife' \
            lineage::tests::an_unread_gone_child_widens_the_orphan_candidates
          # G1d a child we may not read (alive, other reason) treated as gone
          gk crates/aibd/src/platform/fork_watch.rs \
            '                Err(SysError::Gone) if pr.lineage_on() => {' \
            '                Err(SysError::Gone | SysError::PermissionDenied) if pr.lineage_on() => { // knife' \
            platform::fork_watch::tests::a_child_unreadable_for_another_reason_stays_a_gap_with_lineage
          # G1e the flag is reset on every pass (043dd 21:42 #1): a later clean pass narrows the check again
          gk crates/aibd/src/platform/fork_watch.rs \
            '    let mut stack = vec![parent];' \
            $'    let mut stack = vec![parent];\n    unread_gone.store(false, Ordering::Relaxed); // knife' \
            platform::fork_watch::tests::unread_gone_is_latched_across_passes
          # G1f (setuid /bin/ps, 043dd THREAT) no sysctl fallback: a setuid child is a gap again
          gk crates/aibd/src/platform/fork_watch.rs \
            '        Err(SysError::PermissionDenied) => pr.start_other_uid(pid),' \
            '        Err(SysError::PermissionDenied) if false => pr.start_other_uid(pid), // knife' \
            platform::fork_watch::tests::a_setuid_child_is_read_through_the_fallback_and_followed
          # G1g a failed fallback is let through (a made-up start time)
          gk crates/aibd/src/platform/fork_watch.rs \
            '        Err(SysError::PermissionDenied) => pr.start_other_uid(pid),' \
            '        Err(SysError::PermissionDenied) => pr.start_other_uid(pid).or(Ok(0)), // knife' \
            platform::fork_watch::tests::a_refused_child_whose_fallback_fails_stays_a_gap
          # G1h (043dd efbe548d M1) sysinfo's 0 for a setuid process taken as "gone"
          gk crates/aibd/src/platform/tree.rs \
            '    if seen_start != 0 {' \
            '    if seen_start != 0 || start != 0 { // knife' \
            platform::tree::tests::a_setuid_process_with_no_sysinfo_start_is_checked_through_the_fallback
          # G1i an unverified process quietly dropped from "alive" (a false observed_clean)
          gk crates/aibd/src/platform/tree.rs \
            '    i != Ident::Gone' \
            '    i == Ident::Running // knife' \
            platform::tree::tests::an_unverified_process_still_counts_as_alive
          # F1 (1ced7 11-09 23:38) the stop drops which rule added the candidates
          gk crates/aibd/src/platform/session.rs \
            '                orphan_extra: r.orphan_candidates_extra,' \
            '                orphan_extra: 0, // knife' \
            platform::session::tests::a_macos_report_carries_its_candidate_check_into_the_stop
          # F2 slot_held without the candidate check (the record 1ced7 could not read)
          python3 -I scripts/knife.py crates/aibd/src/sessions.rs \
            '                        "candidates": cand}),' \
            '                        "cand": cand}), // knife' \
            --expect-fail a_slot_that_stays_unreadable_stays_held_with_the_reason \
            -- cargo test -p aibd --locked --test sessions a_slot_that_stays_unreadable_stays_held_with_the_reason
          # C1 (1ced7 c25144e1 DockHelper) a launchd service in its own coalition holds the slot again
          gk crates/aibd/src/platform/tree.rs \
            '        None if other_coalition(session, coalition()) => Candidate::OtherCoalition,' \
            '        None if other_coalition(session, coalition()) => Candidate::Unreadable, // knife' \
            platform::tree::tests::the_dockhelper_candidate_is_let_go_and_our_orphan_is_kept
          # C2 the coalition is checked before the marker: a marked process of ours is let go
          gk crates/aibd/src/platform/tree.rs \
            '        Some(true) => Candidate::Ours,' \
            '        Some(true) => if other_coalition(session, coalition()) { Candidate::OtherCoalition } else { Candidate::Ours }, // knife' \
            platform::tree::tests::the_dockhelper_candidate_is_let_go_and_our_orphan_is_kept
          # C3 the self-check is gone: a root read as another coalition keeps the filter on
          gk crates/aibd/src/platform/tree.rs \
            '        (Ok(m), Ok(r)) if r != m => (None, true),' \
            '        (Ok(m), Ok(r)) if r != m && false => (None, true), // knife' \
            platform::tree::tests::the_coalition_self_check
          # C4 (bb7dc H1) a candidate coalition read as 0 counts as another one
          gk crates/aibd/src/platform/tree.rs \
            '    matches!((session, candidate), (Some(s), Ok(c)) if c != 0 && c != s)' \
            '    matches!((session, candidate), (Some(s), Ok(c)) if c != s) // knife' \
            platform::tree::tests::the_dockhelper_candidate_is_let_go_and_our_orphan_is_kept
          # C5 (bb7dc M1) any root read error, not only Gone, turns the filter on
          gk crates/aibd/src/platform/tree.rs \
            '        (Ok(_), Err(_)) => (None, false),' \
            '        (Ok(m), Err(_)) => (Some(m), false), // knife' \
            platform::tree::tests::the_coalition_self_check
      # G1 root_unrecorded (DECISION-root-unrecorded-a9136-1110): macOS holds a new
      # program before exec until it is recorded. Each knife must turn its test red.
      - name: held-before-exec knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          # H1 the child does not wait for the go byte: the program runs while held
          python3 -I scripts/knife.py crates/aib-sys/src/held.rs \
            '        let n = unsafe { libc::read(go_r, go.as_mut_ptr().cast(), 1) };' \
            '        let n: isize = 1; let _ = (go_r, &mut go); // knife: never wait' \
            --expect-fail held::tests::the_program_runs_only_after_on_held_returns \
            -- cargo test -p aib-sys --locked --lib held::tests::the_program_runs_only_after_on_held_returns
          # H2 / H3 start_tree does not hold: an instant root is recorded too late,
          # and a detached grandchild of it is left running
          for t in an_instant_program_is_recorded_before_it_can_exit \
                   a_detached_grandchild_of_an_instant_root_is_recorded_and_stopped; do
            python3 -I scripts/knife.py crates/aibd/src/platform/tree.rs \
              $'    let (child, rec) = aib_sys::held::spawn_held(&mut c, |pid| record(spec, pid))\n        .map_err(StartFailedOr::NotStarted)?;' \
              '    let (child, rec): (_, Option<Recorded>) = (c.spawn().map_err(StartFailedOr::NotStarted)?, None); // knife: not held' \
              --expect-fail "$t" \
              -- cargo test -p aibd --locked --test tree "$t"
          done
      # M1 allowlist gate (1ced7 reverse tests, a63ab 19:57: K1 / K4 / K9 / K13 for
      # preview.3). Each knife takes one check out of the gate and must turn its own
      # test in tests/sessions_allowlist.rs red. A knife keeps every binding used
      # (`&& false`), RUSTFLAGS has -D warnings.
      - name: allowlist knives (macOS)
        if: env.RUN == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          ak() { python3 -I scripts/knife.py "$1" "$2" "$3" --expect-fail "$4" \
                   -- cargo test -p aibd --locked --test sessions_allowlist "$4"; }
          # K1 the program list is not checked: an unlisted /bin/echo starts
          ak crates/aibd/src/allowlist.rs \
            '    if !listed {' \
            '    if !listed && false { // knife' \
            both_routes_refuse_what_is_not_listed_and_start_what_is
          # K4 the env name list is not checked: NODE_OPTIONS / HOME reach the child
          ak crates/aibd/src/allowlist.rs \
            '    if names.any(|k| !p.env.iter().any(|a| env_name_eq(a, k))) {' \
            '    if names.any(|k| !p.env.iter().any(|a| env_name_eq(a, k))) && false { // knife' \
            both_routes_refuse_what_is_not_listed_and_start_what_is
          # K9 shells / interpreters are not refused at start: a listed link to /bin/sh runs
          ak crates/aibd/src/allowlist.rs \
            '        if is_interpreter(&real) || is_interpreter(a) {' \
            '        if (is_interpreter(&real) || is_interpreter(a)) && false { // knife' \
            a_listed_link_to_a_shell_is_refused_at_load_and_at_start
          # K13 a refusal leaves no audit record
          ak crates/aibd/src/sessions.rs \
            '            event_type: "session.spawn_rejected".into(),' \
            '            event_type: "session.knife_no_audit".into(), // knife' \
            the_audit_record_has_the_ruled_keys_and_no_request_value
      # DECISION-8 item 2 / DECISION-11 A: the Job Object on the real kernel.
      # Five runs in one job; each must be green.
      - name: aib-sys job (Windows) 5x
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "== run $i/5"
            cargo test -q -p aib-sys --locked || exit 1
          done
      - name: aib-sys job knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        run: ./scripts/check-win-job-knives.sh
      - name: aib-sys session knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        # preview.2 sessions: killing a session must take the whole tree. Two
        # knives, each must turn killing_a_session_takes_the_whole_tree red:
        # no terminate at all, and "only the root is killed" (ping survives).
        # No -q: this knife.py reads "test x ... FAILED" lines.
        run: |
          set -eu
          k() { python3 -I scripts/knife.py crates/aib-sys/src/session.rs "$1" "$2" \
                  --expect-fail killing_a_session_takes_the_whole_tree \
                  -- cargo test -p aib-sys --locked --test session_win; }
          k '        self.job.terminate(1)' '        Ok(()) // knife: no terminate'
          k '        self.job.terminate(1)' \
            '        self.child.kill().map_err(|_| SysError::Unknown) // knife: root only'
          # 1ced7 #543 High: a root whose handle cannot be opened after the spawn is
          # "not started" only once the root is gone AND the Job is empty
          k2() { python3 -I scripts/knife.py crates/aib-sys/src/session.rs "$1" "$2" \
                   --expect-fail "$3" -- cargo test -p aib-sys --locked --lib session::; }
          k2 '                let mut term = terminate;' \
            '                let mut term = |_: &Job| Ok::<(), SysError>(()); let _ = terminate; // knife: no kill' \
            a_failed_root_open_kills_and_confirms_the_whole_tree
          k2 '                    Ok(k) if k.all_gone() => e,' '                    Ok(_) => e, // knife: trust any report' \
            a_failed_root_open_whose_child_outlives_the_root_is_not_reaped
          k2 '                    return Err((SpawnError::Spawn(e), Some(Box::new(left))));' \
            '                    drop(left); return Err((SpawnError::Spawn(e), None)); // knife: drop the tree' \
            a_failed_root_open_whose_child_outlives_the_root_is_not_reaped
      - name: aibd Windows session adapter knives (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        # session_windows.rs maps aib-sys results to the shared stop: clean only
        # when the Job emptied AND every handle signaled; a not-reaped spawn keeps its pid.
        run: |
          set -eu
          k() { python3 -I scripts/knife.py crates/aibd/src/platform/session_windows.rs "$1" "$2" \
                  --expect-fail "$3" -- cargo test -p aibd --locked --lib platform::session_windows; }
          k '            let status = if k.all_gone() {' '            let status = if k.survivors.is_empty() {' \
            a_job_that_did_not_empty_is_never_clean
          k '        SpawnError::Spawn(SysError::NotReaped { pid, .. }) => Some(*pid),' \
            '        SpawnError::Spawn(SysError::NotReaped { .. }) => None,' \
            a_spawn_not_confirmed_gone_keeps_its_pid
          k '                _ => idle(timeout),' '                _ => Some(Exit::Code(0)), // knife: unreadable is an exit' \
            a_root_wait_or_exit_code_error_is_never_an_exit
          k '    std::thread::sleep(timeout.min(IDLE_MAX));' '    let _ = timeout.min(IDLE_MAX); // knife: no pause' \
            an_unanswered_root_wait_pauses_before_none_and_is_bounded
          k '    std::thread::sleep(timeout.min(IDLE_MAX));' '    std::thread::sleep(timeout.max(IDLE_MAX)); // knife: unbounded' \
            an_unanswered_root_wait_pauses_before_none_and_is_bounded
          # a9136 #555 Medium: failed starts not confirmed gone are kept and swept / listed at shutdown
          k '        (Some(_), Some(l)) => LEFTOVERS.lock().unwrap_or_else(|e| e.into_inner()).push(*l),' \
            '        (Some(_), Some(l)) => drop(l), // knife: not kept' \
            a_kept_failed_start_is_stopped_by_the_shutdown_sweep
          k '        (Some(pid), None) => UNHELD.lock().unwrap_or_else(|e| e.into_inner()).push(pid),' \
            '        (Some(_), None) => {} // knife: silent' \
            an_unheld_failed_start_is_listed_at_shutdown
          # #578: the Windows sweep moved into the Lifecycle impl (platform/lifecycle.rs)
          python3 -I scripts/knife.py crates/aibd/src/platform/lifecycle.rs \
            '        Swept::from_unconfirmed(super::session_windows::stop_leftovers(deadline))' \
            '        { let _ = deadline; Swept::NoneLeft } // knife: Windows sweeps nothing' \
            --expect-fail an_unheld_failed_start_is_listed_at_shutdown \
            -- cargo test -p aibd --locked --lib platform::session_windows
      - name: aibd Windows sessions wiring knife (Windows)
        if: env.RUN == 'true' && runner.os == 'Windows'
        shell: bash
        # default_spawn must be session_windows::spawn (a63ab 11-09: unwired,
        # every POST was 422 unsupported_platform). The knife puts the refusal
        # back; the real-aibd test must turn red.
        run: |
          set -eu
          # #578: the Windows spawn is chosen in the Lifecycle impl (platform/lifecycle.rs)
          python3 -I scripts/knife.py crates/aibd/src/platform/lifecycle.rs \
            '        Step::Done(super::session_windows::spawn)' \
            '        Step::Unsupported { step: StepId::Spawn, why: "knife: not wired" }' \
            --expect-fail delete_stops_the_grandchild_and_confirms_the_tree \
            -- cargo test -p aibd --locked --test sessions_windows
