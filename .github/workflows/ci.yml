# SPDX-License-Identifier: Apache-2.0
name: ci
# 10-11:只在 PR 和 main 上跑(推發佈分支不再另跑一批,PR 頁上只剩一批結果)
on:
  push:
    branches: [main]
  pull_request:
    # labeled:補貼 full-ci 標籤時重跑,完整 macOS 那幾格才會真的跑
    # 11-08 DECISION-24:ready_for_review = 草稿轉正式那一刻才跑 macOS。
    #   不收 edited:探針 #516 實測「只改說明」的 edited 輪就算整輪 skipped,也會讓 PR 從 CLEAN 變 BLOCKED
    #   (必過 6 格仍是 success)⇒ 疊著的 PR 改 base 回 main 不會自動重跑,所以疊著的 PR 照樣跑 macOS 3.12(第 3 項不做)。
    types: [opened, synchronize, reopened, labeled, ready_for_review]
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 11-08 DECISION-17 修訂:job 層排隊看「進入等待」的時間、不看推送先後 ⇒ 較舊那輪晚到會頂掉較新那輪在等的 macOS 格。
  #   先用這個幾秒的 ubuntu job 比對 main 現在的頭碼:main 推送且已經不是頭碼(stale)⇒ macOS 格不進共用組、改在 ubuntu
  #   只印原因(macos_unverified)不跑;發版那邊 release.yml 也只發「當下仍是 main 頭碼」的那輪。讀不到頭碼 ⇒ 當成最新照跑。
  #   只能縮小交錯窗口,不保證最新那輪一定跑完(補跑另一張)。
  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.t.outputs.stale }}
      head: ${{ steps.t.outputs.head }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha) || head=""
          if [ -z "$head" ]; then
            echo "::warning::could not read the head of $GITHUB_REF_NAME; treating this run as the newest (macOS runs)"
            echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$GITHUB_SHA" ]; then echo "stale=false" >> "$GITHUB_OUTPUT"
          else echo "stale=true" >> "$GITHUB_OUTPUT"; echo "::notice::$GITHUB_REF_NAME moved on to $head; macOS cells of this run ($GITHUB_SHA) are skipped (macos_unverified)"; fi
  # 11-08 PROPOSAL-19(a63ab 總結):只改文件的 PR 只跑文件檢查。
  #   main 有 6 個 smoke 必過格 ⇒ 不能 paths-ignore(必過格會一直等),也不能 job 層 if 跳過矩陣(只回一個沒格名的 smoke)。
  #   這裡先判斷(白名單、混合改動 / 算不出來 / main 推送一律 false),只改文件時順便做文件檢查;
  #   smoke / fresh-machine needs 這個 job:只改文件 ⇒ 換到 ubuntu 只印一行;這個 job 紅 ⇒ 6 格跟著紅(不改 ruleset 也擋得住合併)。
  #   判斷腳本優先用 base 那邊的版本(PR 改不到判斷本身);base 還沒有這支(第一次)才用這輪的。
  # 11-09 Andy「只動 Rust 就跳過」(a63ab 派):只改 crates/**、Cargo.toml、Cargo.lock(+ 白名單文件)⇒ rust_only,
  #   六格同樣換 ubuntu 只印一行(Rust 由 aibd.yml 測);讀 crates/ / Cargo.* 的 Python 測試在這裡逐支直接跑。
  #   main 推送 / 混合 / 算不出來 / 動到 .github/** 一律 false;base 版判斷腳本還沒有 rust_only 時只會印 docs_only ⇒ false。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.d.outputs.docs_only }}
      rust_only: ${{ steps.d.outputs.rust_only }}
      # light = docs_only 或 rust_only:smoke / fresh-machine 只看這個
      light: ${{ steps.d.outputs.light }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tool=aib/tools/release/docs_only.py
          if [ -n "$BASE" ] && git show "$BASE:$tool" > "$RUNNER_TEMP/docs_only.py" 2>/dev/null; then tool="$RUNNER_TEMP/docs_only.py"; fi
          out=$(python3 "$tool" decide --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD") || out=docs_only=false
          # 只認整行 docs_only=true / rust_only=true;其他(含舊版腳本只印一行、印錯)一律 false
          docs=false; rust=false
          case $'\n'"$out"$'\n' in *$'\n'docs_only=true$'\n'*) docs=true ;; esac
          case $'\n'"$out"$'\n' in *$'\n'rust_only=true$'\n'*) rust=true ;; esac
          if [ "$docs" = true ]; then rust=false; fi
          light=false; if [ "$docs" = true ] || [ "$rust" = true ]; then light=true; fi
          printf 'docs_only=%s\nrust_only=%s\nlight=%s\n' "$docs" "$rust" "$light" | tee -a "$GITHUB_OUTPUT"
      - name: docs check (only when the change is docs-only or Rust-only; checks the changed docs)
        if: steps.d.outputs.light == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 aib/tools/release/docs_only.py check --base "$BASE" --head "$HEAD"
      # 043dd #504 審 / a63ab 裁示:main 推送時會掃 .md 的測試(清單在 docs_only.py MD_SCAN_TESTS,守門測試管名單),
      #   只改文件時這裡逐支直接跑同一支,不自己重寫那些檢查(約 20 秒)
      - name: tests main runs over .md files
        if: steps.d.outputs.docs_only == 'true'
        # bb7dc #538 High:清單先取出來、驗 rc 與非空、每支檔案要在;任何一項不對就紅(不能零支跑完當綠)
        run: |
          list=$(python3 aib/tools/release/docs_only.py md-tests) || { echo "::error::docs_only.py md-tests failed (rc $?)"; exit 1; }
          [ -n "$list" ] || { echo "::error::docs_only.py md-tests printed no test: refusing to pass with nothing run"; exit 1; }
          rc=0; n=0
          for t in $list; do
            [ -f "$t" ] || { echo "::error::$t is listed but missing"; rc=1; continue; }
            echo "::group::$t"; python3 "$t" || { echo "::error::$t failed"; rc=1; }; echo "::endgroup::"
            n=$((n + 1))
          done
          echo "ran $n test file(s)"
          # bb7dc #538 b5ea0e7d:只有空白 / tab 的清單 [ -n ] 會過、迴圈 0 次 ⇒ 一定要真的跑到至少一支
          [ "$n" -gt 0 ] || { echo "::error::no listed test ran (the list was blank or every file was missing)"; exit 1; }
          exit $rc
      # a63ab 11-09:只改 Rust 時,讀 crates/ / Cargo.* 的 Python 測試(清單在 docs_only.py RUST_READ_TESTS,守門測試管名單)
      #   + 掃 .md 的那份,逐支直接跑同一支
      - name: Python tests that read crates/ or Cargo.* (only when the change is Rust-only)
        if: steps.d.outputs.rust_only == 'true'
        # bb7dc #538 High:清單先取出來、驗 rc 與非空、每支檔案要在;任何一項不對就紅(不能零支跑完當綠)
        run: |
          list=$(python3 aib/tools/release/docs_only.py rust-tests) || { echo "::error::docs_only.py rust-tests failed (rc $?)"; exit 1; }
          [ -n "$list" ] || { echo "::error::docs_only.py rust-tests printed no test: refusing to pass with nothing run"; exit 1; }
          rc=0; n=0
          for t in $list; do
            [ -f "$t" ] || { echo "::error::$t is listed but missing"; rc=1; continue; }
            echo "::group::$t"; python3 "$t" || { echo "::error::$t failed"; rc=1; }; echo "::endgroup::"
            n=$((n + 1))
          done
          echo "ran $n test file(s)"
          # bb7dc #538 b5ea0e7d:只有空白 / tab 的清單 [ -n ] 會過、迴圈 0 次 ⇒ 一定要真的跑到至少一支
          [ "$n" -gt 0 ] || { echo "::error::no listed test ran (the list was blank or every file was missing)"; exit 1; }
          exit $rc
      - name: not docs-only nor Rust-only
        if: steps.d.outputs.light != 'true'
        run: echo "::notice::not a docs-only or Rust-only change; smoke / fresh-machine run as usual"
  smoke:
    needs: [tip, docs]
    # 11-08 PROPOSAL-19:docs 紅 / 被跳過時也要跑到下面那一步把格子判紅(不然必過格只會卡在等待)
    if: ${{ !cancelled() }}
    # 10-25:沒設上限時一支測試卡住會把格子掛到預設 6 小時、佔滿 macOS 名額,後面所有 PR 排隊。
    #   macOS 整套 260 支約 40 分(最慢一支約 4 分)⇒ 上限 75 分,留將近一倍
    timeout-minutes: 75
    # 11-08 DECISION-17:main 推送的 macOS 格同一格 1 跑 1 等 —— group = workflow + job + ref + 格子、不砍跑中;
    #   新的一輪會頂掉還在等的舊輪(那個 commit 就沒有單獨的 macOS 結果,發版只認 workflow_run 那輪的 head_sha)。
    #   ubuntu 格與 PR 一律用 run_id 自成一組(等於不限),PR 的取消照頂層 concurrency。
    concurrency:
      group: ${{ github.event_name == 'push' && matrix.os == 'macos-latest' && needs.tip.outputs.stale != 'true' && format('{0}-smoke-{1}-{2}-{3}', github.workflow, github.ref, matrix.os, matrix.python) || format('{0}-smoke-run-{1}-{2}-{3}', github.workflow, github.run_id, matrix.os, matrix.python) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 10-15 human:每種電腦只測三版 —— 最舊(3.9,pyproject 宣告的下限)、主流 3.12、最新 3.14(14 格減成 6 格)
        python: ["3.9", "3.12", "3.14"]
    # 沒輪到的 macOS 格子改在 ubuntu 上印說明:格子名字照矩陣(還是 smoke (macos-latest, …)),不必排 macOS 的隊。
    #   這條件跟下面 RUN_CELL 同一句(runs-on 讀不到 env),改一邊要一起改。
    # 11-07:ubuntu-latest 換成 26.04 後 setup-python 找不到 3.9 ⇒ 只有 (ubuntu-latest, 3.9) 這格改跑 ubuntu-24.04;
    #   格子名字仍照矩陣(main 必過清單不變),pyproject 下限 3.9 不改。
    runs-on: ${{ ((matrix.os != 'macos-latest' || matrix.python == '3.12' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'int/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (matrix.os != 'macos-latest' || needs.tip.outputs.stale != 'true') && (matrix.os != 'macos-latest' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || !github.event.pull_request.draft)) && needs.docs.outputs.light != 'true') && (matrix.os == 'ubuntu-latest' && matrix.python == '3.9' && 'ubuntu-24.04' || matrix.os) || 'ubuntu-latest' }}
    env:
      # 10-15 維護者:一般 PR 的 macOS 只跑 3.12;macOS × 3.9/3.14 留給 main、整合(int/*)/發版(release/*)分支、
      #   或貼了 full-ci 標籤的 PR。六格仍然都會出現(main 的必過清單就是這六個名字),沒輪到的那幾格只印一行說明、直接綠。
      RUN_CELL: ${{ (matrix.os != 'macos-latest' || matrix.python == '3.12' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'int/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (matrix.os != 'macos-latest' || needs.tip.outputs.stale != 'true') && (matrix.os != 'macos-latest' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || !github.event.pull_request.draft)) && needs.docs.outputs.light != 'true' }}
    steps:
      - name: upstream jobs (tip / docs) must have passed
        if: needs.tip.result != 'success' || needs.docs.result != 'success'
        run: |
          echo "::error::tip=${{ needs.tip.result }} docs=${{ needs.docs.result }} — this required cell is red because an upstream job did not pass"
          exit 1
      - name: docs-only or Rust-only change, nothing else to run
        if: needs.docs.outputs.light == 'true'
        run: echo "::notice::docs-only=${{ needs.docs.outputs.docs_only }} rust-only=${{ needs.docs.outputs.rust_only }} change (see the docs job; Rust is tested by aibd.yml); this cell is not run"

      - name: cell not run on this PR
        if: env.RUN_CELL != 'true' && needs.tip.outputs.stale != 'true' && needs.docs.outputs.light != 'true'
        run: echo "::notice::macOS ${{ matrix.python }} not run on this PR — PRs run macOS 3.12 only, and only when ready for review (not draft); 3.9/3.14 run on main, int/*, release/*; label full-ci to run every cell"
      - name: macOS cell skipped, main moved on (macos_unverified)
        if: env.RUN_CELL != 'true' && needs.tip.outputs.stale == 'true' && needs.docs.outputs.light != 'true'
        run: echo "::warning::macos_unverified — main moved on to ${{ needs.tip.outputs.head }}; this commit (${{ github.sha }}) has no macOS ${{ matrix.python }} result of its own"
      - uses: actions/checkout@v4
        if: env.RUN_CELL == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_CELL == 'true'
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true   # 最新版剛出時 setup-python 可能只有預覽版
      - name: fast release metadata preflight
        if: env.RUN_CELL == 'true'
        run: python aib/tools/release/release_preflight.py --repo . --json
      - name: newer bash on macOS (aib traces bash 4.1+; the system /bin/bash 3.2 is reported as not measured)
        if: env.RUN_CELL == 'true' && runner.os == 'macOS'
        run: brew install bash && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: install (pip)
        if: env.RUN_CELL == 'true'
        run: python -m pip install .
      - name: installed entry point
        if: env.RUN_CELL == 'true'
        run: aib || test $? -eq 2
      - name: smoke test
        if: env.RUN_CELL == 'true'
        run: python -m unittest discover -s tests -v
      - name: core safety tests (each file on its own, like aib test does)
        if: env.RUN_CELL == 'true'
        shell: bash
        run: |
          python -m pip install pytest
          git config --global user.name ci && git config --global user.email ci@example.com
          rc=0
          for f in aib/tests/test-*.py; do
            # 每支最多 10 分鐘(macOS 沒有 timeout 指令 ⇒ 用 python 包);逾時印出是哪一支，整格照樣跑完其他支
            echo "::group::$f"
            python - "$f" <<'PY' || { echo "::error::$f failed or hung"; rc=1; }
          import os, signal, subprocess, sys
          p = subprocess.Popen([sys.executable, sys.argv[1]], start_new_session=True)   # 自成一組 ⇒ 逾時連它開的子行程一起收
          try:
              sys.exit(p.wait(timeout=600))
          except subprocess.TimeoutExpired:
              os.killpg(p.pid, signal.SIGKILL); p.wait()
              print("::error::%s still running after 600 s (killed with its children)" % sys.argv[1]); sys.exit(124)
          PY
            echo "::endgroup::"
          done
          exit $rc
  # 10-12:「全新電腦」—— 空的家目錄、沒有任何設定,照 README 的一行安裝裝起來,再跑新用戶最先會打的指令。
  #   任何一步卡住(要你設環境變數、噴 Python 錯誤)這關就紅。
  fresh-machine:
    needs: [tip, docs]
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    # 11-08 DECISION-17:main 推送的 macOS 格同一格 1 跑 1 等 —— group = workflow + job + ref + 格子、不砍跑中;
    #   新的一輪會頂掉還在等的舊輪(那個 commit 就沒有單獨的 macOS 結果,發版只認 workflow_run 那輪的 head_sha)。
    #   ubuntu 格與 PR 一律用 run_id 自成一組(等於不限),PR 的取消照頂層 concurrency。
    concurrency:
      group: ${{ github.event_name == 'push' && matrix.os == 'macos-latest' && needs.tip.outputs.stale != 'true' && format('{0}-fresh-machine-{1}-{2}-{3}', github.workflow, github.ref, matrix.os, matrix.python) || format('{0}-fresh-machine-run-{1}-{2}-{3}', github.workflow, github.run_id, matrix.os, matrix.python) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # 11-08 DECISION-24:macOS 格在一般 PR 不跑(比照 smoke 3.9 / 3.14:main、int/*、release/*、full-ci 才跑),
    #   草稿也不跑;這條件跟下面 RUN_CELL 同一句(runs-on 讀不到 env),改一邊要一起改
    runs-on: ${{ ((matrix.os == 'macos-latest' && (needs.tip.outputs.stale == 'true' || !((github.event_name != 'pull_request' || startsWith(github.head_ref, 'int/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || !github.event.pull_request.draft)))) || needs.docs.outputs.light == 'true') && 'ubuntu-latest' || matrix.os }}
    env:
      # 同上:main 已前進 / 這張 PR 不輪 macOS ⇒ 這輪的 macOS 格只印原因、不跑(這條件跟 runs-on 同一句,改一邊要一起改)
      RUN_CELL: ${{ !(matrix.os == 'macos-latest' && (needs.tip.outputs.stale == 'true' || !((github.event_name != 'pull_request' || startsWith(github.head_ref, 'int/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || !github.event.pull_request.draft)))) && needs.docs.outputs.light != 'true' }}
    steps:
      - name: upstream jobs (tip / docs) must have passed
        if: needs.tip.result != 'success' || needs.docs.result != 'success'
        run: |
          echo "::error::tip=${{ needs.tip.result }} docs=${{ needs.docs.result }} — this required cell is red because an upstream job did not pass"
          exit 1
      - name: docs-only or Rust-only change, nothing else to run
        if: needs.docs.outputs.light == 'true'
        run: echo "::notice::docs-only=${{ needs.docs.outputs.docs_only }} rust-only=${{ needs.docs.outputs.rust_only }} change (see the docs job; Rust is tested by aibd.yml); this cell is not run"
      # 跳過原因三選一、各印各的:只改文件(上面)/ 這張 PR 不輪 macOS / main 已前進(bb7dc #512 審:PR 跳過不能印成 main moved on)
      - name: macOS cell not run on this PR
        if: env.RUN_CELL != 'true' && needs.tip.outputs.stale != 'true' && needs.docs.outputs.light != 'true'
        run: echo "::notice::fresh-machine on macOS runs on main, int/*, release/* or PRs labelled full-ci (not on drafts)"
      - name: macOS cell skipped, main moved on (macos_unverified)
        if: env.RUN_CELL != 'true' && needs.tip.outputs.stale == 'true' && needs.docs.outputs.light != 'true'
        run: echo "::warning::macos_unverified — main moved on to ${{ needs.tip.outputs.head }}; this commit (${{ github.sha }}) has no fresh-machine macOS result of its own"
      - uses: actions/checkout@v4
        if: env.RUN_CELL == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_CELL == 'true'
        with:
          python-version: "3.12"
      - name: one-line install into an empty home, then a new user's first commands
        if: env.RUN_CELL == 'true'
        shell: bash
        run: |
          set -u
          git config --global user.name ci && git config --global user.email ci@example.com
          export HOME="$RUNNER_TEMP/fresh-home"; mkdir -p "$HOME"
          export AIB_SOURCE="$GITHUB_WORKSPACE" AIB_AI=none LANG=C.UTF-8
          unset EZ2_VAULT_DIR EZ2_VAULT_ROOT EZ2_ROUTE_REGISTRY EZ2_ROUTE_CONTRACT_SPEC
          bash install.sh --dir "$HOME/ez2-aib" </dev/null
          AIB="$HOME/.local/bin/aib"
          test -d "$HOME/.ez2-aib/identity" || { echo "::error::install did not run aib init"; exit 1; }
          "$AIB" --help >/dev/null || [ $? -eq 2 ]
          printf '# Tester\n\n## 職責\nwrite tests\n\n## 紅線\nnever delete data\n\n## 知識域\nPython\n' > "$RUNNER_TEMP/role.md"
          "$AIB" newrole --name Tester --prompt-file "$RUNNER_TEMP/role.md" </dev/null > "$RUNNER_TEMP/newrole.json"
          cat "$RUNNER_TEMP/newrole.json"
          # #41 起新人格卡放在 uid 資料夾(10-Roles/<uid>/角色.md),路徑照 newrole 回的 card_file 驗,不寫死名字
          card="$(python3 -c 'import json,sys; t=open(sys.argv[1],encoding="utf-8").read(); i=t.rfind("\n{"); print(json.loads(t[i+1 if i>=0 else t.index("{"):]).get("card_file",""))' "$RUNNER_TEMP/newrole.json")"
          case "$card" in "$HOME/.ez2-aib/vault/10-Roles/"*/角色.md) ;; *) echo "::error::newrole card_file is not under 10-Roles: $card"; exit 1 ;; esac
          test -f "$card" || { echo "::error::newrole did not create the role card ($card)"; exit 1; }
          set +e
          out="$("$AIB" plaza 2>&1)"; rc=$?
          set -e
          [ "$rc" = 2 ] && ! printf '%s' "$out" | grep -q Traceback || { echo "::error::aib plaza: rc=$rc $out"; exit 1; }
          set +e
          out="$("$AIB" room contacts </dev/null 2>&1)"; rc=$?
          set -e
          # 0.1.5 起艦長室(含 contacts / say)不在開源版:要說「開發中」、rc 2、不噴 Traceback
          [ "$rc" = 2 ] && printf '%s' "$out" | grep -q "still in development" && ! printf '%s' "$out" | grep -q Traceback \
            || { echo "::error::aib room contacts: rc=$rc $out"; exit 1; }
