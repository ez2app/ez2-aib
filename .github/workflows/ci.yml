# SPDX-License-Identifier: Apache-2.0
name: ci
# 10-11:只在 PR 和 main 上跑(推發佈分支不再另跑一批,PR 頁上只剩一批結果)
on:
  push:
    branches: [main]
  pull_request:
    # labeled:補貼 full-ci 標籤時重跑,完整 macOS 那幾格才會真的跑
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
# 11-08 DECISION-8 第 3 項:同一張 PR 推新頭碼就取消舊的那一輪;main 每次推送各自一組、不取消。
#   group 帶 workflow 名(ci / aibd 互不取消);PR 用 PR 號,main 用 github.sha(每次推送獨立,不會被下一次蓋掉)。
#   labeled 重跑同一個 SHA 也算同一張 PR ⇒ 會取消正在跑的那輪、照新標籤重跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 11-08 DECISION-17 修訂:job 層排隊看「進入等待」的時間、不看推送先後 ⇒ 較舊那輪晚到會頂掉較新那輪在等的 macOS 格。
  #   先用這個幾秒的 ubuntu job 比對 main 現在的頭碼:main 推送且已經不是頭碼(stale)⇒ macOS 格不進共用組、改在 ubuntu
  #   只印原因(macos_unverified)不跑;發版那邊 release.yml 也只發「當下仍是 main 頭碼」的那輪。讀不到頭碼 ⇒ 當成最新照跑。
  #   只能縮小交錯窗口,不保證最新那輪一定跑完(補跑另一張)。
  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.t.outputs.stale }}
      head: ${{ steps.t.outputs.head }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha) || head=""
          if [ -z "$head" ]; then
            echo "::warning::could not read the head of $GITHUB_REF_NAME; treating this run as the newest (macOS runs)"
            echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$GITHUB_SHA" ]; then echo "stale=false" >> "$GITHUB_OUTPUT"
          else echo "stale=true" >> "$GITHUB_OUTPUT"; echo "::notice::$GITHUB_REF_NAME moved on to $head; macOS cells of this run ($GITHUB_SHA) are skipped (macos_unverified)"; fi
  smoke:
    needs: tip
    # 10-25:沒設上限時一支測試卡住會把格子掛到預設 6 小時、佔滿 macOS 名額,後面所有 PR 排隊。
    #   macOS 整套 260 支約 40 分(最慢一支約 4 分)⇒ 上限 75 分,留將近一倍
    timeout-minutes: 75
    # 11-08 DECISION-17:main 推送的 macOS 格同一格 1 跑 1 等 —— group = workflow + job + ref + 格子、不砍跑中;
    #   新的一輪會頂掉還在等的舊輪(那個 commit 就沒有單獨的 macOS 結果,發版只認 workflow_run 那輪的 head_sha)。
    #   ubuntu 格與 PR 一律用 run_id 自成一組(等於不限),PR 的取消照頂層 concurrency。
    concurrency:
      group: ${{ github.event_name == 'push' && matrix.os == 'macos-latest' && needs.tip.outputs.stale != 'true' && format('{0}-smoke-{1}-{2}-{3}', github.workflow, github.ref, matrix.os, matrix.python) || format('{0}-smoke-run-{1}-{2}-{3}', github.workflow, github.run_id, matrix.os, matrix.python) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 10-15 human:每種電腦只測三版 —— 最舊(3.9,pyproject 宣告的下限)、主流 3.12、最新 3.14(14 格減成 6 格)
        python: ["3.9", "3.12", "3.14"]
    # 沒輪到的 macOS 格子改在 ubuntu 上印說明:格子名字照矩陣(還是 smoke (macos-latest, …)),不必排 macOS 的隊。
    #   這條件跟下面 RUN_CELL 同一句(runs-on 讀不到 env),改一邊要一起改。
    # 11-07:ubuntu-latest 換成 26.04 後 setup-python 找不到 3.9 ⇒ 只有 (ubuntu-latest, 3.9) 這格改跑 ubuntu-24.04;
    #   格子名字仍照矩陣(main 必過清單不變),pyproject 下限 3.9 不改。
    runs-on: ${{ ((matrix.os != 'macos-latest' || matrix.python == '3.12' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'int/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (matrix.os != 'macos-latest' || needs.tip.outputs.stale != 'true')) && (matrix.os == 'ubuntu-latest' && matrix.python == '3.9' && 'ubuntu-24.04' || matrix.os) || 'ubuntu-latest' }}
    env:
      # 10-15 維護者:一般 PR 的 macOS 只跑 3.12;macOS × 3.9/3.14 留給 main、整合(int/*)/發版(release/*)分支、
      #   或貼了 full-ci 標籤的 PR。六格仍然都會出現(main 的必過清單就是這六個名字),沒輪到的那幾格只印一行說明、直接綠。
      RUN_CELL: ${{ (matrix.os != 'macos-latest' || matrix.python == '3.12' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'int/') || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (matrix.os != 'macos-latest' || needs.tip.outputs.stale != 'true') }}
    steps:
      - name: cell not run on this PR
        if: env.RUN_CELL != 'true' && needs.tip.outputs.stale != 'true'
        run: echo "::notice::macOS ${{ matrix.python }} runs only on main, int/* and release/* branches, or PRs labelled full-ci"
      - name: macOS cell skipped, main moved on (macos_unverified)
        if: env.RUN_CELL != 'true' && needs.tip.outputs.stale == 'true'
        run: echo "::warning::macos_unverified — main moved on to ${{ needs.tip.outputs.head }}; this commit (${{ github.sha }}) has no macOS ${{ matrix.python }} result of its own"
      - uses: actions/checkout@v4
        if: env.RUN_CELL == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_CELL == 'true'
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true   # 最新版剛出時 setup-python 可能只有預覽版
      - name: fast release metadata preflight
        if: env.RUN_CELL == 'true'
        run: python aib/tools/release/release_preflight.py --repo . --json
      - name: newer bash on macOS (aib traces bash 4.1+; the system /bin/bash 3.2 is reported as not measured)
        if: env.RUN_CELL == 'true' && runner.os == 'macOS'
        run: brew install bash && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: install (pip)
        if: env.RUN_CELL == 'true'
        run: python -m pip install .
      - name: installed entry point
        if: env.RUN_CELL == 'true'
        run: aib || test $? -eq 2
      - name: smoke test
        if: env.RUN_CELL == 'true'
        run: python -m unittest discover -s tests -v
      - name: core safety tests (each file on its own, like aib test does)
        if: env.RUN_CELL == 'true'
        shell: bash
        run: |
          python -m pip install pytest
          git config --global user.name ci && git config --global user.email ci@example.com
          rc=0
          for f in aib/tests/test-*.py; do
            # 每支最多 10 分鐘(macOS 沒有 timeout 指令 ⇒ 用 python 包);逾時印出是哪一支，整格照樣跑完其他支
            echo "::group::$f"
            python - "$f" <<'PY' || { echo "::error::$f failed or hung"; rc=1; }
          import os, signal, subprocess, sys
          p = subprocess.Popen([sys.executable, sys.argv[1]], start_new_session=True)   # 自成一組 ⇒ 逾時連它開的子行程一起收
          try:
              sys.exit(p.wait(timeout=600))
          except subprocess.TimeoutExpired:
              os.killpg(p.pid, signal.SIGKILL); p.wait()
              print("::error::%s still running after 600 s (killed with its children)" % sys.argv[1]); sys.exit(124)
          PY
            echo "::endgroup::"
          done
          exit $rc
  # 10-12:「全新電腦」—— 空的家目錄、沒有任何設定,照 README 的一行安裝裝起來,再跑新用戶最先會打的指令。
  #   任何一步卡住(要你設環境變數、噴 Python 錯誤)這關就紅。
  fresh-machine:
    needs: tip
    timeout-minutes: 20
    # 11-08 DECISION-17:main 推送的 macOS 格同一格 1 跑 1 等 —— group = workflow + job + ref + 格子、不砍跑中;
    #   新的一輪會頂掉還在等的舊輪(那個 commit 就沒有單獨的 macOS 結果,發版只認 workflow_run 那輪的 head_sha)。
    #   ubuntu 格與 PR 一律用 run_id 自成一組(等於不限),PR 的取消照頂層 concurrency。
    concurrency:
      group: ${{ github.event_name == 'push' && matrix.os == 'macos-latest' && needs.tip.outputs.stale != 'true' && format('{0}-fresh-machine-{1}-{2}-{3}', github.workflow, github.ref, matrix.os, matrix.python) || format('{0}-fresh-machine-run-{1}-{2}-{3}', github.workflow, github.run_id, matrix.os, matrix.python) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ (matrix.os == 'macos-latest' && needs.tip.outputs.stale == 'true') && 'ubuntu-latest' || matrix.os }}
    env:
      # 同上:main 已前進 ⇒ 這輪的 macOS 格只印原因、不跑(這條件跟 runs-on 同一句,改一邊要一起改)
      RUN_CELL: ${{ !(matrix.os == 'macos-latest' && needs.tip.outputs.stale == 'true') }}
    steps:
      - name: macOS cell skipped, main moved on (macos_unverified)
        if: env.RUN_CELL != 'true'
        run: echo "::warning::macos_unverified — main moved on to ${{ needs.tip.outputs.head }}; this commit (${{ github.sha }}) has no fresh-machine macOS result of its own"
      - uses: actions/checkout@v4
        if: env.RUN_CELL == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_CELL == 'true'
        with:
          python-version: "3.12"
      - name: one-line install into an empty home, then a new user's first commands
        if: env.RUN_CELL == 'true'
        shell: bash
        run: |
          set -u
          git config --global user.name ci && git config --global user.email ci@example.com
          export HOME="$RUNNER_TEMP/fresh-home"; mkdir -p "$HOME"
          export AIB_SOURCE="$GITHUB_WORKSPACE" AIB_AI=none LANG=C.UTF-8
          unset EZ2_VAULT_DIR EZ2_VAULT_ROOT EZ2_ROUTE_REGISTRY EZ2_ROUTE_CONTRACT_SPEC
          bash install.sh --dir "$HOME/ez2-aib" </dev/null
          AIB="$HOME/.local/bin/aib"
          test -d "$HOME/.ez2-aib/identity" || { echo "::error::install did not run aib init"; exit 1; }
          "$AIB" --help >/dev/null || [ $? -eq 2 ]
          printf '# Tester\n\n## 職責\nwrite tests\n\n## 紅線\nnever delete data\n\n## 知識域\nPython\n' > "$RUNNER_TEMP/role.md"
          "$AIB" newrole --name Tester --prompt-file "$RUNNER_TEMP/role.md" </dev/null > "$RUNNER_TEMP/newrole.json"
          cat "$RUNNER_TEMP/newrole.json"
          # #41 起新人格卡放在 uid 資料夾(10-Roles/<uid>/角色.md),路徑照 newrole 回的 card_file 驗,不寫死名字
          card="$(python3 -c 'import json,sys; t=open(sys.argv[1],encoding="utf-8").read(); i=t.rfind("\n{"); print(json.loads(t[i+1 if i>=0 else t.index("{"):]).get("card_file",""))' "$RUNNER_TEMP/newrole.json")"
          case "$card" in "$HOME/.ez2-aib/vault/10-Roles/"*/角色.md) ;; *) echo "::error::newrole card_file is not under 10-Roles: $card"; exit 1 ;; esac
          test -f "$card" || { echo "::error::newrole did not create the role card ($card)"; exit 1; }
          set +e
          out="$("$AIB" plaza 2>&1)"; rc=$?
          set -e
          [ "$rc" = 2 ] && ! printf '%s' "$out" | grep -q Traceback || { echo "::error::aib plaza: rc=$rc $out"; exit 1; }
          set +e
          out="$("$AIB" room contacts </dev/null 2>&1)"; rc=$?
          set -e
          # 0.1.5 起艦長室(含 contacts / say)不在開源版:要說「開發中」、rc 2、不噴 Traceback
          [ "$rc" = 2 ] && printf '%s' "$out" | grep -q "still in development" && ! printf '%s' "$out" | grep -q Traceback \
            || { echo "::error::aib room contacts: rc=$rc $out"; exit 1; }
