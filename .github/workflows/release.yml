# SPDX-License-Identifier: Apache-2.0
# Publish to PyPI when a maintainer pushes a version tag (v0.1.0 …). Tags are created by a human only.
# Uses PyPI trusted publishing: no API token is stored in this repository.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      - name: build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
