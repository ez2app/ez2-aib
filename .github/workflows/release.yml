# SPDX-License-Identifier: Apache-2.0
# Publish to PyPI. Two ways in, one gate:
#   - a maintainer runs this workflow by hand on main ("Run workflow" / workflow_dispatch): the `tag` job reads the
#     version from pyproject.toml, creates the tag v<version> and the GitHub release (notes = that version's CHANGELOG
#     section), and the `pypi` job in the same run builds from that tag and uploads it; or
#   - a maintainer pushes a version tag (v0.1.0 …): only the `pypi` job runs.
# The upload always waits for a human to approve the `pypi` environment before anything reaches PyPI
# (that environment must allow the branch `main` and tags `v*`).
# Only one release runs at a time. Uses PyPI trusted publishing: no API token is stored in this repository.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: refuse anything but main
        run: test "$GITHUB_REF_NAME" = main || { echo "::error::run this on main (got $GITHUB_REF_NAME)"; exit 1; }
      - name: create the tag and the release for the version on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          t="v$v"
          if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
            echo "::error::tag $t already exists; bump the version in pyproject.toml first"; exit 1
          fi
          head -n 20 CHANGELOG.md | grep -q "^## $v" || { echo "::error::CHANGELOG.md has no '## $v' section at the top"; exit 1; }
          awk -v h="## $v" '$0 ~ /^## / { if (on) exit; on = ($0 == h || index($0, h " ") == 1); next } on' CHANGELOG.md > notes.md
          git tag "$t" "$GITHUB_SHA"
          git push origin "refs/tags/$t"
          gh release create "$t" --verify-tag --title "$t" --notes-file notes.md
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "created $t at $GITHUB_SHA; the upload below waits for approval of the pypi environment"
  pypi:
    needs: tag
    if: always() && (github.ref_type == 'tag' || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "tag $TAG != pyproject $v"; exit 1; }
      - name: build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
