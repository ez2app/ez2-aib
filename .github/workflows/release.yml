# SPDX-License-Identifier: Apache-2.0
# Publish each new main version to PyPI, retaining the human upload gate.
# Successful main CI without a new version skips release work. Other entry points:
#   - a maintainer runs this workflow by hand on main ("Run workflow" / workflow_dispatch): the `tag` job reads the
#     version from pyproject.toml, creates the tag v<version> and the GitHub release (notes = that version's CHANGELOG
#     section), and the `pypi` job in the same run builds from that tag and uploads it; or
#   - a maintainer pushes a version tag (v0.1.0 …): only the `pypi` job runs.
# The upload always waits for a human to approve the `pypi` environment before anything reaches PyPI
# (that environment must allow the branch `main` and tags `v*`).
# Only one release runs at a time. Uses PyPI trusted publishing: no API token is stored in this repository.
# Before the upload, the `precheck` job builds the package and checks it on Linux and macOS: it installs into a clean
# environment and runs, and users on the previous and on the oldest release still on PyPI upgrade to it (pipx, pip in a
# virtual environment, and `aib update` for the one-line install). The upload only starts when that passes.
# After the upload, the `verify` job checks what users actually get from PyPI (PyPI can lag a few minutes): the new
# version installs and runs, and the same upgrades work with the commands aib runs itself.
name: release
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: refuse anything but main
        run: test "$GITHUB_REF_NAME" = main || { echo "::error::run this on main (got $GITHUB_REF_NAME)"; exit 1; }
      - name: create the tag and the release for the version on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          t="v$v"
          if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo "tag $t already exists; no new version to publish"
              exit 0
            fi
            echo "::error::tag $t already exists; bump the version in pyproject.toml first"; exit 1
          fi
          head -n 20 CHANGELOG.md | grep -q "^## $v" || { echo "::error::CHANGELOG.md has no '## $v' section at the top"; exit 1; }
          awk -v h="## $v" '$0 ~ /^## / { if (on) exit; on = ($0 == h || index($0, h " ") == 1); next } on' CHANGELOG.md > notes.md
          release_sha=$(git rev-parse HEAD)
          git tag "$t" "$release_sha"
          git push origin "refs/tags/$t"
          gh release create "$t" --verify-tag --title "$t" --notes-file notes.md
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "created $t at $release_sha; the upload below waits for approval of the pypi environment"
  precheck:
    needs: tag
    if: always() && (github.ref_type == 'tag' || needs.tag.outputs.tag != '')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AIB_AI: none
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: which versions
        id: v
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          prev=$(python .github/scripts/prev_release.py "$v")
          oldest=$(python .github/scripts/prev_release.py --oldest "$v")
          olds=$prev; [ "$oldest" = "$prev" ] || olds="$prev $oldest"
          { echo "v=$v"; echo "prev=$prev"; echo "olds=$olds"; } >> "$GITHUB_OUTPUT"
          echo "new $v, upgrading from: $olds"
      - name: build the package that would be uploaded
        shell: bash
        run: |
          python -m pip install -q build && python -m build
          ls dist/*.whl
      - name: the built package installs into a clean environment and runs
        shell: bash
        run: |
          v="${{ steps.v.outputs.v }}"
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/python" -m pip install -q --no-cache-dir dist/*.whl
          # 先存下來再比:grep -q 一找到就結束,pip 還在寫 ⇒ BrokenPipe,pipefail 下整行算失敗(0.1.7 第一次發版就這樣假紅)
          shown=$("$RUNNER_TEMP/fresh/bin/pip" show ez2-aib)
          grep -qx "Version: $v" <<<"$shown" || { echo "::error::the built package is not $v"; exit 1; }
          cmd=$(python .github/scripts/update_cmd.py "$RUNNER_TEMP/fresh/bin/python")
          case "$cmd" in *"pip install"*"ez2-aib"*) ;; *) echo "::error::a pip install of $v does not update itself (got: $cmd)"; exit 1;; esac
          export HOME="$RUNNER_TEMP/home-fresh"; mkdir -p "$HOME"
          set +e; out="$("$RUNNER_TEMP/fresh/bin/aib" room </dev/null 2>&1)"; rc=$?; set -e
          [ "$rc" = 2 ] && ! printf '%s' "$out" | grep -q Traceback || { echo "::error::aib room: rc=$rc $out"; exit 1; }
          "$RUNNER_TEMP/fresh/bin/aib" --help >/dev/null || [ $? -eq 2 ]
      - name: upgrade from the previous and the oldest release (pipx, pip, one-line)
        shell: bash
        run: |
          v="${{ steps.v.outputs.v }}"; prev="${{ steps.v.outputs.prev }}"
          python -m pip install -q pipx
          for old in ${{ steps.v.outputs.olds }}; do
            # 上一版用 pipx 裝的一定要認得怎麼更新自己;更舊的、與 pip 裝的(0.1.7 前不認得)只提醒
            strict=0; [ "$old" = "$prev" ] && strict=1
            STRICT=$strict bash .github/scripts/upgrade_check.sh pipx "$old" "$v" "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
            bash .github/scripts/upgrade_check.sh pip "$old" "$v" "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
            STRICT=$strict bash .github/scripts/upgrade_check.sh oneline "$old" "$v"
          done
  pypi:
    needs: [tag, precheck]
    if: always() && needs.precheck.result == 'success' && (github.ref_type == 'tag' || needs.tag.outputs.tag != '')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "tag $TAG != pyproject $v"; exit 1; }
      - name: build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  verify:
    needs: [tag, pypi]
    if: always() && needs.pypi.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AIB_AI: none
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: which versions
        id: v
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          prev=$(python .github/scripts/prev_release.py "$v")
          oldest=$(python .github/scripts/prev_release.py --oldest "$v")
          olds=$prev; [ "$oldest" = "$prev" ] || olds="$prev $oldest"
          { echo "v=$v"; echo "prev=$prev"; echo "olds=$olds"; } >> "$GITHUB_OUTPUT"
          echo "new $v, upgrading from: $olds"
      - name: the new version installs from PyPI and runs
        shell: bash
        run: |
          v="${{ steps.v.outputs.v }}"
          python -m venv "$RUNNER_TEMP/fresh"
          for i in $(seq 1 30); do "$RUNNER_TEMP/fresh/bin/pip" install -q --no-cache-dir "ez2-aib==$v" && break; echo "ez2-aib $v not on PyPI yet ($i/30)"; sleep 20; done
          shown=$("$RUNNER_TEMP/fresh/bin/pip" show ez2-aib)
          grep -qx "Version: $v" <<<"$shown" || { echo "::error::ez2-aib $v did not install from PyPI"; exit 1; }
          export HOME="$RUNNER_TEMP/home-fresh"; mkdir -p "$HOME"
          set +e; out="$("$RUNNER_TEMP/fresh/bin/aib" room </dev/null 2>&1)"; rc=$?; set -e
          [ "$rc" = 2 ] && ! printf '%s' "$out" | grep -q Traceback || { echo "::error::aib room: rc=$rc $out"; exit 1; }
          "$RUNNER_TEMP/fresh/bin/aib" --help >/dev/null || [ $? -eq 2 ]
      - name: upgrade from the previous and the oldest release (pipx, pip from PyPI)
        shell: bash
        run: |
          v="${{ steps.v.outputs.v }}"; prev="${{ steps.v.outputs.prev }}"
          python -m pip install -q pipx
          bash .github/scripts/wait_pypi_latest.sh "$v"    # unpinned upgrades must see the new one first (CDN lag)
          for old in ${{ steps.v.outputs.olds }}; do
            # 上一版用 pipx 裝的一定要認得怎麼更新自己;更舊的、與 pip 裝的(0.1.7 前不認得)只提醒
            strict=0; [ "$old" = "$prev" ] && strict=1
            STRICT=$strict bash .github/scripts/upgrade_check.sh pipx "$old" "$v"
            bash .github/scripts/upgrade_check.sh pip "$old" "$v"
          done
